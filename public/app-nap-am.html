<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nạp âm ngũ hành — Tử Vi Minh Bảo</title>
<meta name="description" content="Tra nạp âm ngũ hành theo năm sinh (Hải Trung Kim, Lô Trung Hỏa…) — Thiên Can, Địa Chi, hành bản mệnh. Hỏi trợ lý AI luận hợp màu, hướng, tuổi.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=12">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--red);font-size:13px;margin-top:8px;display:none}
.err.active{display:block}
#resPanel{display:none;max-width:640px}
/* Kết quả nạp âm — "tài liệu" nền sáng cố định, khớp bản standalone */
.result-eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9A7B3A;margin-bottom:10px}
.nap-am-result{display:grid;grid-template-columns:repeat(3,1fr) 2fr;gap:1px;background:#e6e0d4;border:1px solid #e6e0d4;border-radius:10px;overflow:hidden;margin-bottom:6px}
.na-cell{background:#fff;padding:18px 18px}
.na-cell-label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9a8a6a;margin-bottom:10px}
.na-cell-val{font-size:30px;font-weight:400;color:#061A2E;line-height:1}
.na-cell [style*="var(--text-lt)"]{color:#9a8a6a!important}
.na-hanh-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.na-info{font-size:13px;color:#444;line-height:1.7;padding-top:8px;border-top:1px solid #E8E8E8;margin-top:12px}
@media(max-width:700px){.nap-am-result{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.nap-am-result{grid-template-columns:1fr}}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Nạp âm ngũ hành</b><span>Hành bản mệnh theo năm sinh</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div id="shellRecent"></div>
      <div class="form-card" id="birthPanel">
        <h2>Năm sinh (dương lịch)</h2>
        <p class="sub">Tra Thiên Can, Địa Chi, nạp âm ngũ hành (tên hoa giáp) và hành bản mệnh theo năm sinh, rồi hỏi trợ lý luận hợp màu, hướng, tuổi.</p>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:150px"><label>Năm sinh</label><input type="number" id="year" placeholder="1990" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="calculate()">Tra nạp âm →</button>
        </div>
        <div class="err" id="error-msg"></div>
      </div>

      <div id="resPanel">
        <div class="result-eyebrow" id="res-eyebrow"></div>
        <div class="nap-am-result" id="nap-am-result"></div>
        <div class="ask" data-ask="Mệnh nạp âm này hợp màu gì, hướng nào, tuổi nào; kỵ gì? Luận giúp tôi.">✦ Hỏi trợ lý luận sâu nạp âm</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='nap-am';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'nap-am',title:'Nạp âm ngũ hành',desc:'Tra Thiên Can · Địa Chi · nạp âm (tên hoa giáp) và hành bản mệnh theo năm sinh, rồi hỏi <b>trợ lý AI</b> hợp màu, hướng, tuổi và điều nên tránh.'};</script>
<script src="/tools-shared/nap-am.js?v=1"></script>
<script src="/auth.js"></script>
<script src="/shell.js?v=34"></script>
<script>
// Ô giữa dùng CHUNG module /tools-shared/nap-am.js với trang standalone
// /tools/nap-am.html → kết quả y hệt. Rail nhận chính data module tính.
function calculate(){
  var y=parseInt(document.getElementById('year').value);
  var err=document.getElementById('error-msg');
  err.classList.remove('active');
  var r=NapAmTool.compute(y);
  if(!r.ok){ err.textContent=r.error; err.classList.add('active'); return; }
  document.getElementById('res-eyebrow').textContent=r.eyebrowText;
  document.getElementById('nap-am-result').innerHTML=r.resultHTML;
  document.getElementById('birthPanel').style.display='none';
  document.getElementById('resPanel').style.display='block';
  document.getElementById('btnEdit').style.display='';
  if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
  Shell.setContext({
    scenario:{type:'nap-am',data:r.data},
    label:'Nạp âm '+r.data.canChi+' · '+r.data.napAm,
    greeting:'Năm **'+r.data.nam+'** — bản mệnh **'+r.data.napAm+'** (hành '+r.data.hanh+'). Bạn muốn tôi luận điều gì?',
    chips:['Hợp màu gì, kỵ màu gì?','Hướng nhà/bàn làm việc nào hợp?','Tuổi nào hợp, tuổi nào khắc?','Vật phẩm phong thủy nào nên đeo?']
  });
  document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
}
function showForm(){
  document.getElementById('resPanel').style.display='none';
  document.getElementById('birthPanel').style.display='block';
  document.getElementById('btnEdit').style.display='none';
}
document.getElementById('year').addEventListener('keydown',function(e){if(e.key==='Enter')calculate();});
</script>
<script>/*SHELL_RESTORE_BOOT*/(function(){function _r(){var r=window.Shell&&Shell.pendingRestore&&Shell.pendingRestore();if(r&&r.form){Shell.fillForm(r.form);calculate();}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_r);else _r();})();</script>
</body>
</html>

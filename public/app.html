<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lập lá số Tử Vi — Tử Vi Minh Bảo</title>
<meta name="description" content="Lập lá số Tử Vi theo cổ pháp và hỏi trợ lý AI theo ngữ cảnh trong Luận Đường — không gian mệnh lý.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" as="style" onload="this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/shell.css?v=18">
<link rel="stylesheet" href="/laso-chart.css?v=3">
<style>
/* Center riêng của trang Lá số */
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;box-shadow:var(--shadow);max-width:640px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none;transition:.15s}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#chartPanel{display:none}
.birth-bar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:11px;padding:10px 13px;box-shadow:var(--shadow);margin-bottom:14px}
.birth-bar .tag{font-size:12.5px;color:var(--text-mid);background:var(--paper-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px}
.birth-bar .tag b{color:var(--text)}
.birth-bar .yr{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-mid)}
.birth-bar .yr select{border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;background:var(--white);color:var(--text);font-weight:600;font-family:inherit}
.chart-wrap{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Lập lá số Tử Vi</b><span>Một thời khắc chào đời, cả vận mệnh hé lộ</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa thông tin</button>
        <a class="btn pri" id="btnLuan" href="/app/luan-giai?auto=1" style="display:none">Luận giải chi tiết →</a>
        <a class="btn" id="btnBatTu" href="/app/bat-tu?auto=1" style="display:none">Bát Tự →</a>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div id="shellRecent"></div>
      <div class="form-card" id="birthPanel">
        <h2>Nhập thông tin ngày sinh</h2>
        <p class="sub">Lá số lập theo cổ pháp, chính xác giờ sinh càng tốt. Sau khi có lá số, hỏi trợ lý ở khung bên phải.</p>
        <div id="tuviFormHost"></div>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:96px"><label>Năm luận</label><input type="number" id="inpNamxem" value="2026" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="doAnSao()">Lập lá số →</button>
        </div>
      </div>

      <div id="chartPanel" data-ws-result>
        <div class="birth-bar" id="birthBar"></div>
        <div class="chart-wrap"><div id="lasoContainer"></div></div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='la-so';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'la-so',title:'Lá số Tử Vi Đẩu Số',desc:'Nhập giờ sinh để lập lá số theo cổ pháp - 12 cung, chính tinh, cách cục, đại vận. Xong rồi hỏi <b>trợ lý AI</b> ở khung bên phải luận sâu bất cứ điều gì.'};</script>
<script src="/tuvi-ansao-engine.js"></script>
<script src="/laso-chart.js?v=3"></script>
<script src="/tuvi-form.js?v=1"></script>
<script src="/auth.js?v=2"></script>
  <script src="/nav.js?v=22" data-icons-only></script>
<script src="/shell.js?v=67"></script>
<script>
// ── Form nhập (dùng chung TuviForm — có "Sinh ở ngoài Việt Nam?" + parity giờ
// sinh lịch sử với standalone) ──
TuviForm.render('tuviFormHost', {mode:'compact', gioitinh:'nam'});

// ── An sao + render (tái dùng engine + laso-chart.js), gắn context cho rail ──
function doAnSao(){
  var btn=document.getElementById('btnGo');
  var namxem=parseInt(document.getElementById('inpNamxem').value)||new Date().getFullYear();
  var fdIn=TuviForm.getData();
  var name=fdIn.hoten, gioitinh=fdIn.gioitinh, ngay=fdIn.ngay, thang=fdIn.thang, nam=fdIn.nam, gioHour=fdIn.gioHour, gioPhut=fdIn.gioPhut, gioIdx=fdIn.gioIdx;
  if(!ngay||!thang||!nam){ alert('Vui lòng nhập đầy đủ ngày, tháng, năm sinh.'); return; }
  btn.disabled=true;btn.textContent='Đang an sao…';
  try{
    var gioChi=CHI[gioIdx];
    var conv=convertDuongToAm(ngay,thang,nam,gioHour);conv.gioIdx=gioIdx;
    var ls=anSaoLaSo({ngayAL:conv.amLich.day,thangAL:conv.amLich.month,namAL:conv.amLich.year,canNam:conv.canNam,chiNam:conv.chiNam,gioIdx:gioIdx,gioitinh:gioitinh,namXem:namxem});
    var fd={name:name,gioitinh:gioitinh,dd:ngay,mm:thang,yyyy:nam,hh:gioHour,pp:gioPhut,gioChi:gioChi,amLich:conv.amLich};
    document.getElementById('lasoContainer').innerHTML=renderGrid(ls,fd);
    if(window.mountIcons) window.mountIcons(document.getElementById('lasoContainer')); // ô giữa mang span [data-icon]
    document.getElementById('birthBar').innerHTML=
      '<span class="tag"><b>'+esc(name||'—')+'</b> · '+(gioitinh==='nam'?'Nam':'Nữ')+'</span>'+
      '<span class="tag">'+ngay+'/'+thang+'/'+nam+' DL</span>'+
      '<span class="tag">'+String(gioHour).padStart(2,'0')+':'+String(gioPhut).padStart(2,'0')+' · giờ '+gioChi+'</span>'+
      '<div class="yr">Năm luận <select id="barNamxem" onchange="reAnSao()"></select></div>';
    var barSel=document.getElementById('barNamxem');
    for(var y=namxem-2;y<=namxem+3;y++)barSel.innerHTML+='<option value="'+y+'"'+(y===namxem?' selected':'')+'>'+y+'</option>';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('chartPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    document.getElementById('btnLuan').style.display='';
    document.getElementById('btnBatTu').style.display='';
    // nhớ ngày sinh để chuyển tay sang Luận giải/Bát Tự không phải nhập lại
    Shell.rememberBirth(Object.assign({}, fdIn, {namxem:namxem}));
    // gắn context để bật rail
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      birth:{day:ngay,month:thang,year:nam,hourBranch:gioIdx,gender:gioitinh,name:name||undefined},
      label:(name||'Lá số')+' · '+ngay+'/'+thang+'/'+nam+' · năm '+namxem,
      greeting:'Lá số của **'+(name||'bạn')+'** đã sẵn sàng. Bạn muốn tôi soi điều gì trước?',
      chips:buildLasoChips(ls,namxem)
    });
  }catch(e){
    document.getElementById('lasoContainer').innerHTML='<div class="laso-error">Lỗi khi an sao: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('chartPanel').style.display='block';
    if(window.console)console.error(e);
  }finally{
    btn.disabled=false;btn.textContent='Lập lá số →';
  }
}
function reAnSao(){ var y=parseInt(document.getElementById('barNamxem').value); if(y)document.getElementById('inpNamxem').value=y; doAnSao(); }
// Chip gợi ý bám DỮ LIỆU THẬT của lá số (mệnh cung + chính tinh, đại vận, tiểu hạn, cách cục).
function buildLasoChips(ls,namxem){
  var chips=[];
  var menh=(ls.palaces||[]).filter(function(p){return p.isMenh;})[0];
  var mstars=menh&&menh.majorStars&&menh.majorStars.length?menh.majorStars.map(function(s){return s.ten;}).join(', '):'Vô Chính Diệu';
  chips.push('Cung Mệnh ('+(menh?menh.diaChi:'?')+') có '+mstars+' — tính cách, vận mệnh thế nào?');
  var dv=ls.daiVanHienTai;
  if(dv) chips.push('Đại vận hiện tại '+dv.diaChi+' ('+dv.tuoiStart+'–'+dv.tuoiEnd+'t) tốt không?');
  var th=ls.palaces&&ls.palaces[ls.tieuHanIdx];
  if(th) chips.push('Năm '+namxem+' tiểu hạn cung '+th.cungName+' — cần chú ý gì?');
  var cc=(ls.cachCuc||[])[0];
  chips.push(cc?('Cách cục '+cc.ten+' ảnh hưởng đời tôi ra sao?'):'Tổng quan mệnh của tôi?');
  return chips;
}
function showForm(){
  document.getElementById('chartPanel').style.display='none';
  document.getElementById('birthPanel').style.display='block';
  document.getElementById('btnEdit').style.display='none';
  document.getElementById('btnLuan').style.display='none';
  document.getElementById('btnBatTu').style.display='none';
}
// điền sẵn ngày sinh đã nhớ (nếu có); tự lập nếu đến qua ?auto=1.
// Chạy SAU khi shell.js render rail (boot ở DOMContentLoaded) để Shell.setContext không lỗi.
function _pageInit(){
  Shell.prefillForm();
  if(Shell.autoRun()&&document.getElementById('ngay').value)doAnSao();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_pageInit);
else _pageInit();
</script>
</body>
</html>

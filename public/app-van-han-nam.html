<style>
/* Center riêng của trang Vận Hạn 12 Tháng — mượn khuôn app-luan-giai.html */
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:640px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:14px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}

#vhPanel{display:none}
.vh-body{max-width:860px}
.jump{position:sticky;top:var(--ws-top-h,69px);z-index:4;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0;margin:0 0 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump a{white-space:nowrap;font-size:12px;color:var(--text-mid);border:1px solid var(--line-2);border-radius:20px;padding:4px 11px;cursor:pointer;background:var(--white)}
.jump a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.sc{flex:1;min-width:120px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow)}
.sc .lb{font-size:11px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.04em}
.sc .vl{font-family:var(--serif);font-size:24px;font-weight:600;margin-top:2px;display:flex;align-items:baseline;gap:3px}
.sc .vl small{font-size:12px;color:var(--text-lt);font-family:var(--sans)}
.pbar{height:5px;border-radius:5px;background:var(--paper-2);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px}
.sec{margin-bottom:28px;scroll-margin-top:calc(var(--ws-top-h,69px) + 52px)}
.sec-h{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.sec-n{width:26px;height:26px;flex:0 0 auto;border-radius:7px;background:var(--navy);color:var(--gold);font-family:var(--serif);font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.sec-h h3{font-family:var(--serif);font-size:18px;font-weight:600}
.card{background:var(--white);border:1px solid var(--line);border-radius:11px;padding:15px 17px;box-shadow:var(--shadow)}
.ask{margin-top:11px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.fold-toggle{font-size:12.5px;color:var(--tx-blue);cursor:pointer;margin-bottom:14px;display:inline-block}
#miniChart{display:block;margin-bottom:20px}
/* Khối deterministic (port từ app-luan-giai.html — cùng lớp CSS để hai tool
   hiện cùng một kiểu cho cùng một dữ liệu). */
.pregen-block{background:#F5F5F5;border:1px solid #e0e0e0;border-radius:8px;padding:12px 16px;margin:12px 0}
.pregen-title{font-size:11px;font-weight:600;color:#1a3a6a;text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.pregen-item{font-size:12px;color:#333;margin:4px 0}
.pregen-yn{font-size:12.5px;line-height:1.6;padding:2px 0}
.yn-great-cat{color:#1a6b3a}.yn-cat{color:#2a5a7a}.yn-great-hung{color:#C0392B}.yn-hung{color:#9B2020}.yn-tuan{color:#1a3a8a}.yn-neutral{color:#2a3a4a}
.pregen-row{font-size:12px;margin:3px 0}
.pregen-good{color:#1a6b3a}.pregen-bad{color:#C0392B}
.cc-label{font-size:11px;font-weight:600;padding:2px 6px;border-radius:3px;margin-right:6px;display:inline-block}
.cc-mota{font-size:11px;color:#555}
.cc-quy_cuc{background:#2a1f5e;color:#a78bfa}.cc-phu_cuc{background:#1f3a2a;color:#4ade80}.cc-ban_tien_cuc{background:#1a2535;color:#7bb8f8}.cc-tap_cuc{background:#222222;color:#a8b8c8}.cc-than_cu{background:#1e1e1e;color:#94a3b8}.cc-menh_co_ban{background:#1e1e1e;color:#94a3b8}
.score-bars{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.score-bar-row{display:flex;align-items:center;gap:8px}
.score-label{font-size:11px;color:#444;width:80px;flex-shrink:0}
.score-bar-bg{flex:1;height:8px;background:#d0d8e0;border-radius:4px;overflow:hidden}
.score-bar-fill{height:100%;border-radius:4px;transition:width .5s}
.score-val{font-size:11px;color:#333;width:24px;text-align:right;flex-shrink:0}
.rules-group{margin:4px 0}
.rules-canh-bao{background:#fff0f0;border-radius:4px;padding:4px 6px;margin:4px 0;border-left:2px solid #f87171}
.phan-empty{font-size:12.5px;color:var(--text-lt);font-style:italic;padding:4px 0}
/* Khối THÁNG — phần riêng của tool này */
.vh-doan{border-left:3px solid var(--gold-soft);padding:6px 0 6px 11px;margin:9px 0}
.vh-doan-hd{font-size:11.5px;color:var(--text-lt);margin-bottom:3px}
.vh-doan-hd b{color:var(--text)}
.vh-cung{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--heading)}
.vh-stars{font-size:12.5px;color:var(--text-mid);line-height:1.65;margin-top:3px}
.vh-stars .cat{color:#1a6b3a}.vh-stars .sat{color:#C0392B}.vh-stars .bai{color:#9B2020}
.vh-nen{font-size:11.5px;color:var(--text-lt);margin-top:4px}
.vh-cut{font-size:11.5px;color:#9B2020;background:#fff0f0;border-radius:4px;padding:4px 7px;margin:6px 0}
.vh-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:7px;margin:10px 0 2px}
.vh-ov{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.vh-ov b{display:block;font-family:var(--serif);font-size:12.5px}
.vh-ov span{font-size:11px;color:var(--text-lt)}
.claude-content{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-2)}
.claude-content p{color:var(--text-mid);line-height:1.75;margin-bottom:12px;font-size:13.5px}
.claude-content p:last-child{margin-bottom:0}
.claude-content strong{color:var(--text)}
.claude-content em{color:var(--gold-soft);font-style:italic}
.claude-content h3{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--heading);margin:14px 0 8px}
.laso-error{font-size:12.5px;color:var(--tx-red);padding:8px 0}
.vh-unlock{background:var(--white);border:1px solid var(--gold-soft);border-radius:11px;padding:18px 20px;margin-bottom:22px;text-align:center}
.vh-unlock p{font-size:12.5px;color:var(--text-lt);margin-top:8px}
.vh-progress{font-size:12.5px;color:var(--text-lt);margin-bottom:16px;padding:10px 0;border-bottom:1px solid var(--line)}
</style>
</head>

  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>

      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa thông tin</button>

    <div class="ws-body">

        <div id="tuviFormHost"></div>

<script>window.SHELL_ACTIVE='van-han-nam';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'van-han-nam',title:'Vận Hạn 12 Tháng Tới',desc:'Lát cắt sâu của bản Luận Giải: chỉ nhìn <b>tiểu vận năm</b> và <b>nguyệt vận từng tháng</b> của đúng 12 tháng kể từ hôm nay. Mỗi tháng một phần riêng, kèm nút <b>✦ Hỏi trợ lý</b> để đào sâu.'};</script>
<script src="/tuvi-ansao-engine.js"></script>

<script src="/tools-shared/ai-loading-steps.js?v=8"></script>
<script>
TuviForm.render('tuviFormHost', {mode:'compact', gioitinh:'nam'});
TuviPaywall.init({product:'van-han-nam'});

// ── Mốc thời gian: THÁNG HIỆN TẠI theo giờ VN ────────────────────────────
// Khung 12 tháng neo vào tháng người dùng ĐANG XEM, không phải tháng Giêng —
// đó là cả điểm của tool. Lấy giờ VN chứ không lấy giờ máy: người ở múi khác
// mở tool lúc giao tháng sẽ ra khung lệch một tháng so với server.
function vnNow(){
  var p={}; new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'})
    .formatToParts(new Date()).forEach(function(x){p[x.type]=x.value;});
  return {d:+p.day, m:+p.month, y:+p.year};
}
var NOW = vnNow();
var TU_THANG = NOW.m, TU_NAM = NOW.y;
// toolType = tiền tố slug. CÓ mốc tháng bắt đầu vì kết quả neo theo cửa sổ 12
// tháng: cùng lá số nhưng mở tháng khác là một sản phẩm khác, dùng chung slug
// thì tháng sau mở ra vẫn nhận bản luận của cửa sổ CŨ mà không gì báo.
var TOOL_TYPE = 'van-han-nam-' + TU_NAM + '-' + String(TU_THANG).padStart(2,'0');

var CUNG_ORDER=['Mệnh','Phụ Mẫu','Phúc Đức','Điền Trạch','Quan Lộc','Nô Bộc','Thiên Di','Tật Ách','Tài Bạch','Tử Tức','Phu Thê','Huynh Đệ'];
var SC_DIMS=['thienVan','canCo','mayMan','phuTro','binhYen','benVung'];
function cungTotal(sc){ if(!sc)return null; var d=SC_DIMS.map(function(k){return sc[k]}).filter(function(v){return typeof v==='number'}); return d.length?Math.round(d.reduce(function(a,b){return a+b},0)/d.length*10)/10:null; }
function scoreColor(t){ return t>=7?'var(--green)':t>=5?'var(--gold-soft)':'var(--red)'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var _astrolabe=null,_hoTen='',_ngay=0,_thang=0,_nam=0,_gioitinh='nam',_laSoText=null;
var _khung=null,_labels=null,_tongPhan=0,_pendingSlug=null,_currentPhan=0,_store={};
var _pace=(window.AiLoadingSteps&&AiLoadingSteps.pacer)?AiLoadingSteps.pacer():null;
var SB_URL_VH='https://dciwkfdqhhddeymlisey.supabase.co';
var SB_ANON_VH='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjaXdrZmRxaGhkZGV5bWxpc2V5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMyMzQ2MzksImV4cCI6MjA4ODgxMDYzOX0._3aXoe0hO-46J1gASUiNv__tWjSzLZFTL0M3-47L26I';

function toSlugAscii(str){
  return String(str||'').toLowerCase().normalize('NFD')
    .replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d')
    .replace(/[^a-z0-9\-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
}
function _loggedIn(){ return !!(window.Auth&&window.Auth.isLoggedIn&&window.Auth.isLoggedIn()); }

async function doXem(){
  var btn=document.getElementById('btnGo');
  var fdIn=TuviForm.getData();
  var name=fdIn.hoten,gioitinh=fdIn.gioitinh,dd=fdIn.ngay,mm=fdIn.thang,yyyy=fdIn.nam,hh=fdIn.gioHour,gioAmIdx=fdIn.gioIdx;
  if(!dd||!mm||!yyyy){ alert('Vui lòng nhập đầy đủ ngày, tháng, năm sinh.'); return; }
  btn.disabled=true;btn.textContent='Đang tính…';
  try{
    var conv=convertDuongToAm(dd,mm,yyyy,hh);conv.gioIdx=gioAmIdx;
    // namXem = năm của THÁNG ĐANG XEM → đại vận/tiểu hạn "hiện tại" khớp đúng
    // thời điểm mở tool (server dùng CÙNG một mốc, xem /api/van-han-nam).
    var ls=anSaoLaSo({ngayAL:conv.amLich.day,thangAL:conv.amLich.month,namAL:conv.amLich.year,canNam:conv.canNam,chiNam:conv.chiNam,gioIdx:gioAmIdx,gioitinh:gioitinh,namXem:TU_NAM});
    ls._conv=conv; ls._hoTen=name;
    _astrolabe=ls;_hoTen=name;_ngay=dd;_thang=mm;_nam=yyyy;_gioitinh=gioitinh;
    _laSoText=formatLaSoV2(ls,conv); ls._laSoText=_laSoText;

    // Khung 12 tháng tính ở SERVER (nguồn duy nhất của phép nguyệt hạn — dùng
    // chung với rail chat và thẻ Vận Ngày). 0 lượt LLM, 0đ, không cần đăng nhập.
    var kr=await fetch('/api/van-han-nam?action=khung',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({birth:_birthPayload(),tuThang:TU_THANG,tuNam:TU_NAM})});
    var kd=await kr.json();
    if(!kd||!kd.khung) throw new Error((kd&&kd.error)||'Không dựng được khung 12 tháng.');
    _khung=kd.khung;_labels=kd.labels;_tongPhan=kd.tongPhan;

    render(ls);
    document.getElementById('miniChart').innerHTML=renderGrid(ls,{name:name,gioitinh:gioitinh,dd:dd,mm:mm,yyyy:yyyy,hh:hh,gioChi:CHI[gioAmIdx],amLich:conv.amLich});
    if(window.mountIcons) window.mountIcons(document.getElementById('miniChart'));
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('vhPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    document.getElementById('btnLuanGiai').style.display='';
    if(window.AiLoadingSteps)AiLoadingSteps.scrollToResult('vhPanel');
    Shell.rememberBirth(fdIn);
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      birth:{day:dd,month:mm,year:yyyy,hourBranch:gioAmIdx,gender:gioitinh,name:name||undefined},
      label:'Vận hạn 12 tháng · '+(name||'lá số')+' · từ '+TU_THANG+'/'+TU_NAM,
      greeting:'Khung **12 tháng tới** (từ '+TU_THANG+'/'+TU_NAM+' đến '+_khung.denThang+'/'+_khung.denNam+') đã sẵn sàng. Hỏi tôi về bất kỳ tháng nào.',
      chips:buildChips()
    });
    Shell.setShareable({kind:'text',toolId:'van-han-nam',title:'Vận hạn 12 tháng của '+(name||'tôi'),text:shareLines()});
    initGate();
  }catch(e){
    document.getElementById('vhBody').innerHTML='<div class="laso-error">Lỗi khi tính vận hạn: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('vhPanel').style.display='block';
    if(window.AiLoadingSteps)AiLoadingSteps.scrollToResult('vhPanel');
    if(window.console)console.error(e);
  }finally{
    btn.disabled=false;btn.textContent='Xem vận hạn →';
  }
}

function _birthPayload(){
  var f=TuviForm.getData();
  return {day:f.ngay,month:f.thang,year:f.nam,hourBranch:f.gioIdx,gender:f.gioitinh,name:f.hoten||undefined};
}

function shareLines(){
  var L=[(_hoTen||'Lá số')+' · '+_ngay+'/'+_thang+'/'+_nam+' · '+(_gioitinh==='nam'?'Nam':'Nữ')];
  L.push('Vận hạn 12 tháng: '+TU_THANG+'/'+TU_NAM+' → '+_khung.denThang+'/'+_khung.denNam);
  var dv=_astrolabe.daiVanHienTai;
  if(dv) L.push('Đại vận hiện tại: '+dv.diaChi+' ('+dv.tuoiStart+'–'+dv.tuoiEnd+'t)'+(dv.scoring&&dv.scoring.tong!=null?' · '+dv.scoring.tong+'/10':''));
  L.push('');
  _khung.thangs.forEach(function(t){
    if(t.loi){ L.push(t.nhan+': '+t.loi); return; }
    L.push(t.nhan+': '+t.doan.map(function(d){return d.cungNguyetHan;}).join(' → '));
  });
  return L.join('\n');
}

function buildChips(){
  var c=[], t0=_khung.thangs[0], t1=_khung.thangs[1];
  if(t0&&!t0.loi) c.push('Tháng '+t0.nhan+' nên tập trung việc gì?');
  if(t1&&!t1.loi) c.push('Tháng '+t1.nhan+' có gì cần né?');
  c.push('Trong 12 tháng tới, tháng nào thuận nhất?');
  c.push('Tiểu vận năm nay nói lên điều gì?');
  return c;
}

// ── Render 16 phần ───────────────────────────────────────────────────────
// Phần 1–4 dùng LẠI khối deterministic của bản Luận Giải (LuanGiaiCore) —
// cùng một dữ liệu thì phải hiện cùng một kiểu. Phần 5–16 là khối THÁNG riêng.
function render(ls){
  var totals=[],dvHT=ls.daiVanHienTai,dvTong=dvHT&&dvHT.scoring?dvHT.scoring.tong:null;
  CUNG_ORDER.forEach(function(cn){ var t=cungTotal(ls.cungScores&&ls.cungScores[cn]); if(t!=null)totals.push(t); });
  var overall=totals.length?Math.round(totals.reduce(function(a,b){return a+b},0)/totals.length*10)/10:null;
  function card(lb,t){ var col=t!=null?scoreColor(t):'var(--text-lt)'; return '<div class="sc"><div class="lb">'+esc(lb)+'</div><div class="vl" style="color:'+col+'">'+(t!=null?t:'—')+'<small>/10</small></div><div class="pbar"><i style="width:'+(t!=null?t*10:0)+'%;background:'+col+'"></i></div></div>'; }
  document.getElementById('vhScores').innerHTML=
    card('Tổng quan lá số',overall) + card('Đại vận '+(dvHT?dvHT.tuoiStart+'–'+dvHT.tuoiEnd+'t':''),dvTong) +
    '<div class="sc"><div class="lb">Khung 12 tháng</div><div class="vl" style="font-size:17px;color:var(--heading)">'+TU_THANG+'/'+TU_NAM+' → '+_khung.denThang+'/'+_khung.denNam+'</div><div class="pbar"><i style="width:100%;background:var(--gold-soft)"></i></div></div>';

  var dvSo=_dvHienTaiSo(ls);
  var PRE=[null,1,14,14+dvSo,24];   // phần 1–4 → phần tương ứng bên Luận Giải
  var S=[];
  for(var p=1;p<=_tongPhan;p++){
    var body = p<=4
      ? (LuanGiaiCore.buildPreGenHtml(PRE[p],ls) || '<div class="phan-empty">Phần này luận theo tổng thể lá số — bấm nút dưới để trợ lý luận sâu.</div>')
      : renderThang(_khung.thangs[p-5]);
    var lock=TuviPaywall.sectionLockHtml({id:'sec-ai-lock-'+p,product:'van-han-nam'});
    S.push('<section class="sec" id="sec-'+p+'"><div class="sec-h"><div class="sec-n">'+p+'</div><h3>'+esc(_labels[p]||('Phần '+p))+'</h3></div>'+
      '<div class="card">'+body+lock+'<div class="claude-content" id="claude-content-'+p+'" style="display:none"></div>'+
      ask(p<=4?('Luận sâu phần: '+_labels[p]):('Tháng '+_khung.thangs[p-5].nhan+' của tôi thế nào?'))+'</div></section>');
  }
  document.getElementById('vhBody').innerHTML=S.join('');
  if(window.mountIcons) window.mountIcons(document.getElementById('vhBody'));
  TuviPaywall.fillPriceSlots(document.getElementById('vhBody'));
  TuviPaywall.wireSectionLocks(document.getElementById('vhBody'), initiateAI);
  try{ LuanGiaiCore.renderInlineDaiVanLineChart(ls); }catch(e){ if(window.console)console.warn(e); }
  renderJump();
  wireAsk(document.getElementById('vhBody'));
}
// Số thứ tự đại vận đang đi — CÙNG phép chọn với server (dvHienTaiSo trong
// app/api/van-han-nam/route.ts): so cả cungIdx lẫn tuoiStart rồi kẹp ở 9, vì
// bản Luận Giải chỉ có prompt cho ĐV1–ĐV9.
function _dvHienTaiSo(ls){
  var dvs=ls.daiVans||[],cur=ls.daiVanHienTai;
  if(!cur) return 1;
  for(var i=0;i<dvs.length;i++) if(dvs[i]&&dvs[i].cungIdx===cur.cungIdx&&dvs[i].tuoiStart===cur.tuoiStart) return Math.min(i+1,9);
  return 1;
}

function renderThang(t){
  if(!t) return '<div class="phan-empty">Không có dữ liệu tháng này.</div>';
  if(t.loi) return '<div class="phan-empty">'+esc(t.loi)+'</div>';
  var h='';
  var doiTieuHan = t.doan.length>1 && t.doan[0].cungTieuHan!==t.doan[1].cungTieuHan;
  if(t.doan.length>1){
    h+='<div class="vh-cut">Tháng dương lịch này bị <b>2 tháng âm lịch</b> cắt ngang — hai đoạn dưới đây là hai hạn KHÁC nhau, đọc theo đúng khoảng ngày.'+
      (doiTieuHan?' Giao thừa cũng rơi vào tháng này nên <b>nền tiểu hạn đổi giữa chừng</b>.':'')+'</div>';
  }
  t.doan.forEach(function(d){
    h+='<div class="vh-doan">';
    h+='<div class="vh-doan-hd"><b>'+(t.doan.length>1?('Ngày '+d.tuNgay+'–'+d.denNgay+'/'+t.thang):('Cả tháng '+t.nhan))+'</b> · ÂL tháng '+d.thangAL+(d.isLeap?' nhuận':'')+'/'+d.namAL+(d.dangDienRa?' · <b>đang diễn ra</b>':'')+'</div>';
    h+='<div class="vh-cung">Nguyệt hạn: cung '+esc(d.cungNguyetHan)+'</div>';
    var st=[];
    st.push('Chính tinh: '+(d.chinhTinh.length?esc(d.chinhTinh.join(', ')):'vô chính diệu (mượn cung xung chiếu)'));
    if(d.catTinh.length) st.push('<span class="cat">Cát tinh: '+esc(d.catTinh.join(', '))+'</span>');
    if(d.satTinh.length) st.push('<span class="sat">Sát tinh: '+esc(d.satTinh.join(', '))+'</span>');
    if(d.baiTinh.length) st.push('<span class="bai">Bại tinh: '+esc(d.baiTinh.join(', '))+'</span>');
    h+='<div class="vh-stars">'+st.join('<br>')+'</div>';
    h+='<div class="vh-nen">Nền năm: tiểu hạn cung '+esc(d.cungTieuHan)+' · lưu niên đại hạn cung '+esc(d.cungLuuNien)+'</div>';
    h+='</div>';
  });
  if(t.toHop&&t.toHop.length){
    h+='<div class="pregen-block"><div class="pregen-title"><span class="ic-inline" data-icon-emoji="🔮" style="display:inline-flex;width:1em;height:1em;vertical-align:-2px;color:#9A7B3A">🔮</span> Tổ hợp sao trong các cung hạn</div>';
    t.toHop.forEach(function(c){
      var cls = c.loai==='tốt'?'yn-cat':c.loai==='xấu'?'yn-hung':'yn-neutral';
      h+='<div class="pregen-yn '+cls+'">• ['+esc(c.loai)+'] '+esc(c.ten)+' — '+esc(c.tomTat)+'</div>';
    });
    h+='</div>';
  }
  // Nguyệt hạn CỐ Ý không có điểm/10: luật đã chốt trong repo — chỉ đại vận
  // mới có điểm thật, chấm điểm cho tháng là bịa.
  return h;
}

function ask(t){ return '<div class="ask" data-ask="'+esc(t)+'">✦ Hỏi trợ lý: "'+esc(t)+'"</div>'; }
function wireAsk(root){
  root.querySelectorAll('[data-ask]').forEach(function(el){
    if(el._vhWired)return; el._vhWired=true;
    el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); });
  });
}
function renderJump(){
  var h='';
  for(var i=1;i<=_tongPhan;i++) h+='<a data-i="'+i+'"'+(i===1?' class="on"':'')+'>'+esc(_labels[i]||('Phần '+i))+'</a>';
  document.getElementById('vhJump').innerHTML=h;
  var ws=document.getElementById('ws');
  document.querySelectorAll('#vhJump a').forEach(function(a){
    a.addEventListener('click',function(){ var s=document.getElementById('sec-'+a.getAttribute('data-i')); if(s)ws.scrollTo({top:s.offsetTop-96,behavior:'smooth'}); });
  });
  ws.addEventListener('scroll',function(){
    var y=ws.scrollTop+130,idx=1;
    for(var i=1;i<=_tongPhan;i++){ var s=document.getElementById('sec-'+i); if(s&&s.offsetTop<=y)idx=i; }
    document.querySelectorAll('#vhJump a').forEach(function(a){ a.classList.toggle('on',+a.getAttribute('data-i')===idx); });
  });
}
function toggleMini(){
  var m=document.getElementById('miniChart'),f=document.getElementById('vhFold');
  var shown=getComputedStyle(m).display!=='none';
  m.style.display=shown?'none':'block';
  f.textContent=shown?'▸ Xem lá số đầy đủ':'▾ Ẩn lá số';
}

// ── Cổng Lượng + sinh AI (khuôn app-luan-giai.html) ──────────────────────
function _paintSecLocks(show){
  for(var p=1;p<=_tongPhan;p++){ var el=document.getElementById('sec-ai-lock-'+p); if(el)el.style.display=show?'flex':'none'; }
}
async function _fetchCached(slug){
  try{
    var r=await fetch(SB_URL_VH+'/rest/v1/laso_public?slug=eq.'+encodeURIComponent(slug)+'&select=slug,luan_giai&limit=1',{headers:{apikey:SB_ANON_VH}});
    var rows=await r.json();
    if(rows&&rows[0]&&rows[0].luan_giai&&Object.keys(rows[0].luan_giai).length>0)return rows[0].luan_giai;
  }catch(e){}
  return null;
}
function _renderCached(store){
  _store=store;
  for(var p=1;p<=_tongPhan;p++){
    var box=document.getElementById('claude-content-'+p),text=store[p]||store[String(p)];
    if(box&&text){ box.style.display='block'; box.innerHTML=renderMarkdown(text); }
  }
  document.getElementById('vhUnlock').style.display='none';
  document.getElementById('vhProgress').style.display='none';
  _paintSecLocks(false);
}
async function initGate(){
  var conv=_astrolabe._conv||{};
  // Slug MANG mốc tháng bắt đầu (qua TOOL_TYPE) — cùng lá số nhưng cửa sổ 12
  // tháng khác là một sản phẩm khác. Phải khớp ĐÚNG makeSlug của /api/save-laso.
  _pendingSlug=toSlugAscii([TOOL_TYPE,_astrolabe.canChiNam||'',String(_ngay).padStart(2,'0'),String(_thang).padStart(2,'0'),_nam,_gioitinh,'gio-'+(conv.gioChi||'unknown')].join('-'));
  _store={};
  document.getElementById('vhUnlock').style.display='none';
  document.getElementById('vhProgress').style.display='none';
  var hasAccess=false;
  try{
    var uid=_loggedIn()?(window.Auth.getUser()&&window.Auth.getUser().id):null;
    if(uid){
      var rc=await fetch('/api/payment?action=check&slug='+encodeURIComponent(_pendingSlug)+'&userId='+encodeURIComponent(uid));
      var rd=await rc.json();
      hasAccess=!!(rd&&rd.hasAccess);
    }
  }catch(e){hasAccess=false;}
  if(hasAccess){
    var cached=await _fetchCached(_pendingSlug);
    if(cached){ _renderCached(cached); return; }
  }
  _renderUnlockBlock();
}
function _renderUnlockBlock(){
  var host=document.getElementById('vhUnlock');
  host.style.display='block';
  _paintSecLocks(true);
  if(_loggedIn()){
    host.innerHTML='<button class="btn-go" id="btnUnlock" onclick="initiateAI()">✦ Luận vận hạn 12 tháng bằng AI — <span data-tvp-price="van-han-nam">…</span> Lượng →</button>'+
      '<p>Viết riêng cho lá số này: tổng quan, hành trình đại vận, đại vận và tiểu vận hiện tại, rồi từng tháng một trong 12 tháng tới.</p>';
    TuviPaywall.fillPriceSlots(host);
    return;
  }
  host.innerHTML='';
  TuviPaywall.lockPreview({
    host:host,
    title:'⊙ Bản luận vận hạn chưa mở',
    items:['Luận riêng cho từng tháng trong 12 tháng tới','Tổng quan lá số, hành trình đại vận và tiểu vận năm nay'],
    cta:'Đăng ký để mở bản luận đầy đủ',
    slug:function(){return _pendingSlug;},
    onUnlock:function(){ return _startAI(); },
  });
}
async function initiateAI(){
  await TuviPaywall.requireCredits(_pendingSlug, async function(){ await _startAI(); });
}
async function _startAI(){
  document.getElementById('vhUnlock').style.display='none';
  document.getElementById('vhProgress').style.display='block';
  _paintSecLocks(false);
  _currentPhan=0;_store={};
  _pace&&_pace.reset();
  await _loadNext();
}
// Truy vấn RAG theo từng phần — phần tháng bám cung nguyệt hạn + sao của đúng
// tháng đó (không phải một truy vấn chung cho cả 12 tháng).
function ragQuery(p){
  if(p===1) return 'tổng quan lá số '+(_astrolabe.napAm||'')+' cục '+(_astrolabe.cuc||'')+' khí chất bản mệnh';
  if(p===2) return 'đại vận thiên thời địa lợi nhân hòa vận trình cuộc đời';
  if(p===3){ var dv=_astrolabe.daiVanHienTai; return 'đại vận '+((dv&&dv.diaChi)||'')+' vận hạn ý nghĩa'; }
  if(p===4) return 'tiểu hạn lưu niên '+(_astrolabe.chiNamXem||'')+' vận năm hiện tại';
  var t=_khung.thangs[p-5];
  if(!t||t.loi) return 'lưu nguyệt hạn vận tháng';
  var d=t.doan.find(function(x){return x.dangDienRa;})||t.doan[0];
  return 'lưu nguyệt hạn cung '+(d?d.cungNguyetHan:'')+' '+(d?d.chinhTinh.join(' '):'')+' vận tháng';
}
async function _loadNext(){
  if(_currentPhan>=_tongPhan){
    document.getElementById('vhProgress').textContent='✓ Luận vận hạn hoàn tất';
    _saveResult();
    return;
  }
  _currentPhan++;
  var p=_currentPhan;
  var _eta=_pace?_pace.remainText(_tongPhan-p+1):'';
  document.getElementById('vhProgress').textContent='Đang luận phần '+p+' / '+_tongPhan+(_eta?' · '+_eta:'...');
  _pace&&_pace.begin();
  var box=document.getElementById('claude-content-'+p);
  var w=null;
  if(box){
    box.style.display='block';
    box.innerHTML='<div class="phan-empty">Đang luận…</div>';
    if(window.AiLoadingSteps&&AiLoadingSteps.mountWait){
      w=AiLoadingSteps.mountWait(box,{label:'Đang luận '+(_labels[p]||('phần '+p))+'…',
        expectSec:(_pace&&_pace.perPartSec())||0,expectText:(_pace&&_pace.perPartText())||''});
      w.start();
    }
  }
  var doneWait=function(){ if(w){ w.stop(); w=null; } };
  var secEl=document.getElementById('sec-'+p);
  if(secEl)secEl.scrollIntoView({behavior:'smooth',block:'start'});
  try{
    var docs='';
    try{
      var sr=await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:ragQuery(p),matchCount:p===1?10:7})});
      docs=(await sr.json()).docs||'';
    }catch(e){}
    if(p>1)await new Promise(function(r){setTimeout(r,600);});
    var resp=await fetch('/api/van-han-nam',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({birth:_birthPayload(),tuThang:TU_THANG,tuNam:TU_NAM,phan:p,docs:docs})});
    var data=await resp.json();
    if(data.error||!data.luanGiai){
      doneWait();
      if(box)box.innerHTML='<div class="laso-error">Lỗi khi luận phần '+p+'. <button class="btn" onclick="window._vhRetry()">↻ Thử lại</button></div>';
      return;
    }
    _store[p]=data.luanGiai;
    _pace&&_pace.end();
    doneWait();
    if(box)box.innerHTML=renderMarkdown(data.luanGiai);
  }catch(e){
    doneWait();
    if(box)box.innerHTML='<div class="laso-error">Lỗi phần '+p+': '+esc(e.message)+' <button class="btn" onclick="window._vhRetry()">↻ Thử lại</button></div>';
    return;
  }
  await _loadNext();
}
window._vhRetry=function(){ _currentPhan--; _loadNext(); };

function renderMarkdown(text){
  var lines=String(text||'').split('\n'),out='';
  lines.forEach(function(line){
    var l=line.replace(/^## (.+)$/,'<h3>$1</h3>').replace(/^### (.+)$/,'<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>');
    if(l.indexOf('<h')===0)out+=l; else if(l.trim())out+='<p>'+l+'</p>';
  });
  return out;
}

function _saveResult(){
  try{
    var tk=(window.Auth&&window.Auth.isLoggedIn())?window.Auth.getSession().access_token:null;
    var headers={'Content-Type':'application/json'};
    if(tk)headers['Authorization']='Bearer '+tk;
    fetch('/api/save-laso',{method:'POST',headers:headers,body:JSON.stringify({
      toolType:TOOL_TYPE,
      canChiNam:_astrolabe.canChiNam, gioiTinh:_gioitinh,
      namSinh:_nam, thangSinh:_thang, ngaySinh:_ngay,
      gioIdx:(_astrolabe._conv&&_astrolabe._conv.gioIdx!=null)?_astrolabe._conv.gioIdx:null,
      gioChi:(_astrolabe._conv&&_astrolabe._conv.gioChi)||'',
      canNam:(_astrolabe._conv&&_astrolabe._conv.canNam)||'', chiNam:(_astrolabe._conv&&_astrolabe._conv.chiNam)||'',
      namXem:TU_NAM, cungMenh:_astrolabe.menhDC,
      chinhTinh:(function(){ var mp=_astrolabe.palaces&&_astrolabe.palaces.find(function(p){return p.isMenh;}); return mp&&mp.majorStars?mp.majorStars.map(function(s){return s.ten;}).join(', '):''; })(),
      napAm:_astrolabe.napAm, personName:_hoTen||null,
      luanGiai:_store, laSoText:_laSoText,
    })}).catch(function(){});
  }catch(e){}
}

function showForm(){
  document.getElementById('vhPanel').style.display='none';
  document.getElementById('birthPanel').style.display='block';
  document.getElementById('btnEdit').style.display='none';
  document.getElementById('btnLuanGiai').style.display='none';
  document.getElementById('vhUnlock').style.display='none';
  document.getElementById('vhProgress').style.display='none';
  Shell.setShareable(null);
}

function _pageInit(){
  document.getElementById('fmSub').textContent=
    'Lập lá số theo cổ pháp rồi soi tiểu vận năm và nguyệt vận từng tháng — cung hạn, sao, cách cục vận của 12 tháng từ '+TU_THANG+'/'+TU_NAM+' đến hết.';
  Shell.prefillForm();
  if(Shell.autoRun()&&document.getElementById('ngay').value)doXem();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_pageInit);
else _pageInit();
</script>
</body>

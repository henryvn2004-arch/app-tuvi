<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mai Hoa Dịch Số — Gieo quẻ — Tử Vi Minh Bảo</title>
<meta name="description" content="Gieo quẻ Mai Hoa Dịch Số bằng một con số hoặc theo thời điểm — quẻ Thể, quẻ Dụng và ngũ hành sinh khắc qua ba chặng chính, hỗ, biến. Hỏi trợ lý AI luận theo câu hỏi.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" as="style" onload="this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/shell.css?v=20">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:640px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input{border:1px solid var(--line-2);border-radius:7px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif);display:block;margin:4px auto 0;width:100%;max-width:340px}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
.mh-mode{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mh-mode button{flex:1;min-width:150px;border:1px solid var(--line-2);background:var(--paper);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:600}
.mh-mode button.on{background:#061A2E;color:#fff;border-color:#061A2E}
.mh-card{border:1px solid var(--line,#E8E8E8);border-radius:12px;padding:22px 20px;background:var(--white,#fff)}
.mh-doi{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.mh-quai{text-align:center}
.mh-vai{font-size:9.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-lt,#777);margin-bottom:12px}
.mh-quai-hao{display:flex;flex-direction:column;gap:7px;align-items:center;margin-bottom:12px}
.mh-hao{display:flex;justify-content:center;width:96px}
.mh-duong{display:block;width:96px;height:13px;border-radius:2px}
.mh-am{display:flex;gap:10px;width:96px}
.mh-am i{display:block;width:43px;height:13px;border-radius:2px}
.mh-ten{font-size:24px;font-weight:700;font-family:var(--serif);color:#061A2E;margin-bottom:3px}
.mh-phu{font-size:12px;color:var(--text-lt,#777)}
.mh-giua{text-align:center;min-width:104px}
.mh-mui{font-size:34px;line-height:1;margin-bottom:6px}
.mh-qh{font-size:12.5px;color:var(--text,#444);margin-bottom:8px}
.mh-muc{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#fff;padding:4px 11px;border-radius:3px}
.mh-luan{margin-top:18px;padding-top:16px;border-top:1px solid var(--line,#E8E8E8);font-size:14.5px;line-height:1.75;color:var(--text,#444)}
.mh-changs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.mh-chang{border:1px solid var(--line,#E8E8E8);border-radius:10px;padding:14px;background:var(--white,#fff)}
.mh-chang-nhan{font-size:9.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--text-lt,#777);margin-bottom:6px}
.mh-chang-que{font-size:17px;font-weight:700;font-family:var(--serif);color:#061A2E}
.mh-chang-y{font-size:11.5px;color:var(--text-lt,#777);margin:2px 0 9px}
.mh-chang-qh{font-size:12px;margin-bottom:6px}
.mh-chang-qh span{display:inline-block;color:#fff;font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:3px;margin-right:5px}
.mh-chang-td{font-size:11.5px;color:var(--text-lt,#777);line-height:1.5}
.mh-chang-chu{margin-top:12px;font-size:11.5px;opacity:.62;line-height:1.55}
.mh-buoc{margin-top:14px;font-size:12px;color:var(--text-lt,#777);line-height:1.6;padding:10px 12px;background:var(--paper,#F5F4F0);border-radius:8px}
.mh-hao-tu{margin-top:14px;padding:12px 14px;border-left:3px solid var(--gold,#c9a227);background:var(--paper,#F5F4F0);border-radius:0 8px 8px 0}
.mh-hao-tu .nhan{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:5px}
.mh-hao-tu .han{font-family:"Noto Serif SC",serif;font-size:15.5px;line-height:1.6;margin-bottom:4px}
.mh-hao-tu .viet{font-size:14px;line-height:1.65}
.mh-anh{margin:18px 0 0;border:1px solid var(--line,#E8E8E8);border-radius:10px;overflow:hidden;background:var(--white,#fff)}
.mh-anh img{display:block;width:100%;height:auto}
.mh-anh figcaption{padding:9px 12px;font-size:12.5px;opacity:.72}
#resPanel{display:none;max-width:760px}
.cauhoi-disp{font-size:13px;color:var(--text-lt);font-style:italic;margin-bottom:16px;text-align:center}
.ask{margin-top:16px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.mh-tai{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.mh-tai button{font-size:12.5px;color:var(--tx-blue);cursor:pointer;background:none;border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;font-family:inherit}
.mh-tai button:disabled{opacity:.6;cursor:not-allowed}
.mh-err{margin-top:10px;font-size:12.5px;color:#B0392B}
@media(max-width:640px){.mh-doi{grid-template-columns:1fr;gap:18px}.mh-changs{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Mai Hoa Dịch Số</b><span>Thể · Dụng · ba chặng chính–hỗ–biến</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="reset()" style="display:none">Gieo lại</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div id="shellRecent"></div>
      <div class="form-card" id="birthPanel">
        <h2>Thành tâm nghĩ về việc muốn hỏi</h2>
        <p class="sub">Gieo quẻ bằng số hoặc giờ, đọc Thể và Dụng cho việc bạn hỏi. Bạn có một việc đang phân vân, muốn một gợi ý thật nhanh. Dùng khi cần đáp án gọn cho một câu hỏi cụ thể.</p>
        <p class="price-note" data-tvp-price-label="mai-hoa">…</p>
        <div class="fg">
          <label>Câu hỏi (tuỳ chọn)</label>
          <input type="text" id="cauHoi" placeholder="VD: Việc chuyển chỗ làm này có nên không?" maxlength="100">
        </div>
        <div class="mh-mode">
          <button type="button" id="modeGio" class="on" onclick="setMode('gio')">Gieo theo thời điểm này</button>
          <button type="button" id="modeSo" onclick="setMode('so')">Gieo bằng một con số</button>
        </div>
        <div class="fg" id="soWrap" style="display:none">
          <label>Con số nảy ra trong đầu</label>
          <input type="number" id="soInput" placeholder="VD: 27" min="1" step="1" inputmode="numeric">
        </div>
        <button class="btn-go" id="goBtn" onclick="gieo()">✦ Lập Quẻ</button>
        <div class="mh-err" id="mhErr" style="display:none"></div>
      </div>

      <div id="resPanel" data-ws-result>
        <div class="cauhoi-disp" id="cauHoiDisplay"></div>
        <div id="mhCard"></div>
        <div id="mhChangs"></div>
        <div id="mhHaoTu"></div>
        <div id="mhBuoc"></div>
        <div id="mhAnh"></div>
        <div class="mh-tai">
          <button id="taiBtn" onclick="taiAnh()">⬇ Tải ảnh chia sẻ (9:16)</button>
          <button onclick="reset()">↺ Gieo quẻ khác</button>
        </div>
        <div class="mh-err" id="mhErr2" style="display:none"></div>
        <div class="ask" data-ask="Luận giúp tôi quẻ Mai Hoa này theo đúng câu hỏi: quan hệ Thể–Dụng nói gì, ba chặng chính–hỗ–biến diễn ra thế nào, nên hành động ra sao?">✦ Hỏi trợ lý luận quẻ theo câu hỏi</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='mai-hoa';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'mai-hoa',title:'Mai Hoa Dịch Số',desc:'Gieo quẻ bằng số hoặc giờ, đọc Thể và Dụng cho việc bạn hỏi. Bạn có một việc đang phân vân, muốn một gợi ý thật nhanh. Dùng khi cần đáp án gọn cho một câu hỏi cụ thể.'};</script>
<script src="/tuvi-ansao-engine.js"></script>
<script src="/tools-shared/kinh-dich-hao.js?v=1"></script>
<script src="/tools-shared/kinh-dich.js?v=5"></script>
<script src="/tools-shared/mai-hoa.js?v=1"></script>
<script src="/poster.js?v=5"></script>
<script src="/auth.js?v=2"></script>
  <script src="/nav.js?v=22" data-icons-only></script>
<script src="/shell.js?v=75"></script>
<script>
// Ô giữa dùng CHUNG module /tools-shared/mai-hoa.js với trang standalone
// /tools/mai-hoa.html. Trang chỉ lo DOM + nối rail.
let _mode = 'gio';
let _r = null;

function setMode(m) {
  _mode = m;
  document.getElementById('modeGio').classList.toggle('on', m === 'gio');
  document.getElementById('modeSo').classList.toggle('on', m === 'so');
  document.getElementById('soWrap').style.display = m === 'so' ? 'flex' : 'none';
  if (m === 'so') document.getElementById('soInput').focus();
}

function _err(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg || '';
  el.style.display = msg ? 'block' : 'none';
}

function gieo() {
  _err('mhErr', '');
  const g = _mode === 'so'
    ? MaiHoaTool.gieoTheoSo(document.getElementById('soInput').value)
    : MaiHoaTool.gieoTheoGio();
  if (!g.ok) { _err('mhErr', g.error); return; }
  const r = MaiHoaTool.resolve(g);
  if (!r.ok) { _err('mhErr', r.error || 'Không lập được quẻ.'); return; }
  _r = r;
  showResult();
}

function showResult() {
  const r = _r;
  const cHoi = document.getElementById('cauHoi').value.trim();
  document.getElementById('cauHoiDisplay').textContent = cHoi ? '"' + cHoi + '"' : '';
  document.getElementById('mhCard').innerHTML = MaiHoaTool.cardHTML(r);
  document.getElementById('mhChangs').innerHTML = MaiHoaTool.chungHTML(r);
  document.getElementById('mhHaoTu').innerHTML = r.haoTu
    ? '<div class="mh-hao-tu"><div class="nhan">' + r.haoTu.nhan + ' của quẻ chính — tham khảo thêm</div><div class="han">' + r.haoTu.han + '</div><div class="viet">' + r.haoTu.viet + '</div></div>'
    : '';
  document.getElementById('mhBuoc').innerHTML = '<div class="mh-buoc"><b>Cách ra quẻ:</b> ' + r.gieo.calc.moTa + ' Hào động là hào ' + r.dong + '.</div>';
  const kw = r.chinh.que ? r.chinh.que.kw : 0;
  document.getElementById('mhAnh').innerHTML = kw
    ? '<figure class="mh-anh"><img src="' + KinhDichTool.anhUrl(r.chinh.li, kw) + '" alt="Tranh quẻ ' + r.chinh.que.q.n + '" loading="lazy" decoding="async" width="1024" height="1536"><figcaption>Quẻ chính · ' + r.chinh.que.q.n + ' ' + r.chinh.que.q.zh + '</figcaption></figure>'
    : '';
  document.getElementById('birthPanel').style.display = 'none';
  document.getElementById('resPanel').style.display = 'block';
  document.getElementById('btnEdit').style.display = '';
  if (window.SHELL_INTRO) Shell.dismissIntro(window.SHELL_INTRO.key);

  const d = MaiHoaTool.railData(r, cHoi);
  const tenChinh = r.chinh.que ? r.chinh.que.q.n : '';
  Shell.setContext({
    scenario: { type: 'mai-hoa', data: d },
    restore: { gieo: r.gieo, cauHoi: cHoi, mode: _mode },
    label: 'Mai Hoa · ' + tenChinh + ' — ' + r.ketLuan.ten,
    greeting: 'Quẻ đã lập — Thể **' + r.the.n + '** (' + r.the.hanh + '), Dụng **' + r.dung.n + '** (' + r.dung.hanh + '), tức **' + r.ketLuan.ten + '**. Tôi sẽ luận theo câu hỏi của bạn.',
    chips: ['Luận quẻ này cho câu hỏi của tôi', 'Thể bị Dụng khắc thì nên làm gì?', 'Hỗ quái cho thấy khúc giữa ra sao?', 'Biến quái nói kết cục thế nào?']
  });

  const lines = [];
  if (cHoi) lines.push('Câu hỏi: "' + cHoi + '"');
  lines.push('Quẻ chính: ' + tenChinh);
  lines.push(d.theDung);
  lines.push('Kết luận: ' + d.ketLuan);
  Shell.setShareable({ kind: 'text', toolId: 'mai-hoa', title: 'Mai Hoa Dịch Số · ' + tenChinh, text: lines.join('\n') });
  document.querySelectorAll('#resPanel [data-ask]').forEach(function (el) {
    el.addEventListener('click', function () { Shell.ask(el.getAttribute('data-ask')); });
  });
}

// Tranh quẻ phải nạp XONG trước khi dựng poster — hàm draw của Poster chạy
// đồng bộ nên không tự đợi ảnh được. Tranh hỏng thì poster vẫn ra, chỉ mất nền.
function taiAnh() {
  if (!_r || !window.Poster) return;
  _err('mhErr2', '');
  const btn = document.getElementById('taiBtn');
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Đang dựng ảnh…';
  MaiHoaTool.loadAnh(_r)
    .then(function (img) {
      const o = MaiHoaTool.posterOpts(_r, document.getElementById('cauHoi').value.trim());
      o.draw = MaiHoaTool.posterDraw(_r, img);
      o.qrUrl = Poster.qrLink('mai-hoa', '/app/mai-hoa');
      o.qrCaption = 'Quét mã — gieo quẻ của bạn';
      return Poster.download(o, 'mai-hoa-' + (_r.chinh.que ? _r.chinh.que.q.n.toLowerCase().replace(/\s+/g, '-') : 'que') + '-tuviminhbao.png');
    })
    .then(function () { if (window.Track) Track.event('poster_download', { tool_id: 'mai-hoa' }); })
    .catch(function () { _err('mhErr2', 'Chưa dựng được ảnh. Thử lại sau ít giây.'); })
    .then(function () { btn.disabled = false; btn.textContent = old; });
}

function reset() {
  _r = null;
  ['mhCard', 'mhChangs', 'mhHaoTu', 'mhBuoc', 'mhAnh'].forEach(function (id) { document.getElementById(id).innerHTML = ''; });
  document.getElementById('resPanel').style.display = 'none';
  document.getElementById('birthPanel').style.display = 'block';
  document.getElementById('btnEdit').style.display = 'none';
  _err('mhErr', '');
  _err('mhErr2', '');
  Shell.setShareable(null);
}

// Khôi phục phiên: dựng lại từ chính KẾT QUẢ GIEO đã lưu, KHÔNG gieo lại —
// gieo lại là ra quẻ khác, tức phiên cũ mở lên thành một quẻ khác hẳn.
(function () {
  function _restore() {
    const r = window.Shell && Shell.pendingRestore && Shell.pendingRestore();
    if (r && r.gieo) {
      _mode = r.mode || 'gio';
      setMode(_mode);
      if (r.cauHoi) document.getElementById('cauHoi').value = r.cauHoi;
      const res = MaiHoaTool.resolve(r.gieo);
      if (res.ok) { _r = res; showResult(); }
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _restore);
  else _restore();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đặt tên con — Tử Vi Minh Bảo</title>
<meta name="description" content="Gợi ý đặt tên con hợp mệnh theo can chi, ngũ hành nạp âm của con và bố mẹ — hỏi trợ lý AI gợi ý tên và luận ý nghĩa.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=7">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#resPanel{display:none}
.res-head{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cc-card{flex:1;min-width:150px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.cc-card .who{font-size:10.5px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.04em}
.cc-card .cc{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:2px}
.cc-card .na{font-size:12px;color:var(--text-mid);margin-top:2px}
.cc-card .na b{color:var(--hanh,var(--gold-soft))}
.note{background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--text-mid);line-height:1.65;margin-bottom:6px}
.note b{color:var(--text)}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.laso-error{color:var(--red);padding:14px;border:1px solid var(--red);border-radius:10px;background:var(--white)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Đặt tên con</b><span>Chọn tên hợp mệnh con theo ngũ hành cổ pháp</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa thông tin</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div id="shellRecent"></div>
      <div class="form-card" id="birthPanel">
        <h2>Thông tin để đặt tên</h2>
        <p class="sub">Lấy can chi &amp; ngũ hành nạp âm của con và bố mẹ làm nền, rồi hỏi trợ lý gợi ý tên hợp mệnh, luận ý nghĩa từng tên.</p>
        <div class="frow">
          <div class="fg" style="flex:2;min-width:150px"><label>Họ (của con)</label><input type="text" id="inpHo" placeholder="Nguyễn"></div>
          <div class="fg" style="width:110px"><label>Giới tính con</label><select id="inpGt"><option value="nam">Bé trai</option><option value="nu">Bé gái</option></select></div>
        </div>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:120px"><label>Năm sinh con</label><input type="number" id="inpNamCon" placeholder="2025" min="1900" max="2100"></div>
          <div class="fg" style="width:120px"><label>Năm sinh bố</label><input type="number" id="inpNamBo" placeholder="1990" min="1900" max="2100"></div>
          <div class="fg" style="width:120px"><label>Năm sinh mẹ</label><input type="number" id="inpNamMe" placeholder="1992" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="doDatTen()">Lập nền →</button>
        </div>
      </div>

      <div id="resPanel">
        <div class="res-head" id="resHead"></div>
        <div class="cc-row" id="ccRow"></div>
        <div class="note" id="resNote"></div>
        <div class="ask" data-ask="Gợi ý cho tôi 12 tên đẹp hợp mệnh cho con, kèm ý nghĩa và ngũ hành từng tên.">✦ Hỏi trợ lý gợi ý tên hợp mệnh</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='dat-ten';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'dat-ten',title:'Đặt tên con hợp mệnh',desc:'Lấy can chi &amp; ngũ hành nạp âm của con và bố mẹ làm nền, rồi hỏi <b>trợ lý AI</b> gợi ý tên hợp mệnh kèm ý nghĩa từng tên.'};</script>
<script src="/can-chi.js?v=1"></script>
<script src="/auth.js"></script>
<script src="/shell.js?v=29"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var HANH_COLOR={'Mộc':'var(--green)','Hỏa':'var(--red)','Thổ':'var(--gold-soft)','Kim':'#8a8a8a','Thủy':'var(--blue)'};
var SINH={'Mộc':'Hỏa','Hỏa':'Thổ','Thổ':'Kim','Kim':'Thủy','Thủy':'Mộc'};

function doDatTen(){
  var btn=document.getElementById('btnGo');
  var ho=document.getElementById('inpHo').value.trim();
  var gt=document.getElementById('inpGt').value;
  var namCon=parseInt(document.getElementById('inpNamCon').value);
  var namBo=parseInt(document.getElementById('inpNamBo').value);
  var namMe=parseInt(document.getElementById('inpNamMe').value);
  if(!ho||!namCon||!namBo||!namMe){ alert('Vui lòng nhập họ và năm sinh của con, bố, mẹ.'); return; }
  btn.disabled=true;
  try{
    var iCon=CanChi.ccInfo(namCon),iBo=CanChi.ccInfo(namBo),iMe=CanChi.ccInfo(namMe);
    var gtLabel=gt==='nu'?'Bé gái':'Bé trai';
    document.getElementById('resHead').textContent='Nền can chi · ngũ hành '+esc(ho)+' — '+gtLabel;
    function ccCard(who,i){ return '<div class="cc-card"><div class="who">'+esc(who)+'</div><div class="cc">'+esc(i.canChi)+'</div><div class="na" style="--hanh:'+HANH_COLOR[i.hanh]+'">'+esc(i.napAm)+' · <b>'+esc(i.hanh)+'</b></div></div>'; }
    document.getElementById('ccRow').innerHTML=ccCard('Con ('+gtLabel+')',iCon)+ccCard('Bố',iBo)+ccCard('Mẹ',iMe);
    document.getElementById('resNote').innerHTML='Mệnh con nạp âm <b>'+esc(iCon.napAm)+'</b> — hành <b>'+esc(iCon.hanh)+'</b>. Đặt tên nên chọn chữ có ngũ hành <b>tương sinh</b> cho con (hành <b>'+esc(_hanhSinhCho(iCon.hanh))+'</b> sinh <b>'+esc(iCon.hanh)+'</b>) hoặc <b>đồng hành</b> để bồi mệnh, tránh hành khắc. Hỏi trợ lý để có danh sách tên cụ thể hợp cả con lẫn bố mẹ.';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('resPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      scenario:{type:'dat-ten-con',data:{ho:ho,gioiTinh:gt,namCon:namCon,namBo:namBo,namMe:namMe}},
      label:'Đặt tên '+gtLabel+' họ '+ho+' · '+iCon.canChi,
      greeting:'Nền mệnh của bé đã sẵn sàng (con **'+esc(iCon.canChi)+'** · '+esc(iCon.hanh)+'). Bạn muốn tôi gợi ý tên theo hướng nào?',
      chips:['Gợi ý 12 tên hợp mệnh kèm ý nghĩa','Tên đệm nào hợp cho bé?','Con cần bổ ngũ hành gì?','Tên hợp cả tuổi bố và mẹ?']
    });
    document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
  }catch(e){
    document.getElementById('ccRow').innerHTML='<div class="laso-error">Lỗi: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('resPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    if(window.console)console.error(e);
  }finally{ btn.disabled=false; }
}
function _hanhSinhCho(h){ for(var k in SINH){ if(SINH[k]===h)return k; } return h; }
function showForm(){
  document.getElementById('resPanel').style.display='none';
  document.getElementById('birthPanel').style.display='block';
  document.getElementById('btnEdit').style.display='none';
}
</script>
<script>/*SHELL_RESTORE_BOOT*/(function(){function _r(){var r=window.Shell&&Shell.pendingRestore&&Shell.pendingRestore();if(r&&r.form){Shell.fillForm(r.form);doDatTen();}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_r);else _r();})();</script>
</body>
</html>

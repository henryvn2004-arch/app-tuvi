<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title data-i18n="thay.cac-thay-tu-vi-minh-bao">Các Thầy — Tử Vi Minh Bảo</title>
<meta data-i18n-attr="content:thay.15-thay-luan-giai-cua-tu" name="description" content="15 thầy luận giải của Tử Vi Minh Bảo — mỗi thầy một chuyên môn, một giọng luận riêng."/>
<link rel="icon" type="image/webp" href="/seal.webp"/>
<link rel="preload" href="/fonts/noto-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif-vietnamese-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif.css?v=1" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/fonts/noto-serif.css?v=1"></noscript>
<link rel="stylesheet" href="/shell.css?v=79"/>
<style>
.ws-body{padding:22px 26px 60px;max-width:920px}
.thay-search{width:100%;max-width:360px;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;color:var(--heading);background:var(--white);margin-bottom:18px}
.thay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.thay-card{display:flex;gap:12px;border:1px solid var(--line);background:var(--white);border-radius:13px;padding:14px;text-decoration:none;color:inherit}
.thay-card:hover{border-color:var(--gold-soft)}
.thay-ava{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--paper-2)}
.thay-tx{flex:1;min-width:0}
.thay-tx b{display:block;font-family:var(--serif);font-size:14.5px;color:var(--heading)}
.thay-disc{display:inline-block;font-size:11px;font-weight:700;color:var(--gold-soft);background:var(--paper-2);border-radius:20px;padding:1px 9px;margin:4px 0}
.thay-tag{display:block;font-size:12px;color:var(--text-lt);line-height:1.5}
.thay-empty{padding:2.5rem 1rem;text-align:center;color:var(--text-lt);font-size:13.5px}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>
  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div data-i18n="thay.cac-thay-15-thay-luan-giai" class="ws-title"><b>Các Thầy</b><span>15 thầy luận giải — mỗi thầy một chuyên môn, một giọng riêng</span></div>
    </div>
    <div class="ws-body">
      <input data-i18n-attr="placeholder:thay.tim-thay-theo-ten-hoac-chuyen" class="thay-search" type="search" id="thaySearch" placeholder="Tìm thầy theo tên hoặc chuyên môn…" autocomplete="off">
      <div class="thay-grid" id="thayGrid"></div>
      <p data-i18n="thay.khong-tim-thay-thay-nao-khop" class="thay-empty" id="thayEmpty" style="display:none">Không tìm thấy thầy nào khớp.</p>
    </div>
  </main>
</div>

<script src="/nav.js?v=50" data-icons-only></script>
<script src="/auth.js?v=10"></script>
<script>window.SHELL_ACTIVE='thay';</script>
<!-- boot() bên dưới cần ToolPrices ĐỒNG BỘ — để shell.js tự nạp (bất đồng bộ) thì vào thẳng /app/thay ra "Không tìm thấy thầy nào". Cùng id với shell.js/tuvi-paywall.js để không nạp hai lần. -->
<script id="_tvmb_prices_js" src="/tool-prices.js?v=12"></script>
<script src="/shell.js?v=161"></script>
<script src="/tools-shared/shell-soft-nav.js?v=49"></script>
<script>
(function(){
  // 2026-09-24 (hellobot-ui-redesign Đợt 3): nguồn thật `master_profiles`
  // (qua ToolPrices.masters(), xem public/tool-prices.js) — thay bản đặt chỗ
  // ở Đợt 1 (AUTHOR_ROSTER tĩnh trong shell.js, chỉ có tên+giọng, không có
  // chuyên môn/công cụ). AUTHOR_ROSTER vẫn còn cho modal "Chọn thầy" của rail,
  // KHÔNG xoá — hai chỗ dùng hai mục đích khác nhau (rail: đổi avatar/tên khi
  // đang chat; trang này: danh mục có chuyên môn + số công cụ để BẤM VÀO).
  // Tên thầy theo ngôn ngữ trang (I18n.master, W19) — chỉ để hiển thị; vi ⇒ nguyên tên Việt.
  function mname(m){ return (window.I18n && I18n.master) ? I18n.master(m.id, m.display_name) : m.display_name; }
  function mtitle(m){ return (window.I18n && I18n.masterTitle) ? I18n.masterTitle(m.id, m.display_name) : 'Thầy ' + m.display_name; }
  // Chuyên môn + câu cửa miệng: chữ gốc nằm ở DB (`master_profiles`, seed `_patches/migration-master-profiles-thay.sql`).
  // Chỉ dịch khi chữ DB còn TRÙNG câu gốc dưới đây — DB đổi chữ thì hiện chữ DB (không hiện bản dịch cũ của câu khác).
  var TR = {
    'co-nguyet': [[_tvmbT('js.thay.disc-co-nguyet', 'Tử Vi gốc & Luận giải'), 'Tử Vi gốc & Luận giải'], [_tvmbT('js.thay.tag-co-nguyet', 'Xem kỹ cái gốc trước khi luận cái ngọn.'), 'Xem kỹ cái gốc trước khi luận cái ngọn.']],
    'tu-nguyen': [[_tvmbT('js.thay.disc-tu-nguyen', 'Đại vận & Chu trình cuộc đời'), 'Đại vận & Chu trình cuộc đời'], [_tvmbT('js.thay.tag-tu-nguyen', 'Một câu, chốt luôn — không giải thích thêm.'), 'Một câu, chốt luôn — không giải thích thêm.']],
    'nhat-nguyen': [[_tvmbT('js.thay.disc-nhat-nguyen', 'Vận ngắn hạn & Chọn ngày'), 'Vận ngắn hạn & Chọn ngày'], [_tvmbT('js.thay.tag-nhat-nguyen', 'Còn bao lâu nữa? Đếm ngược cho con luôn.'), 'Còn bao lâu nữa? Đếm ngược cho con luôn.']],
    'dau-nam': [[_tvmbT('js.thay.disc-dau-nam', 'Tình duyên & Hôn nhân'), 'Tình duyên & Hôn nhân'], [_tvmbT('js.thay.tag-dau-nam', 'Sự thật khó nghe, nhưng con cần nghe.'), 'Sự thật khó nghe, nhưng con cần nghe.']],
    'ngoc-tinh': [[_tvmbT('js.thay.disc-ngoc-tinh', 'Tương hợp & Duyên nợ'), 'Tương hợp & Duyên nợ'], [_tvmbT('js.thay.tag-ngoc-tinh', 'So sánh với một điều con không ngờ tới.'), 'So sánh với một điều con không ngờ tới.']],
    'dieu-khong': [[_tvmbT('js.thay.disc-dieu-khong', 'Sự nghiệp & Tiền bạc'), 'Sự nghiệp & Tiền bạc'], [_tvmbT('js.thay.tag-dieu-khong', 'Đang lãng phí tài năng ở đúng chỗ này.'), 'Đang lãng phí tài năng ở đúng chỗ này.']],
    'tam-kinh': [[_tvmbT('js.thay.disc-tam-kinh', 'Bát Tự & Kỳ Môn'), 'Bát Tự & Kỳ Môn'], [_tvmbT('js.thay.tag-tam-kinh', 'Đối chiếu ba hệ thống để tìm điểm hội tụ.'), 'Đối chiếu ba hệ thống để tìm điểm hội tụ.']],
    'huyen-khong': [[_tvmbT('js.thay.disc-huyen-khong', 'Phong Thủy'), 'Phong Thủy'], [_tvmbT('js.thay.tag-huyen-khong', 'Nhà cửa đặt sai hướng, người trong nhà mệt mà không biết vì sao.'), 'Nhà cửa đặt sai hướng, người trong nhà mệt mà không biết vì sao.']],
    'bac-minh': [[_tvmbT('js.thay.disc-bac-minh', 'Xem Tướng'), 'Xem Tướng'], [_tvmbT('js.thay.tag-bac-minh', 'Gương mặt không giấu được điều gì với người biết nhìn.'), 'Gương mặt không giấu được điều gì với người biết nhìn.']],
    'linh-son': [[_tvmbT('js.thay.disc-linh-son', 'Sự nghiệp cạnh tranh & Nhân mạch'), 'Sự nghiệp cạnh tranh & Nhân mạch'], [_tvmbT('js.thay.tag-linh-son', 'Ai giúp được con, ai chỉ đang ngáng đường — nhìn lá số là biết.'), 'Ai giúp được con, ai chỉ đang ngáng đường — nhìn lá số là biết.']],
    'thien-an': [[_tvmbT('js.thay.disc-thien-an', 'Đặt Tên & Dạy Con'), 'Đặt Tên & Dạy Con'], [_tvmbT('js.thay.tag-thien-an', 'Ít lời, nhưng mỗi lời đều có cân nhắc.'), 'Ít lời, nhưng mỗi lời đều có cân nhắc.']],
    'linh-co': [[_tvmbT('js.thay.disc-linh-co', 'Kinh Dịch & Mai Hoa'), 'Kinh Dịch & Mai Hoa'], [_tvmbT('js.thay.tag-linh-co', 'Một quẻ, một hình ảnh, một câu trả lời.'), 'Một quẻ, một hình ảnh, một câu trả lời.']],
    'thanh-hu': [[_tvmbT('js.thay.disc-thanh-hu', 'Tarot & Thần Số'), 'Tarot & Thần Số'], [_tvmbT('js.thay.tag-thanh-hu', 'Rút một lá, xem con đang thật sự muốn nghe điều gì.'), 'Rút một lá, xem con đang thật sự muốn nghe điều gì.']],
    'thai-hu': [[_tvmbT('js.thay.disc-thai-hu', 'Hỏi nhanh, phản biện'), 'Hỏi nhanh, phản biện'], [_tvmbT('js.thay.tag-thai-hu', 'Vấn đề không phải ở chỗ con tưởng.'), 'Vấn đề không phải ở chỗ con tưởng.']],
    'tinh-quang': [[_tvmbT('js.thay.disc-tinh-quang', 'Chiêm tinh Tây'), 'Chiêm tinh Tây'], [_tvmbT('js.thay.tag-tinh-quang', 'Nhìn cả bầu trời để hiểu một con người.'), 'Nhìn cả bầu trời để hiểu một con người.']],
  };
  function tr(m, i, v){ var r = TR[m.id] && TR[m.id][i]; return r && r[1] === v ? r[0] : v; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(list){
    var grid = document.getElementById('thayGrid');
    var empty = document.getElementById('thayEmpty');
    if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    grid.innerHTML = list.map(function(m){
      // Bấm thầy là vào chat thẳng với thầy đó (Shell.meetThay) — cùng đích với khối "Các Thầy" ở `/`.
      return '<a class="thay-card" href="' + _tvmbHref('/app?thay=' + esc(m.id) + '#chat') + '">' +
        '<img class="thay-ava" src="/authors/' + esc(m.id) + '.jpg" alt="" loading="lazy">' +
        '<div class="thay-tx">' +
          '<b>' + esc(mtitle(m)) + '</b>' +
          (m.discipline ? '<span class="thay-disc">' + esc(tr(m, 0, m.discipline)) + '</span>' : '') +
          (m.tagline ? '<span class="thay-tag">' + esc(tr(m, 1, m.tagline)) + '</span>' : '') +
        '</div>' +
      '</a>';
    }).join('');
  }

  function boot(){
    if (!window.ToolPrices) { render([]); return; }
    ToolPrices.load().then(function(d){
      var list = ToolPrices.masters(d).slice();
      render(list);
      document.getElementById('thaySearch').addEventListener('input', function(e){
        var q = e.target.value.trim().toLowerCase();
        render(!q ? list : list.filter(function(m){
          return (m.display_name || '').toLowerCase().indexOf(q) >= 0 || String(mname(m)).toLowerCase().indexOf(q) >= 0 ||
                 (m.discipline || '').toLowerCase().indexOf(q) >= 0 ||
                 String(tr(m, 0, m.discipline || '')).toLowerCase().indexOf(q) >= 0;
        }));
      });
    });
  }
  if (window.Shell) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Các Thầy — Tử Vi Minh Bảo</title>
<meta name="description" content="15 thầy luận giải của Tử Vi Minh Bảo — mỗi thầy một chuyên môn, một giọng luận riêng."/>
<link rel="icon" type="image/webp" href="/seal.webp"/>
<link rel="preload" href="/fonts/noto-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif-vietnamese-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif.css?v=1" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/fonts/noto-serif.css?v=1"></noscript>
<link rel="stylesheet" href="/shell.css?v=58"/>
<style>
.ws-body{padding:22px 26px 60px;max-width:920px}
.thay-search{width:100%;max-width:360px;border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;color:var(--heading);background:var(--white);margin-bottom:18px}
.thay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.thay-card{display:flex;gap:12px;border:1px solid var(--line);background:var(--white);border-radius:13px;padding:14px;text-decoration:none;color:inherit}
.thay-card:hover{border-color:var(--gold-soft)}
.thay-ava{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--paper-2)}
.thay-tx{flex:1;min-width:0}
.thay-tx b{display:block;font-family:var(--serif);font-size:14.5px;color:var(--heading)}
.thay-disc{display:inline-block;font-size:11px;font-weight:700;color:var(--gold-soft);background:var(--paper-2);border-radius:20px;padding:1px 9px;margin:4px 0}
.thay-tag{display:block;font-size:12px;color:var(--text-lt);line-height:1.5}
.thay-empty{padding:2.5rem 1rem;text-align:center;color:var(--text-lt);font-size:13.5px}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>
  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Các Thầy</b><span>15 thầy luận giải — mỗi thầy một chuyên môn, một giọng riêng</span></div>
    </div>
    <div class="ws-body">
      <input class="thay-search" type="search" id="thaySearch" placeholder="Tìm thầy theo tên hoặc chuyên môn…" autocomplete="off">
      <div class="thay-grid" id="thayGrid"></div>
      <p class="thay-empty" id="thayEmpty" style="display:none">Không tìm thấy thầy nào khớp.</p>
    </div>
  </main>
</div>

<script src="/nav.js?v=44" data-icons-only></script>
<script src="/auth.js?v=4"></script>
<script>window.SHELL_ACTIVE='thay';</script>
<!-- boot() bên dưới cần ToolPrices ĐỒNG BỘ — để shell.js tự nạp (bất đồng bộ) thì vào thẳng /app/thay ra "Không tìm thấy thầy nào". Cùng id với shell.js/tuvi-paywall.js để không nạp hai lần. -->
<script id="_tvmb_prices_js" src="/tool-prices.js?v=10"></script>
<script src="/shell.js?v=106"></script>
<script src="/tools-shared/shell-soft-nav.js?v=43"></script>
<script>
(function(){
  // 2026-09-24 (hellobot-ui-redesign Đợt 3): nguồn thật `master_profiles`
  // (qua ToolPrices.masters(), xem public/tool-prices.js) — thay bản đặt chỗ
  // ở Đợt 1 (AUTHOR_ROSTER tĩnh trong shell.js, chỉ có tên+giọng, không có
  // chuyên môn/công cụ). AUTHOR_ROSTER vẫn còn cho modal "Chọn thầy" của rail,
  // KHÔNG xoá — hai chỗ dùng hai mục đích khác nhau (rail: đổi avatar/tên khi
  // đang chat; trang này: danh mục có chuyên môn + số công cụ để BẤM VÀO).
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(list){
    var grid = document.getElementById('thayGrid');
    var empty = document.getElementById('thayEmpty');
    if (!list.length) { grid.innerHTML = ''; empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    grid.innerHTML = list.map(function(m){
      return '<a class="thay-card" href="/tac-gia/' + esc(m.id) + '">' +
        '<img class="thay-ava" src="/authors/' + esc(m.id) + '.jpg" alt="" loading="lazy">' +
        '<div class="thay-tx">' +
          '<b>Thầy ' + esc(m.display_name) + '</b>' +
          (m.discipline ? '<span class="thay-disc">' + esc(m.discipline) + '</span>' : '') +
          (m.tagline ? '<span class="thay-tag">' + esc(m.tagline) + '</span>' : '') +
        '</div>' +
      '</a>';
    }).join('');
  }

  function boot(){
    if (!window.ToolPrices) { render([]); return; }
    ToolPrices.load().then(function(d){
      var list = ToolPrices.masters(d).slice();
      render(list);
      document.getElementById('thaySearch').addEventListener('input', function(e){
        var q = e.target.value.trim().toLowerCase();
        render(!q ? list : list.filter(function(m){
          return (m.display_name || '').toLowerCase().indexOf(q) >= 0 ||
                 (m.discipline || '').toLowerCase().indexOf(q) >= 0;
        }));
      });
    });
  }
  if (window.Shell) boot(); else document.addEventListener('DOMContentLoaded', boot);
})();
</script>
</body>
</html>

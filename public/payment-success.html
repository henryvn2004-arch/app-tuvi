<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xác nhận thanh toán — Tử Vi Minh Bảo</title>
<meta name="robots" content="noindex">
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" as="style" onload="this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Be Vietnam Pro', sans-serif;
  background: #fdf6e9;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card {
  background: #fff;
  border: 1px solid #d4c4a0;
  border-radius: 12px;
  padding: 48px 40px;
  max-width: 480px;
  width: 100%;
  text-align: center;
}
.icon { font-size: 56px; margin-bottom: 20px; }
.title {
  font-family: 'Noto Serif', serif;
  font-size: 24px;
  color: #061A2E;
  margin-bottom: 10px;
}
.subtitle { font-size: 14px; color: #777; line-height: 1.6; margin-bottom: 28px; }
.credit-badge {
  display: inline-block;
  background: #F9F4EB;
  border: 1.5px solid #c9a84c;
  color: #9A7B3A;
  font-weight: 700;
  font-size: 22px;
  border-radius: 10px;
  padding: 10px 24px;
  margin-bottom: 24px;
  font-family: 'Noto Serif', serif;
}
.credit-badge small { font-size: 13px; display: block; font-weight: 400; color: #aaa; margin-top: 2px; font-family: inherit; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid #e0e0e0;
  border-top-color: #061A2E;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.btn {
  display: inline-block;
  padding: 12px 24px;
  background: #061A2E;
  color: #fff;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  font-family: inherit;
  margin: 4px;
  transition: background 0.15s;
  border: none;
  cursor: pointer;
}
.btn:hover { background: #1455A4; }
.btn-gold { background: #c9a84c; color: #061A2E; }
.btn-gold:hover { background: #f0d080; }
.btn-outline {
  background: transparent;
  color: #061A2E;
  border: 1.5px solid #061A2E;
}
.btn-outline:hover { background: #061A2E; color: #fff; }
.tools-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 16px;
}
.tool-link {
  display: block;
  padding: 12px;
  background: #F5F4F0;
  border-radius: 8px;
  text-decoration: none;
  color: #061A2E;
  font-size: 13px;
  font-weight: 600;
  transition: background 0.15s;
}
.tool-link:hover { background: #e8e4dc; }
.tool-link .icon-sm { font-size: 20px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <div class="title">Đang xác nhận thanh toán...</div>
  <div class="subtitle" id="msg">Vui lòng chờ trong giây lát</div>
</div>

<script src="/auth.js?v=2"></script>
<script src="/nav.js?v=22" data-icons-only></script>
<script>
// `nav.js?v=22` ở chế độ `data-icons-only` CỐ Ý không nạp Meta Pixel (xem
// nav.js#297). Nhưng đây là trang XÁC NHẬN THANH TOÁN — đúng nơi PHẢI bắn
// Purchase, nên khởi tạo pixel riêng ở đây thay vì trông chờ nav.js. Cùng
// pixel ID với nav.js, cùng lý do bỏ qua `navigator.webdriver` (bộ E2E chạy
// thẳng vào trang này — xem tests/static-pages.spec.ts).
if (!document.getElementById('fb-pixel-js') && !navigator.webdriver) {
  (function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.id='fb-pixel-js';t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)})(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  window.fbq('init', '1747342186469684');
  window.fbq('track', 'PageView');
}
</script>
<script>
const params  = new URLSearchParams(window.location.search);
const slug    = params.get('slug') || '';
const token   = params.get('token') || params.get('orderID') || params.get('order_id');
const payerId = params.get('PayerID');
const userId  = params.get('userId') || '';

function isTopup(s) { return s.startsWith('topup-'); }

async function capture() {
  const ppToken = token || params.get('token');
  if (!ppToken || !slug) {
    showError('Thiếu thông tin thanh toán. Vui lòng liên hệ hỗ trợ.');
    return;
  }

  try {
    // Lấy userId từ URL hoặc session
    let finalUserId = userId;
    if (!finalUserId && window.supabaseClient) {
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      finalUserId = session?.user?.id || '';
    }
    if (!finalUserId && window.Auth?.isLoggedIn()) {
      finalUserId = window.Auth.getUser()?.id || '';
    }

    const res = await fetch('/api/payment?action=capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ orderId: ppToken, slug, userId: finalUserId }),
    });
    const data = await res.json();

    if (data.success) {
      // `status==='already_completed'` nghĩa là webhook (hoặc tab khác) đã chốt
      // đơn này trước — bắn Purchase lần nữa ở đây là TÍNH TRÙNG doanh thu trong
      // Ads Manager dù không có đồng nào mới về. Chỉ bắn ở lượt CHỐT THẬT.
      if (data.status !== 'already_completed') {
        try { window.fbq && window.fbq('track', 'Purchase', { value: data.amountVnd || 0, currency: 'VND' }); } catch (e) {}
      }
      showSuccess(slug, data.credits || 0, data.balance || 0);
    } else {
      showError(data.error || 'Thanh toán thất bại. Vui lòng liên hệ hỗ trợ.');
    }
  } catch (e) {
    showError('Lỗi kết nối. Vui lòng thử lại sau.');
  }
}

function getPackageLabel(slug) {
  const id = slug.replace('topup-', '');
  const labels = { '10': '100 Credits', '20': '220 Credits', '40': '460 Credits' };
  return labels[id] || '? Credits';
}

// Ý định mở khoá quăng từ trang tool trước khi đi PayPal (xem `_insufficient`
// trong tuvi-paywall.js — cùng khoá `tpw_pending_unlock`, cùng gốc site nên
// sessionStorage sống qua được cả chuyến đi PayPal và quay về). Có ý định
// khớp → đưa thẳng khách VỀ ĐÚNG tool thay vì tấm thẻ "dùng ngay" chung chung
// rồi tự trôi về /profile.html — đó chính là chỗ khách phải tự nhớ đường
// quay lại mà 100% không ai quay lại nổi.
function pendingUnlock() {
  let p = null;
  try { p = JSON.parse(sessionStorage.getItem('tpw_pending_unlock') || 'null'); } catch (e) { return null; }
  if (!p || !p.returnUrl) return null;
  if (Date.now() - (Number(p.ts) || 0) > 30 * 60 * 1000) return null;
  return p;
}

function showSuccess(slug, credits, balance) {
  const pending = pendingUnlock();
  if (pending) {
    document.getElementById('card').innerHTML = `
      <div class="icon ic" style="width:1em;height:1em;margin-left:auto;margin-right:auto">${window.iconHtml?window.iconHtml('gift'):''}</div>
      <div class="title">Nạp credits thành công!</div>
      <div class="credit-badge">+${credits} Credits<small>Số dư hiện tại: ${balance} credits</small></div>
      <div class="subtitle">Đang quay lại để mở khoá tiếp…</div>
    `;
    const sep = pending.returnUrl.indexOf('?') >= 0 ? '&' : '?';
    setTimeout(() => { window.location.href = pending.returnUrl + sep + 'tpwResume=1'; }, 1200);
    return;
  }
  const label = getPackageLabel(slug);
  document.getElementById('card').innerHTML = `
    <div class="icon ic" style="width:1em;height:1em;margin-left:auto;margin-right:auto">${window.iconHtml?window.iconHtml('gift'):''}</div>
    <div class="title">Nạp credits thành công!</div>
    <div class="credit-badge">
      +${credits} Credits
      <small>Số dư hiện tại: ${balance} credits</small>
    </div>
    <div class="subtitle">
      Cảm ơn bạn đã tin dùng Tử Vi Minh Bảo.<br>
      Dùng credits để luận giải lá số và xem tuổi.
    </div>
    <a href="/profile.html#credits" class="btn btn-gold" style="display:block;margin-bottom:16px">
      Xem tài khoản →
    </a>
    <div style="font-size:12px;color:#999;margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:1px">Hoặc sử dụng ngay</div>
    <div class="tools-grid">
      <a href="/" class="tool-link"><span class="icon-sm"><span class="ic-inline" data-icon-emoji="🔮" style="display:inline-flex;width:1em;height:1em;vertical-align:-2px;color:#9A7B3A">🔮</span></span>Luận Giải Lá Số</a>
      <a href="/xem-tuoi.html" class="tool-link"><span class="icon-sm"><span class="ic-inline" data-icon-emoji="💑" style="display:inline-flex;width:1em;height:1em;vertical-align:-2px;color:#9A7B3A">💑</span></span>Xem Tuổi Vợ Chồng</a>
      <a href="/xem-lam-an.html" class="tool-link"><span class="icon-sm"><span class="ic-inline" data-icon-emoji="💼" style="display:inline-flex;width:1em;height:1em;vertical-align:-2px;color:#9A7B3A">💼</span></span>Xem Tuổi Làm Ăn</a>
      <a href="/topup.html" class="tool-link"><span class="icon-sm"><span class="ic-inline" data-icon-emoji="💳" style="display:inline-flex;width:1em;height:1em;vertical-align:-2px;color:#9A7B3A">💳</span></span>Nạp Thêm Credits</a>
    </div>
  `;
  // Auto redirect to profile after 4s
  setTimeout(() => { window.location.href = '/profile.html'; }, 4500);
}

function showError(msg) {
  document.getElementById('card').innerHTML = `
    <div class="icon ic" style="width:1em;height:1em;margin-left:auto;margin-right:auto">${window.iconHtml?window.iconHtml('x-circle'):''}</div>
    <div class="title">Có lỗi xảy ra</div>
    <div class="subtitle" style="color:#C0392B">${msg}</div>
    <div style="margin-top:20px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px">
      <a href="/topup.html" class="btn btn-outline">← Quay lại nạp credits</a>
      <a href="/contact.html" class="btn btn-gold">Liên hệ hỗ trợ</a>
    </div>
  `;
}

async function waitForAuth(timeout = 3000) {
  const start = Date.now();
  while (Date.now() - start < timeout) {
    if (window.Auth) return;
    await new Promise(r => setTimeout(r, 100));
  }
}
waitForAuth().then(() => capture());
</script>
</body>
</html>

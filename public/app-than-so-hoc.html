<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thần số học — Tử Vi Minh Bảo</title>
<meta name="description" content="Tính số chủ đạo (Life Path) theo ngày sinh — luận tính cách, sự nghiệp, tình cảm theo Thần Số Học Pythagoras. Hỏi trợ lý AI.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=5">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#resPanel{display:none}
.res-head{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.num-hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.num-big{width:76px;height:76px;flex:0 0 auto;border-radius:16px;background:var(--navy);color:var(--gold);font-family:var(--serif);font-size:38px;font-weight:700;display:flex;align-items:center;justify-content:center}
.num-side .t{font-family:var(--serif);font-size:15px;font-weight:600}
.num-side .s{font-size:12.5px;color:var(--text-lt);margin-top:2px}
.note{background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--text-mid);line-height:1.65;margin-bottom:6px}
.note b{color:var(--text)}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.laso-error{color:var(--red);padding:14px;border:1px solid var(--red);border-radius:10px;background:var(--white)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Thần số học</b><span>Số chủ đạo theo ngày sinh</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div class="form-card" id="birthPanel">
        <h2>Ngày sinh (dương lịch)</h2>
        <p class="sub">Tính số chủ đạo (Life Path) theo Thần Số Học Pythagoras, rồi hỏi trợ lý luận tính cách, sự nghiệp, tình cảm hợp với con số của bạn.</p>
        <div class="frow">
          <div class="fg" style="flex:1;min-width:150px"><label>Họ tên (tùy chọn)</label><input type="text" id="inpTen" placeholder="Nguyễn Minh Anh"></div>
        </div>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:80px"><label>Ngày</label><input type="number" id="inpDd" placeholder="15" min="1" max="31"></div>
          <div class="fg" style="width:80px"><label>Tháng</label><input type="number" id="inpMm" placeholder="6" min="1" max="12"></div>
          <div class="fg" style="width:110px"><label>Năm</label><input type="number" id="inpYyyy" placeholder="1990" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="doThanSo()">Tính số →</button>
        </div>
      </div>

      <div id="resPanel">
        <div class="res-head" id="resHead"></div>
        <div class="num-hero" id="numHero"></div>
        <div class="note" id="resNote"></div>
        <div class="ask" data-ask="Luận giúp tôi số chủ đạo này: tính cách, điểm mạnh yếu, sự nghiệp và tình cảm hợp.">✦ Hỏi trợ lý luận số chủ đạo</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='than-so-hoc';
window.SHELL_INTRO={key:'than-so-hoc',title:'Thần số học',desc:'Tính <b>số chủ đạo</b> (Life Path) theo ngày sinh, rồi hỏi <b>trợ lý AI</b> luận tính cách, sự nghiệp, tình cảm hợp với con số của bạn.'};</script>
<script src="/auth.js"></script>
<script src="/shell.js?v=18"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function reduceCore(n){ while(n>9&&n!==11&&n!==22&&n!==33){ n=String(n).split('').reduce(function(s,d){return s+Number(d);},0);} return n; }
function doThanSo(){
  var btn=document.getElementById('btnGo');
  var ten=document.getElementById('inpTen').value.trim();
  var dd=parseInt(document.getElementById('inpDd').value),mm=parseInt(document.getElementById('inpMm').value),yy=parseInt(document.getElementById('inpYyyy').value);
  if(!dd||!mm||!yy){ alert('Vui lòng nhập đầy đủ ngày, tháng, năm sinh.'); return; }
  btn.disabled=true;
  try{
    var digits=(''+dd)+(''+mm)+(''+yy);
    var sum=digits.split('').reduce(function(s,d){return s+Number(d);},0);
    var life=reduceCore(sum),bday=reduceCore(dd),master=[11,22,33].indexOf(life)>=0;
    var dob=(dd<10?'0'+dd:dd)+'/'+(mm<10?'0'+mm:mm)+'/'+yy;
    document.getElementById('resHead').textContent='Thần số học'+(ten?' — '+esc(ten):'')+' · '+dob;
    document.getElementById('numHero').innerHTML=
      '<div class="num-big">'+life+'</div>'+
      '<div class="num-side"><div class="t">Số chủ đạo '+life+(master?' (số bậc thầy)':'')+'</div><div class="s">Số ngày sinh: '+bday+' · Ngày '+dob+'</div></div>';
    document.getElementById('resNote').innerHTML='Số chủ đạo (Life Path) là con số cốt lõi trong Thần Số Học, phản ánh con đường và bài học đời người. '+(master?'Đây là <b>số bậc thầy</b> ('+life+') — tiềm năng lớn kèm thử thách cao. ':'')+'Hỏi trợ lý để luận chi tiết tính cách, sự nghiệp và mối quan hệ hợp.';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      scenario:{type:'than-so-hoc',data:{dd:dd,mm:mm,yyyy:yy,ten:ten}},
      label:'Thần số học · số '+life,
      greeting:'Số chủ đạo của bạn là **'+life+'**'+(master?' (số bậc thầy)':'')+'. Bạn muốn tôi luận gì trước?',
      chips:['Số này nói gì về tính cách tôi?','Nghề nghiệp nào hợp?','Tình cảm hợp số mấy?','Điểm mạnh và điểm yếu của số này?']
    });
    document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
  }catch(e){
    document.getElementById('numHero').innerHTML='<div class="laso-error">Lỗi: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.console)console.error(e);
  }finally{ btn.disabled=false; }
}
function showForm(){document.getElementById('resPanel').style.display='none';document.getElementById('birthPanel').style.display='block';document.getElementById('btnEdit').style.display='none';}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hướng Bát Trạch — Tử Vi Minh Bảo</title>
<meta name="description" content="Tính cung phi (mệnh quái) và nhóm Đông/Tây tứ mệnh theo năm sinh và giới tính — hướng nhà, cửa, bếp, giường hợp mệnh. Hỏi trợ lý AI.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=5">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#resPanel{display:none}
.res-head{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cc-card{flex:1;min-width:150px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.cc-card .who{font-size:10.5px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.04em}
.cc-card .cc{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:2px}
.cc-card .na{font-size:12px;color:var(--text-mid);margin-top:2px}
.note{background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--text-mid);line-height:1.65;margin-bottom:6px}
.note b{color:var(--text)}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.laso-error{color:var(--red);padding:14px;border:1px solid var(--red);border-radius:10px;background:var(--white)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Hướng Bát Trạch</b><span>Cung phi & hướng hợp mệnh</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div class="form-card" id="birthPanel">
        <h2>Năm sinh & giới tính (âm lịch)</h2>
        <p class="sub">Tính cung phi (mệnh quái) và nhóm Đông/Tây tứ mệnh, rồi hỏi trợ lý hướng nhà, cửa chính, bếp, giường nên đặt và hướng cần tránh theo Bát Trạch.</p>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:120px"><label>Năm sinh</label><input type="number" id="inpNam" placeholder="1990" min="1900" max="2100"></div>
          <div class="fg" style="width:110px"><label>Giới tính</label><select id="inpGt"><option value="nam">Nam</option><option value="nu">Nữ</option></select></div>
          <button class="btn-go" id="btnGo" onclick="doBatTrach()">Tính cung phi →</button>
        </div>
      </div>

      <div id="resPanel">
        <div class="res-head" id="resHead"></div>
        <div class="cc-row" id="ccRow"></div>
        <div class="note" id="resNote"></div>
        <div class="ask" data-ask="Với mệnh quái này, hướng nhà, cửa chính, bếp và giường nên đặt hướng nào, tránh hướng nào? Nếu buộc dùng hướng xấu thì hóa giải sao?">✦ Hỏi trợ lý hướng hợp & cách hóa giải</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='bat-trach';
window.SHELL_INTRO={key:'bat-trach',title:'Hướng Bát Trạch',desc:'Tính <b>cung phi</b> (mệnh quái) và nhóm Đông/Tây tứ mệnh theo năm sinh, rồi hỏi <b>trợ lý AI</b> hướng nhà, cửa, bếp, giường hợp mệnh.'};</script>
<script src="/can-chi.js?v=1"></script>
<script src="/auth.js"></script>
<script src="/shell.js?v=18"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var QUAI={1:['Khảm','Thủy'],2:['Khôn','Thổ'],3:['Chấn','Mộc'],4:['Tốn','Mộc'],6:['Càn','Kim'],7:['Đoài','Kim'],8:['Cấn','Thổ'],9:['Ly','Hỏa']};
function sumToOne(y){ var s=(''+y).split('').reduce(function(a,d){return a+Number(d);},0); while(s>9)s=(''+s).split('').reduce(function(a,d){return a+Number(d);},0); return s===0?9:s; }
function menhQuai(nam,gt){
  var t=sumToOne(nam),q;
  if(gt==='nam'){ q=(nam>=2000?9-t:11-t); if(q>9)q-=9; if(q<=0)q+=9; if(q===5)q=2; }
  else { q=(nam>=2000?t+6:t+4); if(q>9)q-=9; if(q===5)q=8; }
  return q;
}
function doBatTrach(){
  var btn=document.getElementById('btnGo');
  var nam=parseInt(document.getElementById('inpNam').value);
  var gt=document.getElementById('inpGt').value;
  if(!nam){ alert('Vui lòng nhập năm sinh.'); return; }
  btn.disabled=true;
  try{
    var i=CanChi.ccInfo(nam),q=menhQuai(nam,gt),quai=QUAI[q]||QUAI[2];
    var dongTu=[1,3,4,9].indexOf(q)>=0;
    var nhom=dongTu?'Đông tứ mệnh':'Tây tứ mệnh';
    var huong=dongTu?'Bắc, Nam, Đông, Đông Nam':'Tây Bắc, Tây Nam, Tây, Đông Bắc';
    document.getElementById('resHead').textContent='Cung phi — '+esc(quai[0])+' ('+nhom+')';
    document.getElementById('ccRow').innerHTML=
      '<div class="cc-card"><div class="who">Tuổi · '+(gt==='nu'?'Nữ':'Nam')+'</div><div class="cc">'+esc(i.canChi)+'</div><div class="na">'+esc(i.napAm)+'</div></div>'+
      '<div class="cc-card"><div class="who">Mệnh quái</div><div class="cc">'+esc(quai[0])+'</div><div class="na">hành '+esc(quai[1])+' · '+nhom+'</div></div>';
    document.getElementById('resNote').innerHTML='Mệnh quái <b>'+esc(quai[0])+'</b> thuộc <b>'+nhom+'</b> — hợp 4 hướng tốt: <b>'+huong+'</b> (các hướng Sinh Khí, Thiên Y, Diên Niên, Phục Vị). Hỏi trợ lý để biết hướng cụ thể cho cửa chính, bếp, giường và cách hóa giải hướng xấu.';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      scenario:{type:'bat-trach',data:{nam:nam,gioiTinh:gt}},
      label:'Bát Trạch · '+quai[0]+' · '+nhom,
      greeting:'Cung phi của bạn là **'+esc(quai[0])+'** ('+nhom+'). Bạn muốn hỏi hướng cho việc gì?',
      chips:['Hướng nhà nào hợp nhất?','Bếp nên đặt hướng nào?','Giường ngủ quay hướng nào?','Buộc ở hướng xấu thì hóa giải sao?']
    });
    document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
  }catch(e){
    document.getElementById('ccRow').innerHTML='<div class="laso-error">Lỗi: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.console)console.error(e);
  }finally{ btn.disabled=false; }
}
function showForm(){document.getElementById('resPanel').style.display='none';document.getElementById('birthPanel').style.display='block';document.getElementById('btnEdit').style.display='none';}
</script>
</body>
</html>

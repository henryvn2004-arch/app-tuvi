<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xem tuổi sinh con — Tử Vi Minh Bảo</title>
<meta name="description" content="Xem năm sinh con hợp tuổi bố mẹ theo địa chi (lục hợp, tam hợp, xung, hình) — nền can chi bố mẹ rồi hỏi trợ lý AI năm nào tốt nhất để sinh con.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=5">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#resPanel{display:none}
.res-head{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cc-card{flex:1;min-width:150px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.cc-card .who{font-size:10.5px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.04em}
.cc-card .cc{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:2px}
.cc-card .na{font-size:12px;color:var(--text-mid);margin-top:2px}
.cc-card .na b{color:var(--hanh,var(--gold-soft))}
/* Bảng năm sinh con (client tự chấm địa chi để xem nhanh; rail luận sâu) */
.yr-wrap{max-width:600px;margin-bottom:6px}
.yr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.yr{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:8px 9px;text-align:center;box-shadow:var(--shadow)}
.yr .y{font-family:var(--serif);font-size:16px;font-weight:600}
.yr .cc{font-size:11px;color:var(--text-lt);margin-top:1px}
.yr .tag{font-size:10.5px;font-weight:600;margin-top:5px;border-radius:20px;padding:1px 8px;display:inline-block}
.note{background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--text-mid);line-height:1.65;margin:12px 0 6px}
.note b{color:var(--text)}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.laso-error{color:var(--red);padding:14px;border:1px solid var(--red);border-radius:10px;background:var(--white)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Xem tuổi sinh con</b><span>Năm sinh con hợp tuổi bố mẹ theo địa chi</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa thông tin</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div class="form-card" id="birthPanel">
        <h2>Năm sinh của bố và mẹ</h2>
        <p class="sub">Lấy can chi tuổi bố mẹ làm nền, chấm hợp/xung địa chi cho từng năm 15 năm tới, rồi hỏi trợ lý luận sâu năm nào nên sinh con và vì sao.</p>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:130px"><label>Năm sinh bố</label><input type="number" id="inpNamBo" placeholder="1990" min="1900" max="2100"></div>
          <div class="fg" style="width:130px"><label>Năm sinh mẹ</label><input type="number" id="inpNamMe" placeholder="1992" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="doSinhCon()">Lập nền →</button>
        </div>
      </div>

      <div id="resPanel">
        <div class="res-head" id="resHead"></div>
        <div class="cc-row" id="ccRow"></div>
        <div class="yr-wrap"><div class="yr-grid" id="yrGrid"></div></div>
        <div class="note" id="resNote"></div>
        <div class="ask" data-ask="Trong 15 năm tới, năm nào tốt nhất để sinh con hợp tuổi cả bố và mẹ? Nêu vài năm cụ thể kèm lý do và năm nào nên tránh.">✦ Hỏi trợ lý năm nào nên sinh con</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='sinh-con';
window.SHELL_INTRO={key:'sinh-con',title:'Xem tuổi sinh con',desc:'Lấy can chi tuổi bố mẹ, chấm hợp/xung địa chi cho 15 năm tới, rồi hỏi <b>trợ lý AI</b> năm nào nên sinh con hợp tuổi cả nhà.'};</script>
<script src="/can-chi.js?v=1"></script>
<script src="/auth.js"></script>
<script src="/shell.js?v=18"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var HANH_COLOR={'Mộc':'var(--green)','Hỏa':'var(--red)','Thổ':'var(--gold-soft)','Kim':'#8a8a8a','Thủy':'var(--blue)'};
// Địa chi (khớp lib/engine/diachi.ts để xem nhanh; server vẫn là nguồn chuẩn cho rail)
var LUC_HOP=[[0,1],[2,11],[3,10],[4,9],[5,8],[6,7]];
var LUC_XUNG=[[0,6],[1,7],[2,8],[3,9],[4,10],[5,11]];
var TAM_HOP=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]];
var TAM_HINH=[[2,11,8],[0,3,6],[1,4,7]];
function inPair(ps,a,b){return ps.some(function(p){return (p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a);});}
function inGroup(gs,a,b){return gs.some(function(g){return g.indexOf(a)>-1&&g.indexOf(b)>-1;});}
function scoreYear(ci,cb,cm){
  var s=0;
  if(inPair(LUC_HOP,ci,cb))s+=3;else if(inGroup(TAM_HOP,ci,cb))s+=2;else if(inPair(LUC_XUNG,ci,cb))s-=3;else if(inGroup(TAM_HINH,ci,cb))s-=2;
  if(inPair(LUC_HOP,ci,cm))s+=3;else if(inGroup(TAM_HOP,ci,cm))s+=2;else if(inPair(LUC_XUNG,ci,cm))s-=3;else if(inGroup(TAM_HINH,ci,cm))s-=2;
  return s;
}
function yrTag(s){
  if(s>=5)return{t:'Rất thuận',c:'var(--green)',bg:'rgba(30,107,60,.1)'};
  if(s>=2)return{t:'Thuận',c:'var(--blue)',bg:'rgba(20,85,164,.1)'};
  if(s>=0)return{t:'Bình',c:'var(--gold-soft)',bg:'var(--gold-lt)'};
  return{t:'Lưu ý',c:'var(--red)',bg:'rgba(192,57,43,.1)'};
}

function doSinhCon(){
  var btn=document.getElementById('btnGo');
  var namBo=parseInt(document.getElementById('inpNamBo').value);
  var namMe=parseInt(document.getElementById('inpNamMe').value);
  if(!namBo||!namMe){ alert('Vui lòng nhập năm sinh của cả bố và mẹ.'); return; }
  btn.disabled=true;
  try{
    var iBo=CanChi.ccInfo(namBo),iMe=CanChi.ccInfo(namMe);
    document.getElementById('resHead').textContent='Nền can chi bố mẹ · 15 năm tới';
    function ccCard(who,i){ return '<div class="cc-card"><div class="who">'+esc(who)+'</div><div class="cc">'+esc(i.canChi)+'</div><div class="na" style="--hanh:'+HANH_COLOR[i.hanh]+'">'+esc(i.napAm)+' · <b>'+esc(i.hanh)+'</b></div></div>'; }
    document.getElementById('ccRow').innerHTML=ccCard('Bố',iBo)+ccCard('Mẹ',iMe);
    // Bảng 15 năm (xem nhanh)
    var cur=new Date().getFullYear(),cells='';
    for(var y=cur;y<cur+15;y++){
      var info=CanChi.ccInfo(y);var sc=scoreYear(info.chiIdx,iBo.chiIdx,iMe.chiIdx);var tg=yrTag(sc);
      cells+='<div class="yr"><div class="y">'+y+'</div><div class="cc">'+esc(info.canChi)+'</div><div class="tag" style="color:'+tg.c+';background:'+tg.bg+'">'+tg.t+'</div></div>';
    }
    document.getElementById('yrGrid').innerHTML=cells;
    document.getElementById('resNote').innerHTML='Năm hợp là năm địa chi <b>lục hợp / tam hợp</b> với tuổi bố mẹ; năm cần lưu ý là <b>lục xung / tam hình</b>. Bảng trên chấm nhanh theo địa chi — hỏi trợ lý để luận sâu năm đẹp nhất, tháng hợp và điều nên chuẩn bị.';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('resPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      scenario:{type:'xem-tuoi-sinh-con',data:{namBo:namBo,namMe:namMe}},
      label:'Sinh con · bố '+iBo.canChi+' × mẹ '+iMe.canChi,
      greeting:'Đã lập nền địa chi (bố **'+esc(iBo.canChi)+'** · mẹ **'+esc(iMe.canChi)+'**), chấm hợp/xung 15 năm tới. Bạn muốn tôi tư vấn gì trước?',
      chips:['Năm nào tốt nhất để sinh con?','Vì sao năm đó hợp cả bố lẫn mẹ?','Năm nào nên tránh sinh con?','Con tuổi gì hợp với bố mẹ nhất?']
    });
    document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
  }catch(e){
    document.getElementById('ccRow').innerHTML='<div class="laso-error">Lỗi: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';
    document.getElementById('resPanel').style.display='block';
    document.getElementById('btnEdit').style.display='';
    if(window.console)console.error(e);
  }finally{ btn.disabled=false; }
}
function showForm(){
  document.getElementById('resPanel').style.display='none';
  document.getElementById('birthPanel').style.display='block';
  document.getElementById('btnEdit').style.display='none';
}
</script>
</body>
</html>

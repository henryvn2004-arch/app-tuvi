<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kim Lâu & Tam Tai — Tử Vi Minh Bảo</title>
<meta name="description" content="Xem tuổi làm nhà, cưới hỏi có phạm Kim Lâu, Tam Tai không theo tuổi mụ — bảng các năm đẹp/kỵ và cách hóa giải. Hỏi trợ lý AI.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=5">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.btn-go:disabled{opacity:.6;cursor:not-allowed}
#resPanel{display:none}
.res-head{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:12px}
.cc-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.cc-card{flex:1;min-width:150px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.cc-card .who{font-size:10.5px;color:var(--text-lt);text-transform:uppercase;letter-spacing:.04em}
.cc-card .cc{font-family:var(--serif);font-size:19px;font-weight:600;margin-top:2px}
.cc-card .na{font-size:12px;color:var(--text-mid);margin-top:2px}
.yr-wrap{max-width:600px;margin-bottom:6px}
.yr-tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.yr-tbl th,.yr-tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
.yr-tbl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-lt);background:var(--paper)}
.yr-tbl tr:last-child td{border-bottom:none}
.tg{font-size:11px;font-weight:600;border-radius:20px;padding:1px 8px;display:inline-block}
.tg.ok{color:var(--green);background:rgba(30,107,60,.1)}
.tg.bad{color:var(--red);background:rgba(192,57,43,.1)}
.note{background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:10px;padding:12px 15px;font-size:13px;color:var(--text-mid);line-height:1.65;margin:12px 0 6px}
.note b{color:var(--text)}
.ask{margin-top:12px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
.laso-error{color:var(--red);padding:14px;border:1px solid var(--red);border-radius:10px;background:var(--white)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Kim Lâu & Tam Tai</b><span>Tuổi làm nhà · cưới hỏi có phạm không</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div class="form-card" id="birthPanel">
        <h2>Năm sinh người chủ sự (âm lịch)</h2>
        <p class="sub">Xét theo tuổi mụ: năm nào phạm Kim Lâu (Thân/Thê/Tử/Lục Súc) và Tam Tai, năm nào đẹp để làm nhà, cưới hỏi. Rồi hỏi trợ lý cách hóa giải.</p>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="width:140px"><label>Năm sinh</label><input type="number" id="inpNam" placeholder="1990" min="1900" max="2100"></div>
          <button class="btn-go" id="btnGo" onclick="doKimLau()">Xét Kim Lâu →</button>
        </div>
      </div>

      <div id="resPanel">
        <div class="res-head" id="resHead"></div>
        <div class="cc-row" id="ccRow"></div>
        <div class="yr-wrap"><table class="yr-tbl"><thead><tr><th>Năm</th><th>Tuổi mụ</th><th>Can chi</th><th>Tình trạng</th></tr></thead><tbody id="yrBody"></tbody></table></div>
        <div class="note" id="resNote"></div>
        <div class="ask" data-ask="Trong các năm tới, năm nào đẹp nhất để làm nhà / cưới hỏi cho tuổi tôi? Năm phạm thì hóa giải thế nào (mượn tuổi)?">✦ Hỏi trợ lý năm đẹp & cách hóa giải</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='kim-lau';
window.SHELL_INTRO={key:'kim-lau',title:'Kim Lâu & Tam Tai',desc:'Xét theo tuổi mụ năm nào phạm <b>Kim Lâu</b> / <b>Tam Tai</b>, năm nào đẹp để làm nhà, cưới hỏi. Rồi hỏi <b>trợ lý AI</b> cách hóa giải.'};</script>
<script src="/can-chi.js?v=1"></script>
<script src="/auth.js"></script>
<script src="/shell.js?v=18"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var CHI=['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
var TAM_HOP=[[8,0,4],[2,6,10],[5,9,1],[11,3,7]];
var TAM_TAI=[[2,3,4],[8,9,10],[11,0,1],[5,6,7]];
var KL={1:'Kim Lâu Thân',3:'Kim Lâu Thê',6:'Kim Lâu Tử',8:'Kim Lâu Lục Súc'};
function doKimLau(){
  var btn=document.getElementById('btnGo');
  var nam=parseInt(document.getElementById('inpNam').value);
  if(!nam){ alert('Vui lòng nhập năm sinh.'); return; }
  btn.disabled=true;
  try{
    var info=CanChi.ccInfo(nam);
    var cuc=-1; for(var c=0;c<TAM_HOP.length;c++){ if(TAM_HOP[c].indexOf(info.chiIdx)>=0){cuc=c;break;} }
    var tamTaiChi=cuc>=0?TAM_TAI[cuc].map(function(x){return CHI[x];}):[];
    document.getElementById('resHead').textContent='Kim Lâu & Tam Tai — tuổi '+esc(info.canChi);
    document.getElementById('ccRow').innerHTML=
      '<div class="cc-card"><div class="who">Tuổi</div><div class="cc">'+esc(info.canChi)+'</div><div class="na">'+esc(info.napAm)+' · '+esc(info.hanh)+'</div></div>'+
      '<div class="cc-card"><div class="who">Tam Tai các năm chi</div><div class="cc" style="font-size:15px">'+esc(tamTaiChi.join(', '))+'</div></div>';
    var cur=new Date().getFullYear(),rows='';
    for(var y=cur;y<cur+10;y++){
      var tm=y-nam+1,r=tm%9,pk=[1,3,6,8].indexOf(r)>=0;
      var yi=CanChi.ccInfo(y),tt=cuc>=0&&TAM_TAI[cuc].indexOf(yi.chiIdx)>=0;
      var st=[];if(pk)st.push('<span class="tg bad">'+KL[r]+'</span>');if(tt)st.push('<span class="tg bad">Tam Tai</span>');if(!st.length)st.push('<span class="tg ok">Đẹp</span>');
      rows+='<tr><td>'+y+'</td><td>'+tm+'</td><td>'+esc(yi.canChi)+'</td><td>'+st.join(' ')+'</td></tr>';
    }
    document.getElementById('yrBody').innerHTML=rows;
    document.getElementById('resNote').innerHTML='Tuổi mụ = năm xem − năm sinh + 1. Phạm <b>Kim Lâu</b> khi tuổi mụ chia 9 dư 1/3/6/8; <b>Tam Tai</b> rơi vào 3 năm liền theo cục tam hợp. Năm phạm có thể <b>mượn tuổi</b> người khác đứng ra làm chủ. Hỏi trợ lý để chọn năm và cách hóa giải cụ thể.';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
    Shell.setContext({
      scenario:{type:'kim-lau',data:{nam:nam}},
      label:'Kim Lâu · tuổi '+info.canChi,
      greeting:'Đã xét Kim Lâu & Tam Tai cho tuổi **'+esc(info.canChi)+'** (10 năm tới). Bạn muốn hỏi gì?',
      chips:['Năm nào đẹp nhất để làm nhà?','Năm nào cưới hỏi được?','Phạm Kim Lâu thì hóa giải sao?','Tam Tai kiêng những gì?']
    });
    document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){ el.addEventListener('click',function(){ Shell.ask(el.getAttribute('data-ask')); }); });
  }catch(e){
    document.getElementById('ccRow').innerHTML='<div class="laso-error">Lỗi: '+esc(e.message)+'</div>';
    document.getElementById('birthPanel').style.display='none';document.getElementById('resPanel').style.display='block';document.getElementById('btnEdit').style.display='';
    if(window.console)console.error(e);
  }finally{ btn.disabled=false; }
}
function showForm(){document.getElementById('resPanel').style.display='none';document.getElementById('birthPanel').style.display='block';document.getElementById('btnEdit').style.display='none';}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luận Đường — Tử Vi Minh Bảo</title>
<meta name="description" content="Luận Đường — không gian mệnh lý AI: lá số Tử Vi, Bát Tự, xem tuổi, đặt tên, chọn ngày — chọn một công cụ để bắt đầu và hỏi trợ lý theo ngữ cảnh.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" as="style" onload="this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/shell.css?v=17">
<style>
.home-body{max-width:920px}
.hero{background:linear-gradient(135deg,var(--navy),#0d2a49);border-radius:16px;padding:26px 28px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden}
.hero .seal{position:absolute;right:-10px;top:-14px;font-size:150px;line-height:1;color:rgba(212,175,55,.13);font-family:var(--serif);pointer-events:none}
.hero h1{font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:7px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.6;max-width:560px}
.grp-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--text-mid);margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);text-decoration:none;transition:.15s;position:relative}
.tcard:hover{border-color:var(--gold-soft);transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,26,46,.09)}
.tcard .ic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center}
.tcard .ic svg{width:20px;height:20px}
.tcard .tx b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.tcard .tx span{font-size:12px;color:var(--text-lt);line-height:1.5}
.tcard .cost{position:absolute;top:11px;right:12px;font-size:10.5px;font-weight:600;color:var(--gold-soft);background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:20px;padding:1px 8px}
.tcard .cost.free{color:#fff;background:var(--green);border-color:var(--green)}
.tcard.ext .tx b::after{content:"↗";font-size:11px;color:var(--text-lt);margin-left:5px;font-family:var(--sans)}
/* ── VẬN HÔM NAY — thẻ hero theo ngày (deterministic, miễn phí) → mồi vào rail luận riêng ── */
.today-card{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--navy),#0d2a49);border-radius:16px;padding:20px 22px;margin-bottom:22px;color:#fff}
.today-card .glow{position:absolute;right:-34px;top:-46px;width:190px;height:190px;background:radial-gradient(circle,rgba(201,168,76,.22),transparent 70%);pointer-events:none}
.today-eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.today-date{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.25;max-width:calc(100% - 92px)}
.today-date .cc{color:var(--gold-on-navy)}
.today-hanh{position:absolute;top:20px;right:22px;font-size:11px;font-weight:700;color:#2a1e05;background:linear-gradient(135deg,var(--gold-soft),var(--gold));border-radius:20px;padding:4px 12px;white-space:nowrap}
/* Nhãn tốt/bình/xấu của ngày — màu là tín hiệu ĐỌC LƯỚT, đừng đổi thành vàng
   hết: cả điểm của thẻ là nhìn 1 giây biết hôm nay có nên khởi sự không. */
.today-hanh.v-tot{background:linear-gradient(135deg,#4c9a6a,#2f7a4d);color:#fff}
.today-hanh.v-xau{background:linear-gradient(135deg,#c0563f,#a13a25);color:#fff}
.today-sub{font-size:12.5px;color:rgba(255,255,255,.72);margin:5px 0 13px;line-height:1.5;max-width:540px}
.today-meta{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 13px}
.tm-item{font-size:11.5px;color:rgba(255,255,255,.74);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 9px;white-space:nowrap}
.tm-item b{color:var(--gold-on-navy);font-weight:600}
.today-warn{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;color:#ffd9cf;background:rgba(192,86,63,.18);border:1px solid rgba(192,86,63,.42);border-radius:9px;padding:8px 11px;margin-bottom:13px}
.today-me{background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.28);border-radius:10px;padding:11px 13px;margin-bottom:14px}
.today-me .tme-h{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:5px}
.today-me .tme-b{font-size:12.5px;color:rgba(255,255,255,.88);line-height:1.55}
.today-me .tme-b b{color:var(--gold-on-navy);font-weight:600}
/* Dòng "lá số đang dùng" + nút Đổi — trước đây thẻ luận vận riêng mà KHÔNG nói
   nó đang dựa trên lá số nào, nên lá số sai thì không có đường nào sửa. */
.tme-src{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:9px;padding-top:9px;border-top:1px solid rgba(201,168,76,.22);font-size:11.5px;color:rgba(255,255,255,.55)}
.tme-src b{color:rgba(255,255,255,.8);font-weight:600}
.tme-edit{background:none;border:1px solid rgba(201,168,76,.45);color:var(--gold-on-navy);border-radius:20px;padding:2px 11px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.tme-edit:hover{background:rgba(201,168,76,.16)}
.tme-cta{margin-top:10px;background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1e05;border:none;border-radius:8px;padding:8px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
/* Form nhập lá số ngay trong thẻ. CỐ Ý không đá người dùng sang trang khác:
   chỗ này là đáy phễu của khối cá nhân, mỗi lần chuyển trang là một lần rơi. */
.tme-form{margin-top:11px}
.tme-form .frow{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:9px}
.tme-form .fg{display:flex;flex-direction:column;gap:4px}
.tme-form .fg label{font-size:9.5px;font-weight:600;color:rgba(255,255,255,.5);letter-spacing:.04em;text-transform:uppercase}
.tme-form .fg input,.tme-form .fg select{border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:6px 8px;font-size:12.5px;font-family:inherit;color:#fff;background:rgba(255,255,255,.08);outline:none}
.tme-form .fg option{color:#111;background:#fff}
.tme-form .fg input:focus,.tme-form .fg select:focus{border-color:var(--gold)}
.tme-form .tvf-gio-am-wrap,.tme-form .tvf-compact-foreign{font-size:11px;color:rgba(255,255,255,.55)}
.tme-form .tvf-tooltip-wrap{display:none}
.tme-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tme-save{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1e05;border:none;border-radius:8px;padding:8px 18px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.tme-cancel{background:none;border:none;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline}
.tme-err{font-size:11.5px;color:#ffb4a0}
.today-cols{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:15px}
@media(max-width:560px){.today-cols{grid-template-columns:1fr;gap:11px}}
.today-hours{margin-bottom:15px}
.th-label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:8px;font-weight:600}
.th-chips{display:flex;flex-wrap:wrap;gap:6px}
.th-chip{font-size:12px;background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.3);color:var(--gold-on-navy);border-radius:20px;padding:5px 11px;white-space:nowrap}
.th-chip i{font-style:normal;color:rgba(255,255,255,.6);font-size:11px}
.tdo-list{display:flex;flex-direction:column;gap:5px}
.tdo-list span{font-size:12.5px;color:rgba(255,255,255,.85);line-height:1.45}
.tdo-list span::before{content:"✓";color:#7fc79a;font-weight:700;margin-right:7px}
.tdo-list.no span::before{content:"✗";color:#e08b76}
.tdo-empty{font-size:12px;color:rgba(255,255,255,.45);font-style:italic}
/* Dải 7 ngày — nhìn 1 giây biết tuần tới hôm nào nên hẹn việc. Bấm vào một ô
   là xem vận ngày đó (vẫn miễn phí, vẫn deterministic). */
.today-week{margin-bottom:15px}
.tw-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.tw-cell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;padding:7px 2px 6px;text-align:center;cursor:pointer;font-family:inherit;color:inherit;transition:.13s}
.tw-cell:hover{background:rgba(255,255,255,.12)}
.tw-cell.on{border-color:var(--gold);background:rgba(201,168,76,.16)}
.tw-thu{font-size:10px;color:rgba(255,255,255,.5);font-weight:600}
.tw-d{font-size:14px;font-weight:600;color:#fff;margin:2px 0 4px;font-family:var(--serif)}
.tw-dot{width:100%;height:3px;border-radius:2px;background:#8A7A45}
.tw-cell.v-tot .tw-dot{background:#4c9a6a}
.tw-cell.v-xau .tw-dot{background:#c0563f}
.tw-x{font-size:9px;color:#e08b76;margin-top:3px;line-height:1}
.today-back{background:none;border:none;color:var(--gold-on-navy);font-size:12px;font-family:inherit;cursor:pointer;padding:0;margin-bottom:9px;display:none}
.today-back:hover{text-decoration:underline}
.today-cta{display:flex;gap:9px;flex-wrap:wrap}
.today-ask{flex:1;min-width:190px;background:var(--red);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:600;font-family:var(--serif);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.today-ask:hover{filter:brightness(1.08)}
.today-share{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 16px;font-size:13.5px;font-weight:600;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.today-share:hover{background:rgba(255,255,255,.14)}
/* ── NHIỆM VỤ MỞ KHOÁ LƯỢNG (M3) ───────────────────────────────────────────
   CỐ Ý để nền SÁNG, ngược hẳn thẻ Vận hôm nay (navy): hai khối nằm sát nhau,
   cùng tông là đọc thành một khối dài và mắt trượt qua. */
.task-card{background:#fff;border:1px solid var(--gold-soft);border-radius:14px;padding:16px 18px;margin-bottom:22px}
.tsk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.tsk-h{font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--heading)}
.tsk-count{font-size:11.5px;font-weight:700;color:var(--gold-soft);white-space:nowrap}
.tsk-sub{font-size:12.5px;color:var(--text-mid);line-height:1.5;margin-bottom:12px}
.tsk-sub b{color:var(--heading)}
.tsk-got{font-size:12.5px;font-weight:600;color:#2f7a4d;background:#e8f7ee;border:1px solid #a9dcbd;border-radius:8px;padding:8px 11px;margin-bottom:12px;line-height:1.45}
.tsk-list{display:flex;flex-direction:column;gap:9px}
.tsk-row{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border:1px solid var(--border-lt);border-radius:10px}
.tsk-row.done{border-color:#cfe8da;background:#f6fbf8}
.tsk-tick{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--border-lt);margin-top:1px}
.tsk-row.done .tsk-tick{border-color:#2f7a4d;background:#2f7a4d;position:relative}
.tsk-row.done .tsk-tick::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;line-height:1}
.tsk-body{flex:1;min-width:0}
.tsk-t{font-size:13.5px;font-weight:600;color:var(--heading);line-height:1.35}
.tsk-row.done .tsk-t{color:var(--text-mid)}
.tsk-d{font-size:12px;color:var(--text-mid);line-height:1.5;margin-top:3px}
.tsk-pay{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tsk-amt{font-size:11.5px;font-weight:700;color:var(--gold-soft);white-space:nowrap}
.tsk-row.done .tsk-amt{color:#2f7a4d}
.tsk-go{background:linear-gradient(135deg,var(--gold-soft),var(--gold));color:#2a1e05;border:none;border-radius:8px;padding:6px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.tsk-go:hover{filter:brightness(1.06)}
@media(max-width:520px){
  .tsk-row{flex-wrap:wrap}
  .tsk-pay{flex-direction:row;align-items:center;width:100%;justify-content:space-between;margin-left:30px}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Luận Đường</b><span>Chọn một công cụ mệnh lý để bắt đầu</span></div>
    </div>
    <div class="ws-body">
      <div class="home-body">
        <div class="today-card" id="todayCard" style="display:none">
          <div class="glow"></div>
          <div class="today-hanh" id="todayHanh"></div>
          <div class="today-eyebrow" id="todayEyebrow">Vận hôm nay</div>
          <button class="today-back" id="todayBack" type="button">← Về hôm nay</button>
          <div class="today-date" id="todayDate">—</div>
          <div class="today-sub" id="todaySub">Số liệu ngày do cổ pháp tính chính xác — hỏi thầy để luận vận riêng cho bạn.</div>
          <div class="today-meta" id="todayMeta"></div>
          <div id="todayWarn"></div>
          <div id="todayMe"></div>
          <div class="today-cols" id="todayCols" style="display:none">
            <div>
              <div class="th-label">Nên làm hôm nay</div>
              <div class="tdo-list" id="todayDo"></div>
            </div>
            <div>
              <div class="th-label">Nên kiêng</div>
              <div class="tdo-list no" id="todayDont"></div>
            </div>
          </div>
          <div class="today-hours">
            <div class="th-label">Giờ hoàng đạo — giờ tốt trong ngày</div>
            <div class="th-chips" id="todayHours"></div>
          </div>
          <div class="today-week" id="todayWeek" style="display:none">
            <div class="th-label">7 ngày tới — bấm để xem ngày đó</div>
            <div class="tw-row" id="todayWeekRow"></div>
          </div>
          <div class="today-cta">
            <button class="today-ask" id="todayAsk" type="button">✦ Hỏi thầy vận hôm nay</button>
            <button class="today-share" id="todayShare" type="button">⇪ Chia sẻ</button>
            <button class="today-share" id="todayPoster" type="button">⤓ Ảnh</button>
          </div>
        </div>
        <!-- M3 — nhiệm vụ onboarding. Dựng hoàn toàn bằng JS và CHỈ khi đã đăng
             nhập + còn việc chưa làm; khách vãng lai không bao giờ thấy khối
             này (họ chưa có ví để mà cộng vào). -->
        <div class="task-card" id="taskCard" style="display:none"></div>
        <div id="homeCards"></div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

  briefcase:'<rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M2.5 12.5h19"/>'
};
/* ── DANH MỤC CÔNG CỤ — dựng TỪ DỮ LIỆU, không còn mảng chép tay ──────────
   Trước đây chỗ này là mảng `GROUPS` 34 dòng xếp theo BỘ MÔN, trong khi
   `/cong-cu` xếp theo NHU CẦU với 58 công cụ — cùng một sản phẩm nói hai kiểu
   với cùng một người, và thêm công cụ mới là phải sửa tay cả hai.

   Nay: nhóm lấy từ bảng `tool_groups`, công cụ lấy từ `tool_pricing`, đường dẫn
   lấy từ cột `app_path`. Công cụ CHƯA có trang trong Luận Đường thì `app_path`
   NULL ⇒ không hiện ở đây (đúng thiết kế, không phải sót) nhưng vẫn hiện ở
   `/cong-cu` qua `page_path`.

   ⚠️ KHÔNG chép số giá vào đây. Chưa đọc được thì thẻ hiện "…" — xem
   public/tool-prices.js. */
function svg(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+(IC[n]||IC.grid)+'</svg>'; }
/* Dựng thẻ từ danh mục đã đọc. `d` = kết quả ToolPrices.load(), hoặc bản
   navFallback (danh mục đọc được lần gần nhất, KHÔNG kèm giá) khi mạng hỏng —
   dashboard trống thì người dùng mất đường vào mọi công cụ. */
function renderHomeCards(d){
  var host=document.getElementById('homeCards');
  if(!host) return;
  var groups=(d && d.groups)||[];
  var rows=(d && d.rows)||[];
  var prices=(d && d.tools)||null;
  /* Chỉ công cụ CÓ trang trong Luận Đường mới lên dashboard. */
  var inApp=rows.filter(function(r){ return r && r.app_path; });
  if(!groups.length || !inApp.length){
    host.innerHTML='<div class="grp-title">Đang tải danh mục…</div>';
    return;
  }
  var seen={}, html='';
  function block(title, items){
    if(!items.length) return '';
    var cards=items.map(function(it){
      var cost=(prices && prices[it.tool_id]!=null) ? prices[it.tool_id] : null;
      return '<a class="tcard" href="'+esc(it.app_path)+'">'+
        '<div class="ic">'+(window.iconHtml?window.iconHtml(it.icon):svg('grid'))+'</div>'+
        '<div class="tx"><b>'+esc(it.label)+'</b><span>'+esc(it.question||it.description||'')+'</span></div>'+
        (cost==null?'<span class="cost">…</span>'
          :cost>0?'<span class="cost">'+cost+' Lượng</span>'
          :'<span class="cost free">Miễn Phí</span>')+
        '</a>';
    }).join('');
    return '<div class="grp-title">'+esc(title)+'</div><div class="cards">'+cards+'</div>';
  }
  groups.forEach(function(g){
    var items=inApp.filter(function(r){
      return window.ToolPrices && ToolPrices.groupsOf(r, groups).indexOf(g.key)>=0;
    });
    items.forEach(function(r){ seen[r.tool_id]=1; });
    html+=block(g.title, items);
  });
  /* Công cụ không rơi vào nhóm nào vẫn phải NHÌN THẤY — tàng hình thì không ai
     phát hiện ra là đã gán sai nhóm. */
  html+=block('Khác', inApp.filter(function(r){ return !seen[r.tool_id]; }));
  host.innerHTML=html;
  if(window.mountIcons) window.mountIcons(host);
}
renderHomeCards(window.ToolPrices ? ToolPrices.navFallback() : null);
if(window.ToolPrices) ToolPrices.load().then(function(d){ if(d) renderHomeCards(d); });
</script>

<script>
/* ── VẬN HÔM NAY ─────────────────────────────────────────────────────────────
   Thẻ hero theo ngày. Số liệu lấy từ `/api/van-ngay` (nguồn: engine ngày-tốt
   đã có test) — deterministic, MIỄN PHÍ, KHÔNG một lượt LLM nào, không bịa số.

   🔑 Vì sao gọi API chứ không tính ở client như bản cũ: bản cũ dùng
   `HoangDaoTool` nên chỉ có can chi + giờ hoàng đạo, tức thẻ GIỐNG HỆT NHAU
   với mọi người — không ai quay lại mỗi ngày để đọc thứ tờ lịch bloc cũng có.
   Luật 12 trực / 28 tú / ngày kỵ / chấm điểm từng loại việc nằm trong
   `tuvi-engine` (664 dòng, có test); port sang trình duyệt là tạo bản thứ hai
   của cùng bộ luật rồi để hai bản trôi khỏi nhau.

   HoangDaoTool GIỮ LẠI làm đường lùi: API hỏng thì thẻ vẫn hiện như bản cũ,
   KHÔNG biến mất (nó là khối đầu trang chủ).

   Mồi rail: đã nhớ lá số → gắn birth (thầy luận vận riêng, tính Lượng như mọi
   lượt rail); chưa có → kịch bản hoang-dao. Gói/paywall GIỮ NGUYÊN. */
(function(){
  var WD=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  function vnToday(){
    try{ var s=new Date().toLocaleString('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'});
      var m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return {y:+m[1],mo:+m[2],d:+m[3]}; }catch(e){}
    var t=new Date(); return {y:t.getFullYear(),mo:t.getMonth()+1,d:t.getDate()};
  }
  function el(id){ return document.getElementById(id); }

  /* Địa chỉ mã QR in trong ảnh tải về — dùng CHUNG `Poster.qrLink` với mọi
     poster khác, nó tự đi qua Shell.viralUrl để mang mã giới thiệu. Chép tay
     riêng ở đây thì sớm muộn hai bên trôi khỏi nhau. */
  function qrLink(){ return Poster.qrLink('van-ngay','/app'); }

  var _birth=null, _hasBirth=false, _today=null, _week=null, _viewing=null;
  // Bản CHỮ THUẦN của khối "Vận riêng của bạn" — poster vẽ trên canvas nên
  // không dùng lại được chuỗi có thẻ <b>; dựng song song ngay lúc render để hai
  // bên không bao giờ nói khác nhau.
  var _meText='';
  // Can chi năm sinh của người xem, do ENGINE trả về (`caNhan.canChiNam`) chứ
  // không suy lại ở client — quy đổi năm → can chi là cổ pháp, có bản thứ hai ở
  // đây là có ngày hai bản trôi khỏi nhau. Nhiệm vụ "bật thông báo" cần nó để
  // lời mời nêu đúng tuổi.
  var _canChiNam='';

  function iso(t){ return t.y+'-'+('0'+t.mo).slice(-2)+'-'+('0'+t.d).slice(-2); }

  /* Xin dữ liệu MỘT ngày. `wantTuan` chỉ bật ở lượt đầu (neo dải ở hôm nay) —
     bấm sang ngày khác mà xin lại cả dải thì dải nhảy theo ngày đang xem, mất
     luôn ý nghĩa "7 ngày TỚI". */
  function fetchDay(t,wantTuan){
    var d=iso(t);
    return (_hasBirth
      ? fetch('/api/van-ngay',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({d:d,birth:_birth,tuan:!!wantTuan})})
      : fetch('/api/van-ngay?d='+d+(wantTuan?'':'&tuan=0'))
    ).then(function(r){ return r.ok?r.json():null; });
  }

  function run(){
  var card=el('todayCard'); if(!card) return;
  _today=vnToday();

  // Bậc cuối của phễu nhắc: có người BẬT rồi có người MỞ không. Đọc `from=push`
  // chứ không đọc `utm_source`: UTM chỉ ghi first-touch, nên người đã ghé site
  // từ trước — đúng nhóm duy nhất nhận được thông báo — sẽ không bao giờ hiện
  // ở bảng nguồn. Hai thứ khác nhau, cả hai đều nằm trong link.
  //
  // 🪤 PHẢI xếp hàng chờ: `shell.js` nạp `track.js` KHÔNG ĐỒNG BỘ, nên lúc hàm
  // này chạy thì `window.Track` chưa tồn tại. Bản đầu gọi thẳng → ReferenceError
  // rơi vào catch và event im lặng biến mất; test bắt được vì `push_optin_shown`
  // (bắn 6 giây sau) thì có mà `push_open` thì không.
  if(/[?&]from=push\b/.test(location.search)) emitWhenReady('push_open');
  function emitWhenReady(type){
    var n=0;
    (function tick(){
      try{
        if(window.Track&&window.Track.event){ window.Track.event(type,{tool_id:'van-ngay'}); return; }
      }catch(e){}
      if(++n<50) setTimeout(tick,100);
    })();
  }

  // birth nhớ trong localStorage theo shape của TuviForm (ngay/thang/nam); rail
  // VÀ api chỉ hiểu shape contract (day/month/year) → PHẢI đổi, đừng truyền thẳng.
  try{ _birth=(Shell.getRememberedBirth&&Shell.birthToApi)?Shell.birthToApi(Shell.getRememberedBirth()):null; }catch(e){}
  _hasBirth=!!(_birth&&_birth.day&&_birth.month&&_birth.year);

  fetchDay(_today,true)
    .then(function(v){ if(v&&v.ok){ if(v.tuan)_week=v.tuan; render(v,_today,_birth,_hasBirth); }
                       else fallback(_today,_birth,_hasBirth); })
    .catch(function(){ fallback(_today,_birth,_hasBirth); });

  el('todayBack').onclick=function(){ goDay(_today); };

  /* Nhiệm vụ (M3) — chạy SONG SONG với lượt lấy vận ngày, không nối đuôi: thẻ
     Vận hôm nay là nội dung chính của màn hình này và không được chờ một lượt
     mạng khác. Hoãn 1,2 giây để `Auth` kịp khôi phục phiên — hỏi token quá sớm
     thì người đã đăng nhập lại bị coi là khách. */
  setTimeout(syncTasks,1200);
  }

  /* Chuyển thẻ sang một ngày khác trong dải. Vẫn MIỄN PHÍ, vẫn deterministic —
     đây là chỗ người ta lướt thử "thứ Bảy này có được không". */
  function goDay(t){
    fetchDay(t,false).then(function(v){
      if(!v||!v.ok) return;
      render(v,t,_birth,_hasBirth);
      try{ window.Track&&Track.event('tool_open',{tool_id:'van-ngay',meta:{day:iso(t)}}); }catch(e){}
    }).catch(function(){});
  }

  function renderWeek(cur){
    var host=el('todayWeek'), row=el('todayWeekRow');
    if(!_week||!_week.length){ host.style.display='none'; return; }
    row.innerHTML=_week.map(function(x){
      var on=(x.d===cur.d&&x.m===cur.mo&&x.y===cur.y);
      return '<button type="button" class="tw-cell'+(x.tinhChat==='tốt'?' v-tot':x.tinhChat==='xấu'?' v-xau':'')
        +(on?' on':'')+'" data-iso="'+esc(x.iso)+'" title="'+esc(x.canChi+' · ngày '+x.tinhChat+(x.ngayKy?' · ngày kỵ':''))+'">'
        +'<div class="tw-thu">'+esc(x.thu)+'</div><div class="tw-d">'+x.d+'/'+x.m+'</div>'
        +'<div class="tw-dot"></div>'+(x.bixung?'<div class="tw-x">xung</div>':'')+'</button>';
    }).join('');
    host.style.display='';
    Array.prototype.forEach.call(row.querySelectorAll('.tw-cell'),function(b){
      b.onclick=function(){
        var p=(b.getAttribute('data-iso')||'').split('-');
        if(p.length===3) goDay({y:+p[0],mo:+p[1],d:+p[2]});
      };
    });
  }

  /* ── Vẽ thẻ đầy đủ ─────────────────────────────────────────────────────── */
  function render(v,td,birth,hasBirth){
    var card=el('todayCard');
    _viewing=v;
    var isToday=!_today||(td.d===_today.d&&td.mo===_today.mo&&td.y===_today.y);
    el('todayEyebrow').textContent=isToday?'Vận hôm nay':'Vận ngày '+td.d+'/'+td.mo;
    // 🐞 PHẢI đặt 'block', không phải '': luật CSS của .today-back là
    // `display:none`, nên gán '' chỉ xoá inline style rồi rơi về đúng luật đó —
    // nút không bao giờ hiện. (Các khối khác trong thẻ ẩn bằng inline
    // style="display:none" nên gán '' ở đó lại đúng — khác nhau ở chỗ này.)
    el('todayBack').style.display=isToday?'none':'block';
    el('todayDate').innerHTML=esc(v.ngay.thu)+' · '+td.d+'/'+td.mo+' — Ngày <span class="cc">'+esc(v.ngay.canChi)+'</span>';

    // Nhãn tốt/xấu thay chỗ nhãn "Hành Kim" cũ: hành ngày là thông tin tra cứu,
    // còn "hôm nay có nên khởi sự không" mới là thứ người ta mở thẻ để biết.
    var badge=el('todayHanh');
    badge.textContent=v.danhGia.tinhChat==='tốt'?'Ngày tốt':v.danhGia.tinhChat==='xấu'?'Ngày xấu':'Ngày bình';
    badge.className='today-hanh'+(v.danhGia.tinhChat==='tốt'?' v-tot':v.danhGia.tinhChat==='xấu'?' v-xau':'');

    el('todaySub').textContent=v.danhGia.nhan;

    var meta=[
      ['', v.ngay.am],
      ['Hành ', v.ngay.canHanh],
      ['Trực ', v.truc.ten],
      ['Sao ', v.saoNgay.ten],
      ['Tú ', v.tu.ten]
    ].map(function(p){ return '<span class="tm-item">'+esc(p[0])+'<b>'+esc(p[1])+'</b></span>'; });
    if(v.mau&&v.mau.list&&v.mau.list.length) meta.push('<span class="tm-item">Màu hợp <b>'+esc(v.mau.list.slice(0,2).join(', '))+'</b></span>');
    if(v.huong) meta.push('<span class="tm-item">Tài thần <b>'+esc(v.huong.taiThan)+'</b></span>');
    el('todayMeta').innerHTML=meta.join('');

    // Xung tuổi + ngày kỵ — mục ai cũng đọc vì nó gọi tên trực tiếp một nhóm người.
    var warns=[];
    if(v.xung&&v.xung.chi){
      var yrs=(v.xung.namSinh||[]).slice(-4).join(', ');
      warns.push('Ngày này <b>xung tuổi '+esc(v.xung.chi)+'</b>'+(yrs?' (sinh '+esc(yrs)+')':'')+' — người tuổi này nên lùi việc lớn sang ngày khác.');
    }
    if(v.ngayKy&&v.ngayKy.length) warns.push('Trùng <b>'+esc(v.ngayKy.join(' + '))+'</b> — cổ pháp kiêng khởi sự.');
    el('todayWarn').innerHTML=warns.length
      ? '<div class="today-warn"><span>⚠</span><span>'+warns.join('<br>')+'</span></div>' : '';

    // Khối CÁ NHÂN — vế duy nhất khiến thẻ là "của bạn". Không có lá số thì để
    // trống có chủ đích: chỗ trống đó chính là CTA lập lá số, đừng lấp bằng
    // câu chung chung.
    var me=el('todayMe');
    _meText='';
    if(v.caNhan){
      var c=v.caNhan, bits=[], plain=[];
      var head='Ngày hôm nay rơi vào cung '+c.cungNhatHan+(c.diaChiNhatHan?' ('+c.diaChiNhatHan+')':'')
        +(c.chinhTinh&&c.chinhTinh.length?' — chính tinh '+c.chinhTinh.join(', '):' — vô chính diệu');
      bits.push('Ngày hôm nay rơi vào <b>cung '+esc(c.cungNhatHan)+'</b>'+(c.diaChiNhatHan?' ('+esc(c.diaChiNhatHan)+')':'')
        +(c.chinhTinh&&c.chinhTinh.length?' — chính tinh <b>'+esc(c.chinhTinh.join(', '))+'</b>':' — vô chính diệu'));
      plain.push(head);
      if(c.bixung){ bits.push('⚠ Ngày <b>xung chính tuổi bạn</b> — nên giữ nhịp, tránh quyết định lớn.'); plain.push('Ngày xung chính tuổi bạn — nên giữ nhịp, tránh quyết định lớn.'); }
      var QH={'duoc-sinh':'hành ngày <b>sinh cho bản mệnh</b> — thuận, dễ được giúp',
              'hoa':'hành ngày <b>cùng hành bản mệnh</b> — hòa, tự chủ được',
              'sinh':'bản mệnh <b>sinh cho hành ngày</b> — hao lực, nên giữ sức',
              'bi-khac':'hành ngày <b>khắc bản mệnh</b> — dễ vướng, làm chậm lại',
              'khac':'bản mệnh <b>khắc hành ngày</b> — chủ động được, hơi tốn công'};
      if(c.quanHeHanh&&QH[c.quanHeHanh]){ bits.push(QH[c.quanHeHanh]+'.'); plain.push(QH[c.quanHeHanh].replace(/<\/?b>/g,'')+'.'); }
      if(c.mauCaNhan&&c.mauCaNhan.length){ bits.push('Màu hợp bản mệnh bạn: <b>'+esc(c.mauCaNhan.slice(0,3).join(', '))+'</b>.'); plain.push('Màu hợp bản mệnh: '+c.mauCaNhan.slice(0,3).join(', ')+'.'); }
      _meText=plain.join(' ');
      // Nói RÕ thẻ đang dựa trên lá số nào + cho đường sửa. Trước đây khối này
      // luận vận riêng mà không hé lộ nguồn, nên lá số sai (hoặc của người khác
      // dùng nhờ máy) thì người xem không hiểu vì sao và không sửa được.
      var srcLine='';
      try{ srcLine=(Shell.birthSummary&&birth)?Shell.birthSummary(birth):''; }catch(e){}
      me.innerHTML='<div class="today-me"><div class="tme-h">Vận riêng của bạn</div><div class="tme-b">'+bits.join(' ')+'</div>'
        +'<div class="tme-src"><span>Theo lá số: <b>'+esc(srcLine||'đã lưu trên máy này')+'</b></span>'
        +'<button class="tme-edit" id="tmeEdit" type="button">Đổi lá số</button></div>'
        +'<div id="tmeFormHost"></div></div>';
    } else {
      me.innerHTML='<div class="today-me"><div class="tme-h">Vận riêng của bạn</div><div class="tme-b">'
        +'Trên đây là vận CHUNG của ngày — giống nhau với mọi người. Nhập ngày sinh một lần để thấy hôm nay rơi vào cung nào của riêng bạn.</div>'
        +'<button class="tme-cta" id="tmeEdit" type="button">✦ Nhập lá số của bạn</button>'
        +'<div id="tmeFormHost"></div></div>';
    }
    wireBirthForm(td);

    // Nên / Kiêng — lấy thẳng điểm từng loại việc của engine, không tự xếp hạng.
    var doEl=el('todayDo'), dontEl=el('todayDont');
    doEl.innerHTML=(v.nen&&v.nen.length)
      ? v.nen.map(function(x){ return '<span>'+esc(x.ten)+'</span>'; }).join('')
      : '<div class="tdo-empty">Không có việc trọng đại nào được điểm cao hôm nay.</div>';
    dontEl.innerHTML=(v.kieng&&v.kieng.length)
      ? v.kieng.map(function(x){ return '<span>'+esc(x.ten)+'</span>'; }).join('')
      : '<div class="tdo-empty">Không việc nào bị kiêng nặng.</div>';
    el('todayCols').style.display='';

    // Giờ tốt KÈM việc nên làm — giờ tốt mà không nói để làm gì thì không dùng được.
    var hours=(v.gioTot||[]).slice(0,4);
    el('todayHours').innerHTML=hours.map(function(h){
      return '<span class="th-chip">'+esc(h.chi)+' · '+esc(h.range)+(h.viec?' <i>'+esc(h.viec)+'</i>':'')+'</span>';
    }).join('');

    renderWeek(td);
    card.style.display='';
    wire(v,td,birth,hasBirth,hours);
    try{ _canChiNam=(v&&v.caNhan&&v.caNhan.canChiNam)||_canChiNam; }catch(e){}
    maybeAskPush(v,isToday,birth);
  }

  /* ── Mời bật nhắc hằng ngày ─────────────────────────────────────────────
     Hỏi SAU khi thẻ đã dựng xong, KHÔNG phải lúc vào trang. Xin quyền trước
     khi người ta thấy mình được gì là cách chắc nhất bị bấm "Chặn" — mà
     "Chặn" trên trình duyệt là VĨNH VIỄN, không có đường hỏi lại.

     Ba điều kiện, mỗi cái bịt một kiểu hỏi sai chỗ:
       • `isToday` — đang xem ngày khác thì lời mời "mỗi sáng" lệch ngữ cảnh.
       • có `caNhan` — người đã lưu lá số. Chỉ họ mới nhận được phần đáng giá
         nhất của tin nhắc (ngày nào xung chính tuổi mình); mời người chưa có
         lá số là hứa một thứ nhạt hơn hẳn.
       • trễ 6 giây — đủ để đọc xong thẻ. Bật lên ngay khi thẻ vừa hiện thì
         hộp thoại che đúng thứ vừa thuyết phục họ.

     Nạp `pwa-push.js` ĐÚNG LÚC CẦN (không nhét vào <head>): trang này là màn
     hình đầu của /app, mỗi file thêm vào đường tải là một nhịp chậm cho mọi
     người, kể cả người sẽ không bao giờ thấy lời mời. */
  var _pushAsked=false;
  function maybeAskPush(v,isToday,birth){
    if(_pushAsked||!isToday||!v||!v.caNhan) return;
    _pushAsked=true;
    var nam=(birth&&+birth.year)||0;
    setTimeout(function(){
      function go(){
        if(!window.askPushPermission) return;
        try{ window.askPushPermission(nam, (v.caNhan&&v.caNhan.canChiNam)||''); }catch(e){}
      }
      if(window.askPushPermission) return go();
      var s=document.createElement('script');
      s.src='/pwa-push.js?v=2'; s.onload=go; s.onerror=function(){};
      document.head.appendChild(s);
    },6000);
  }

  /* ── Nhập / đổi lá số NGAY TRONG THẺ ────────────────────────────────────
     Trước đây khối "Vận riêng của bạn" khi trống chỉ là một câu chữ chết: nó
     BẢO người ta lập lá số mà không có chỗ nào bấm. Còn khi có lá số thì lại
     không nói đang dùng lá số nào — sai một trường là hỏng cả khối mà không có
     đường sửa.

     Lá số nhớ trong localStorage (`app_birth`, do Shell.rememberBirth ghi khi
     người dùng chạy bất kỳ tool nào có form ngày sinh) → THEO MÁY, không theo
     tài khoản: đổi máy hay mở ẩn danh là khối này trống lại. Đó là lý do phải
     có đường nhập ngay tại đây. */
  function wireBirthForm(td){
    var btn=el('tmeEdit'), host=el('tmeFormHost');
    if(!btn||!host) return;
    btn.onclick=function(){
      if(!window.TuviForm){ try{ location.href='/app/la-so'; }catch(e){} return; }
      btn.style.display='none';
      host.innerHTML='<div class="tme-form"><div id="tmeFields"></div>'
        +'<div class="tme-actions"><button class="tme-save" id="tmeSave" type="button">Xem vận riêng của tôi →</button>'
        +'<button class="tme-cancel" id="tmeCancel" type="button">Hủy</button>'
        +'<span class="tme-err" id="tmeErr"></span></div></div>';
      var prev=null;
      try{ prev=Shell.getRememberedBirth&&Shell.getRememberedBirth(); }catch(e){}
      // Bỏ ô Họ và tên: đây là chỗ đổi lấy MỘT thông tin (ngày sinh) để mở khóa
      // khối cá nhân — thêm trường là thêm cớ để bỏ ngang.
      TuviForm.render('tmeFields',{mode:'compact',showName:false,gioitinh:(prev&&prev.gioitinh)||'nam'});
      if(prev) try{ TuviForm.setData(prev); TuviForm._update(''); }catch(e){}
      el('tmeCancel').onclick=function(){ host.innerHTML=''; btn.style.display=''; };
      el('tmeSave').onclick=function(){
        var fd=null; try{ fd=TuviForm.getData(); }catch(e){}
        if(!fd||!fd.ngay||!fd.thang||!fd.nam){ el('tmeErr').textContent='Thiếu ngày/tháng/năm sinh.'; return; }
        // Giữ lại họ tên đã lưu từ tool khác — form này không hỏi tên, ghi đè
        // trắng thì rail mất cách xưng hô đúng tên.
        if(prev&&prev.hoten&&!fd.hoten) fd.hoten=prev.hoten;
        try{ Shell.rememberBirth(fd); }catch(e){}
        try{ _birth=Shell.birthToApi(fd); }catch(e){ _birth=null; }
        _hasBirth=!!(_birth&&_birth.day&&_birth.month&&_birth.year);
        if(!_hasBirth){ el('tmeErr').textContent='Ngày sinh chưa hợp lệ.'; return; }
        el('tmeSave').disabled=true; el('tmeSave').textContent='Đang lập…';
        // Xin lại CẢ dải 7 ngày: `bixung` của từng ô phụ thuộc tuổi người xem,
        // giữ dải cũ là để lại 7 ô tính cho "người chưa có lá số".
        fetchDay(_today,true).then(function(v){
          if(v&&v.ok){ if(v.tuan)_week=v.tuan; render(v,_today,_birth,_hasBirth); }
          else { host.innerHTML=''; btn.style.display=''; }
          try{ window.Track&&Track.event('tool_run',{tool_id:'van-ngay',meta:{from:'today_card_birth'}}); }catch(e){}
          // Vừa lưu lá số → nhiệm vụ `luu_la_so` xong. `Shell.rememberBirth`
          // ghi lên sổ tài khoản theo lối BẮN-VÀ-QUÊN nên phải chờ một nhịp,
          // không thì server hỏi `user_charts` trước khi dòng kịp vào.
          setTimeout(function(){ _tskLast=0; syncTasks(); },1800);
        }).catch(function(){
          el('tmeSave').disabled=false; el('tmeSave').textContent='Xem vận riêng của tôi →';
          el('tmeErr').textContent='Không lập được, thử lại sau.';
        });
      };
    };
  }

  /* ── Đường lùi: API hỏng → thẻ tối giản như bản cũ ─────────────────────── */
  function fallback(td,birth,hasBirth){
    if(!window.HoangDaoTool) return;
    var r=HoangDaoTool.compute(td.d,td.mo,td.y); if(!r||!r.ok) return;
    var wd=WD[new Date(td.y,td.mo-1,td.d).getDay()];
    var hours=(r.data.gioHoangDao||'').split(' · ').slice(0,4).map(function(h){
      var m=h.match(/^(\S+)\s*\(([^)]+)\)/); return m?{chi:m[1],range:m[2]}:{chi:h,range:''};
    });
    el('todayDate').innerHTML=esc(wd)+' · '+td.d+'/'+td.mo+' — Ngày <span class="cc">'+esc(r.data.canChiNgay)+'</span>';
    el('todayHanh').textContent='Hành '+r.data.canHanh;
    el('todayHours').innerHTML=hours.map(function(h){
      return '<span class="th-chip">'+esc(h.chi)+(h.range?' · '+esc(h.range):'')+'</span>'; }).join('');
    el('todayCard').style.display='';
    wire({ngay:{canChi:r.data.canChiNgay,canHanh:r.data.canHanh},_flat:r.data},td,birth,hasBirth,hours);
  }

  /* ── Mồi rail + nút ────────────────────────────────────────────────────── */
  function wire(v,td,birth,hasBirth,hours){
    var cc=v.ngay.canChi;
    try{
      if(hasBirth){
        var nm=(birth.name||'').trim();
        Shell.setContext({
          birth:birth,
          label:'Vận hôm nay'+(nm?' · '+nm:''),
          greeting:'Hôm nay là ngày **'+cc+'**'+(nm?', '+nm:'')+'. Con muốn thầy soi vận hôm nay — công việc, tài lộc hay tình duyên?',
          chips:['Hôm nay vận tôi thế nào?','Việc nên làm hôm nay?','Giờ nào tốt cho tôi hôm nay?','Tháng này của tôi ra sao?']
        });
      } else {
        // ⚠️ `extractGenericContext` BỎ QUA mọi giá trị là object → payload phải
        // PHẲNG, nếu không rail nhận được đúng mấy dòng rồi luận chay.
        var flat=v._flat||{
          ngayDL:td.d+'/'+td.mo+'/'+td.y, amLich:v.ngay.am, thuTrongTuan:v.ngay.thu,
          canChiNgay:cc, canHanh:v.ngay.canHanh,
          truc:v.truc.ten+' ('+v.truc.tinhChat+')', tu:v.tu.ten+' ('+v.tu.tinhChat+')',
          saoNgay:v.saoNgay.ten+' — '+v.saoNgay.yNghia+(v.saoNgay.hoangDao?' [hoàng đạo]':' [hắc đạo]'),
          tinhChatNgay:v.danhGia.tinhChat, ngayKy:(v.ngayKy||[]).join(', '),
          xungTuoi:v.xung?v.xung.chi:'',
          vietNen:(v.nen||[]).map(function(x){return x.ten;}).join(', '),
          vietKieng:(v.kieng||[]).map(function(x){return x.ten;}).join(', '),
          gioHoangDao:(v.gioTot||[]).map(function(h){return h.chi+' ('+h.range+')';}).join(' · '),
          mauHop:(v.mau&&v.mau.list||[]).join(', '),
          huongHyThan:v.huong?v.huong.hyThan:'', huongTaiThan:v.huong?v.huong.taiThan:''
        };
        Shell.setContext({
          scenario:{type:'hoang-dao',data:flat},
          label:'Vận ngày '+td.d+'/'+td.mo,
          greeting:'Hôm nay là ngày **'+cc+'** (hành '+v.ngay.canHanh+'). Bạn định làm việc gì để tôi chọn giờ đẹp? Lập lá số để tôi luận vận riêng cho bạn.',
          chips:['Hôm nay nên làm gì, tránh gì?','Giờ nào đẹp để xuất hành?','Lập lá số xem vận của tôi','Ngày mai có tốt không?']
        });
      }
    }catch(e){ if(window.console)console.error('[today]',e); }

    var ask=el('todayAsk');
    ask.onclick=function(){
      try{ Shell.ask(hasBirth?'Hôm nay vận của tôi thế nào? Nên làm gì, kiêng gì?':'Hôm nay là ngày gì, tôi nên làm gì và tránh gì?'); }catch(e){}
    };

    // Chia sẻ vận (vòng khám phá): điện thoại mở share sheet native; desktop chép link.
    var shareBtn=el('todayShare');
    shareBtn.onclick=function(){
      var url='https://tuviminhbao.com/app';
      var hlist=hours.map(function(h){return h.chi+(h.range?' ('+h.range+')':'');}).join(', ');
      var txt='Vận ngày '+td.d+'/'+td.mo+' — Ngày '+cc+' (hành '+v.ngay.canHanh+')'
        +(v.danhGia?', '+v.danhGia.tinhChat:'')+'. Giờ hoàng đạo: '+hlist+'. Xem vận của bạn tại Luận Đường:';
      if(navigator.share){ navigator.share({title:'Vận hôm nay — Tử Vi Minh Bảo',text:txt,url:url}).catch(function(){}); return; }
      var full=txt+' '+url, done=function(){ var o=shareBtn.textContent; shareBtn.textContent='✓ Đã chép link'; setTimeout(function(){shareBtn.textContent=o;},1800); };
      if(navigator.clipboard){ navigator.clipboard.writeText(full).then(done,function(){}); }
      else { try{ var ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done(); }catch(e){} }
    };

    /* Ảnh 9:16 để đăng Story/TikTok. Người Việt chia sẻ ẢNH nhiều hơn chia sẻ
       LINK, mà ảnh không mang thương hiệu thì lan đi rồi không về.
       CỐ Ý là nút RIÊNG, không gộp vào "Chia sẻ": ảnh tải về không có link bấm
       được nên không bao giờ sinh ra share_view/cta_click — gộp chung là kéo
       K-factor tụt giả (đúng lý do `poster_download` là loại event riêng). */
    var posterBtn=el('todayPoster');
    // Đường lùi (API chết) không có đủ dữ kiện để dựng poster → ẩn nút hẳn thay
    // vì để nó đó rồi bấm không ra gì.
    posterBtn.style.display=(v.danhGia&&window.Poster&&Poster.downloadDay)?'':'none';
    posterBtn.onclick=function(){
      if(!window.Poster||!Poster.downloadDay||!v.danhGia) return;
      var o=posterBtn.textContent; posterBtn.disabled=true; posterBtn.textContent='Đang dựng…';
      var rows=[];
      if(v.nen&&v.nen.length) rows.push(['Nên hôm nay', v.nen.map(function(x){return x.ten;}).join(' · ')]);
      if(v.kieng&&v.kieng.length) rows.push(['Nên kiêng', v.kieng.map(function(x){return x.ten;}).join(' · ')]);
      // Giờ tốt KÈM việc nên làm — trên web đã kèm, poster mà cắt đi thì người
      // đọc ảnh có giờ đẹp mà không biết để làm gì.
      if(hours&&hours.length) rows.push(['Giờ tốt', hours.map(function(h){return h.chi+' '+h.range+(h.viec?' ('+h.viec+')':'');}).join(' · ')]);
      // Cảnh báo: đúng hai dòng web đang hiện trong khung đỏ.
      var warn=[];
      if(v.xung&&v.xung.chi){
        var yrs=(v.xung.namSinh||[]).slice(-4).join(', ');
        warn.push('Xung tuổi '+v.xung.chi+(yrs?' (sinh '+yrs+')':''));
      }
      if(v.ngayKy&&v.ngayKy.length) warn.push('Trùng '+v.ngayKy.join(' + ')+' — cổ pháp kiêng khởi sự');
      // Dòng tra cứu ĐỦ như thẻ: thêm tú, màu hợp, tài thần (bản cũ bỏ cả ba).
      var sub=[v.ngay.am,'hành '+v.ngay.canHanh,'trực '+v.truc.ten,'sao '+v.saoNgay.ten,'tú '+v.tu.ten];
      if(v.mau&&v.mau.list&&v.mau.list.length) sub.push('màu hợp '+v.mau.list.slice(0,2).join(', '));
      if(v.huong&&v.huong.taiThan) sub.push('tài thần '+v.huong.taiThan);
      Poster.downloadDay({
        verdict:v.danhGia.tinhChat,
        verdictLabel:(v.danhGia.tinhChat==='tốt'?'Ngày tốt':v.danhGia.tinhChat==='xấu'?'Ngày xấu':'Ngày bình'),
        title:v.ngay.thu+' · '+td.d+'/'+td.mo+' — Ngày '+v.ngay.canChi,
        subtitle:sub.join(' · '),
        quote:v.danhGia.nhan,
        warn:warn,
        me:_meText,
        rows:rows,
        // Mã QR mang utm RIÊNG (poster/image) + mã giới thiệu của chính người
        // tải ảnh → ai quét mã mà đăng ký thì người chia sẻ được thưởng, và
        // panel Vòng Lặp Viral tách được đường ẢNH khỏi đường LINK.
        qrUrl:qrLink(),
        qrCaption:'Quét mã — xem vận ngày của riêng bạn'
      },'van-ngay-'+td.y+'-'+td.mo+'-'+td.d+'.png').then(function(){
        try{ window.Track&&Track.event('poster_download',{tool_id:'van-ngay'}); }catch(e){}
      }).catch(function(){
        // Dựng hỏng thì phải NÓI, đừng im lặng — người ta bấm mà không thấy gì
        // là tưởng máy đứng.
        posterBtn.textContent='✕ Không dựng được'; setTimeout(function(){posterBtn.textContent=o;},2200);
      }).then(function(){
        posterBtn.disabled=false;
        if(posterBtn.textContent==='Đang dựng…') posterBtn.textContent=o;
      });
    };
  }
  /* ══ M3 — NHIỆM VỤ MỞ KHOÁ LƯỢNG ═══════════════════════════════════════════
     Đo prod 07/08: 48 người đã nhận 25 Lượng quà đăng ký, đổi lại có 3 liên kết
     kênh chat · 2 lượt bật thông báo · 2 dòng sổ lá số của ĐÚNG một người · 0
     lượt mời bạn. Phát tiền mà không hỏi lại gì thì không nhận lại gì.

     🔑 Quà đăng ký 25 Lượng GIỮ NGUYÊN, nhiệm vụ là phần CỘNG THÊM. Cắt 25 ra
     chia nhỏ thì người mới cầm 5 Lượng và không chạy nổi tool nào (rẻ nhất 5,
     phần lớn 15–30) — đó là siết đúng đầu phễu vốn đã hỏng.

     Server tự kiểm và tự cộng (lib/onboarding/tasks.ts). Trang này chỉ VẼ và
     dẫn người ta tới đúng chỗ làm — không tự quyết ai xong việc gì. */
  var _tskBusy=false, _tskLast=0, _tskGot=0, _tskDefs=[];

  function tskToken(){
    try{ var s=window.Auth&&Auth.getSession&&Auth.getSession(); return s?s.access_token:''; }catch(e){ return ''; }
  }

  function syncTasks(){
    var tk=tskToken();
    // Chưa đăng nhập → im lặng tuyệt đối. Họ chưa có ví để mà cộng vào, và mời
    // làm nhiệm vụ trước khi có tài khoản là dựng thêm một bức tường.
    if(!tk||_tskBusy) return;
    _tskBusy=true; _tskLast=Date.now();
    fetch('/api/payment?action=onboarding-sync',{method:'POST',headers:{Authorization:'Bearer '+tk}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ if(d&&d.tasks) renderTasks(d); })
      .catch(function(){ /* hỏng thì thẻ không hiện — không chặn gì của trang */ })
      .then(function(){ _tskBusy=false; });
  }

  function renderTasks(d){
    var host=el('taskCard'); if(!host) return;
    // Xong cả ba → biến mất hẳn. Giữ lại một thẻ toàn dấu tích là chiếm chỗ
    // vĩnh viễn trên màn hình đầu để khoe một việc đã cũ.
    if(d.allDone){ host.style.display='none'; return; }

    var done=0; for(var i=0;i<d.tasks.length;i++) if(d.tasks[i].done) done++;
    _tskGot+=(+d.granted||0);

    var h='<div class="tsk-top"><div class="tsk-h">Mở khoá thêm Lượng</div>'
      + '<div class="tsk-count">'+done+'/'+d.tasks.length+' · còn +'+(+d.pending||0)+' Lượng</div></div>'
      // Nói THẲNG con số và quy ra thứ mua được. Hứa lửng lơ kiểu "làm nhiệm vụ
      // để nhận thưởng" là mất niềm tin ngay lần đầu.
      + '<div class="tsk-sub">Làm nốt là được cộng thẳng vào ví — <b>+'+(+d.pending||0)
      + ' Lượng</b>, đủ thêm một lượt luận.</div>';

    if(_tskGot>0) h+='<div class="tsk-got">✓ Vừa cộng <b>+'+_tskGot+' Lượng</b> vào ví bạn.</div>';

    // 🪤 `esc()` của trang chỉ thoát `& < >`, KHÔNG thoát dấu nháy — nên tuyệt
    // đối không nhét chuỗi từ server vào GIÁ TRỊ THUỘC TÍNH ở đây. Gắn nút theo
    // CHỈ SỐ (số do chính mình sinh ra, không cần thoát gì) rồi tra ngược trong
    // `_tskDefs`. An toàn kể cả khi sau này nhãn nhiệm vụ sửa được từ Admin.
    _tskDefs=d.tasks;
    h+='<div class="tsk-list">';
    for(var j=0;j<d.tasks.length;j++){
      var t=d.tasks[j];
      h+='<div class="tsk-row'+(t.done?' done':'')+'"><div class="tsk-tick"></div>'
       + '<div class="tsk-body"><div class="tsk-t">'+esc(t.title)+'</div>'
       + (t.done?'':'<div class="tsk-d">'+esc(t.desc)+'</div>')+'</div>'
       + '<div class="tsk-pay"><div class="tsk-amt">'+(t.done?'+':'')+(+t.credits||0)+' Lượng</div>'
       + (t.done?'':'<button class="tsk-go" type="button" data-i="'+j+'">'+esc(t.cta)+'</button>')
       + '</div></div>';
    }
    h+='</div>';
    host.innerHTML=h;
    host.style.display='';

    var btns=host.querySelectorAll('.tsk-go');
    for(var k=0;k<btns.length;k++) btns[k].onclick=tskGo;
  }

  function tskGo(){
    var t=_tskDefs[+this.getAttribute('data-i')]; if(!t) return;
    var key=t.key, href=t.href||'';
    // `href` rỗng = việc làm được NGAY TẠI TRANG NÀY. Đá người ta sang trang
    // khác để làm đúng việc đang có sẵn ở đây là tự thêm một chỗ rơi.
    if(href){ try{ location.href=href; }catch(e){} return; }
    if(key==='luu_la_so'){
      var b=el('tmeEdit');
      if(b){ try{ b.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} b.click(); }
      return;
    }
    if(key==='bat_thong_bao'){
      var nam=(_birth&&+_birth.year)||0, cc=_canChiNam;
      // `askPushPermission` tự bỏ qua khi vừa hỏi 3 ngày trước / đã bị chặn vĩnh
      // viễn / iOS tab thường. Ở đây là NGƯỜI DÙNG CHỦ ĐỘNG bấm, nên báo lại một
      // câu khi nó im — im lặng sau một cú bấm đọc thành nút hỏng.
      function ask(){
        try{ window.askPushPermission(nam,cc); }catch(e){}
        setTimeout(function(){ syncTasks(); },2500);
      }
      if(window.askPushPermission) return ask();
      var s=document.createElement('script');
      s.src='/pwa-push.js?v=2'; s.onload=ask; s.onerror=function(){};
      document.head.appendChild(s);
    }
  }

  /* Quay lại tab thì đồng bộ lại — đây mới là ca thường gặp nhất: bấm "Liên
     kết" → sang profile → nối Telegram → quay về. Không có bước này thì nhiệm
     vụ vẫn hiện là chưa làm cho tới lần tải trang sau. Chặn 20 giây để đổi tab
     qua lại không thành một tràng gọi API. */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&Date.now()-_tskLast>20000) syncTasks();
  });

  // Chạy SAU khi shell.boot() render rail (boot hoãn tới DOMContentLoaded).
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
</script>

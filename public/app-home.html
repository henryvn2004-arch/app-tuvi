<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luận Đường — Tử Vi Minh Bảo</title>
<meta name="description" content="Luận Đường — không gian mệnh lý AI: lá số Tử Vi, Bát Tự, xem tuổi, đặt tên, chọn ngày — chọn một công cụ để bắt đầu và hỏi trợ lý theo ngữ cảnh.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shell.css?v=6">
<style>
.home-body{max-width:920px}
.hero{background:linear-gradient(135deg,var(--navy),#0d2a49);border-radius:16px;padding:26px 28px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden}
.hero .seal{position:absolute;right:-10px;top:-14px;font-size:150px;line-height:1;color:rgba(212,175,55,.13);font-family:var(--serif);pointer-events:none}
.hero h1{font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:7px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.6;max-width:560px}
.grp-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--text-mid);margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tcard{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow);text-decoration:none;transition:.15s;position:relative}
.tcard:hover{border-color:var(--gold-soft);transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,26,46,.09)}
.tcard .ic{width:38px;height:38px;flex:0 0 auto;border-radius:10px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center}
.tcard .ic svg{width:20px;height:20px}
.tcard .tx b{display:block;font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--text);margin-bottom:3px}
.tcard .tx span{font-size:12px;color:var(--text-lt);line-height:1.5}
.tcard .cost{position:absolute;top:11px;right:12px;font-size:10.5px;font-weight:600;color:var(--gold-soft);background:var(--gold-lt);border:1px solid var(--gold-soft);border-radius:20px;padding:1px 8px}
.tcard.ext .tx b::after{content:"↗";font-size:11px;color:var(--text-lt);margin-left:5px;font-family:var(--sans)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Luận Đường</b><span>Chọn một công cụ mệnh lý để bắt đầu</span></div>
    </div>
    <div class="ws-body">
      <div class="home-body">
        <div class="hero">
          <div class="seal">寶</div>
          <h1>Chào mừng đến Luận Đường</h1>
          <p>Một không gian, mọi nghiệp vụ mệnh lý — lá số Tử Vi, Bát Tự, xem tuổi, đặt tên, chọn ngày. Số liệu do engine cổ pháp tính chính xác; trợ lý AI luận giải theo ngữ cảnh, không bịa số.</p>
        </div>
        <div id="homeCards"></div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='home';</script>
<script src="/auth.js"></script>
<script src="/shell.js?v=22"></script>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
var IC={
  grid:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>',
  rows:'<path d="M4 5h16M4 12h16M4 19h16"/>',
  doc:'<path d="M4 19V5a2 2 0 0 1 2-2h9l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8 12h8"/>',
  heart:'<path d="M12 21s-7-4.6-9.5-9A5.2 5.2 0 0 1 12 6a5.2 5.2 0 0 1 9.5 6c-2.5 4.4-9.5 9-9.5 9z"/>',
  handshake:'<path d="M8 12l3 3 4-4 3 3"/><path d="M2 10l4-4 5 5"/><path d="M22 10l-4-4-3 3"/>',
  tag:'<path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-4 1 2-5z"/>',
  face:'<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01M9 15c1 1 5 1 6 0"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17.5" cy="9" r="2.2"/><path d="M16 20a5 5 0 0 1 5-4.6"/>',
  baby:'<circle cx="12" cy="9" r="4"/><path d="M8.5 20c0-2.6 7-2.6 7 0"/><path d="M10 8h.01M14 8h.01"/>',
  yinyang:'<circle cx="12" cy="12" r="9"/><path d="M12 3a4.5 4.5 0 0 0 0 9 4.5 4.5 0 0 1 0 9"/><circle cx="12" cy="7.5" r=".7"/><circle cx="12" cy="16.5" r=".7"/>',
  hash:'<path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/>',
  leaf:'<path d="M11 20A7 7 0 0 1 4 13C4 7 10 4 20 4c0 8-4 12-9 12z"/><path d="M11 20c0-5 2-8 6-10"/>'
};
var GROUPS=[
  { g:'Tử Vi', items:[
    { i:'grid', t:'Lá số Tử Vi', d:'Lập lá số 12 cung, chính tinh, cách cục, đại vận', h:'/app/la-so' },
    { i:'doc', t:'Luận giải chuyên sâu', d:'Chấm điểm 12 cung, đại vận, tứ hóa theo cổ pháp', h:'/app/luan-giai', c:5 },
    { i:'heart', t:'Xem tuổi vợ chồng', d:'So hòa hợp hai lá số theo 8 chiều', h:'/app/xem-tuoi' },
    { i:'handshake', t:'Xem tuổi làm ăn', d:'So hợp hai người khi bắt tay hợp tác', h:'/app/xem-lam-an' },
    { i:'users', t:'Tương hợp tuổi', d:'So hợp hai người bất kỳ: bạn, người thân, đối tác', h:'/app/tuong-hop' },
    { i:'baby', t:'Xem tuổi sinh con', d:'Năm sinh con hợp tuổi bố mẹ theo địa chi', h:'/app/sinh-con' },
  ]},
  { g:'Tử Bình', items:[
    { i:'rows', t:'Lá số Bát Tự', d:'Tứ trụ Tử Bình: nhật can, dụng thần, cách cục', h:'/app/bat-tu' },
  ]},
  { g:'Xem Tướng', items:[
    { i:'face', t:'Xem tướng', d:'Tướng mặt, mắt, bàn tay qua ảnh', h:'/app/xem-tuong' },
  ]},
  { g:'Phong Thủy', items:[
    { i:'compass', t:'Phong thủy', d:'Bố cục nhà, phòng, bàn làm việc qua ảnh', h:'/app/phong-thuy' },
    { i:'home', t:'Hướng Bát Trạch', d:'Cung phi & hướng nhà, bếp, giường hợp mệnh', h:'/app/bat-trach' },
  ]},
  { g:'Chọn Ngày', items:[
    { i:'cal', t:'Chọn ngày tốt', d:'Ngày giờ hợp tuổi cho việc trọng đại', h:'/app/chon-ngay' },
    { i:'cal', t:'Kim Lâu & Tam Tai', d:'Tuổi làm nhà, cưới hỏi có phạm không', h:'/app/kim-lau' },
  ]},
  { g:'Đặt Tên', items:[
    { i:'tag', t:'Đặt tên con', d:'Tên hợp mệnh theo can chi & ngũ hành', h:'/app/dat-ten' },
    { i:'tag', t:'Đặt tên doanh nghiệp', d:'Tên công ty, thương hiệu hợp mệnh chủ & ngành', h:'/app/dat-ten-dn' },
    { i:'leaf', t:'Ngũ hành tên', d:'Tên có hợp mệnh nạp âm không, bồi hay khắc', h:'/app/ngu-hanh-ten' },
  ]},
  { g:'Mệnh Lý', items:[
    { i:'leaf', t:'Nạp âm ngũ hành', d:'Hành bản mệnh theo năm sinh, hợp màu, hướng, tuổi', h:'/app/nap-am' },
  ]},
  { g:'Huyền Học', items:[
    { i:'yinyang', t:'Kinh Dịch — Gieo quẻ', d:'Chu Dịch 64 quẻ, quẻ chính, hào động, quẻ biến', h:'/app/kinh-dich' },
    { i:'hash', t:'Thần số học', d:'Số chủ đạo theo ngày sinh, tính cách, sự nghiệp', h:'/app/than-so-hoc' },
  ]},
];
function svg(n){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">'+(IC[n]||IC.grid)+'</svg>'; }
document.getElementById('homeCards').innerHTML=GROUPS.map(function(grp){
  var cards=grp.items.map(function(it){
    return '<a class="tcard'+(it.ext?' ext':'')+'" href="'+it.h+'"'+(it.ext?' target="_blank" rel="noopener"':'')+'>'+
      '<div class="ic">'+svg(it.i)+'</div>'+
      '<div class="tx"><b>'+esc(it.t)+'</b><span>'+esc(it.d)+'</span></div>'+
      (it.c?'<span class="cost">'+it.c+' Lượng</span>':'')+
      '</a>';
  }).join('');
  return '<div class="grp-title">'+esc(grp.g)+'</div><div class="cards">'+cards+'</div>';
}).join('');
</script>
</body>
</html>

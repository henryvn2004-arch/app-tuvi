<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luận Đường — Tử Vi Minh Bảo</title>
<meta name="description" content="Luận Đường — không gian mệnh lý: lá số Tử Vi, Bát Tự, xem tuổi, đặt tên, chọn ngày — chọn một công cụ để bắt đầu và hỏi trợ lý theo ngữ cảnh.">
<link rel="icon" type="image/webp" href="/seal.webp">
<!-- 🔴 BẮT BUỘC cho đường bật thông báo trên iPhone, không phải tag trang trí.
     Apple chỉ mở Web Push cho trang đã "Thêm vào Màn hình chính" và chạy ở chế
     độ standalone — mà chế độ đó do manifest (`display:standalone`) hoặc thẻ
     apple dưới đây quyết định. Trang /app trước giờ KHÔNG có cả hai: `nav.js`
     có chèn manifest, nhưng nó nằm ở CUỐI file trong khi các trang /app nạp
     nav.js ở chế độ `data-icons-only` — chế độ này `return` sớm hơn hẳn. Nên
     thêm vào Màn hình chính từ đây chỉ ra một bookmark mở lại Safari, và lời
     hướng dẫn bật thông báo là một ngõ cụt.
     ⚠️ Trang /app KHÁC vẫn chưa có (gắn qua nav.js sẽ phải bump `?v=` trên 89
     file) — đây là trang DUY NHẤT mời cài nên phủ đúng chỗ cần trước. -->
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tử Vi MB">
<link rel="apple-touch-icon" href="/seal.png">
<link rel="preload" href="/fonts/noto-serif-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/noto-serif-vietnamese-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/noto-serif.css?v=1">
<link rel="stylesheet" href="/shell.css?v=39">
<style>
/* Thẻ Vận Hôm Nay phải co theo bề rộng CỘT chứ không theo viewport: trên
   desktop `.ws` chỉ còn ~360px sau khi trừ sidebar 246px + rail 336px, nên
   `@media(max-width:600px)` KHÔNG BAO GIỜ khớp và thẻ nhận layout 3 cột
   trong một cột hẹp — chữ ngày vỡ làm 3 dòng, tranh tràn ra ngoài. Khai
   container ở đây rồi mọi luật co giãn của thẻ hỏi `@container home`. */
.home-body{max-width:920px;container:home / inline-size}
.hero{background:linear-gradient(135deg,var(--navy),#0d2a49);border-radius:16px;padding:26px 28px;margin-bottom:24px;color:#fff;position:relative;overflow:hidden}
.hero .seal{position:absolute;right:-10px;top:-14px;font-size:150px;line-height:1;color:rgba(212,175,55,.13);font-family:var(--serif);pointer-events:none}
.hero h1{font-family:var(--serif);font-size:24px;font-weight:700;margin-bottom:7px}
.hero p{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.6;max-width:560px}
.grp-title{font-family:var(--serif);font-size:14px;font-weight:600;color:var(--text-mid);margin:22px 2px 12px;display:flex;align-items:center;gap:9px}
.grp-title::after{content:"";flex:1;height:1px;background:var(--line)}
/* ── KHUNG CHỜ #nextCard ────────────────────────────────────────────────────
   🐞 Vì sao cần: `navFallback()` đọc localStorage, nên KHÁCH LẦN ĐẦU nhận
   `null` ⇒ `renderNext` không vẽ gì, khối này rỗng tới khi `ToolPrices.load()`
   trả lời. Lighthouse mobile đo /app CLS 0,45-0,61; đây là một trong ba cú nhảy.

   🔑 CỐ Ý không khớp chiều cao theo NỘI DUNG: chữ nằm dưới `tool_pricing`, đo
   thật ở 390px ra 99/77/99/77px vì câu hỏi dài ngắn khác nhau. Dựng khung chờ
   theo đúng nếp đó là chép tay một thứ ở DB — sửa mô tả công cụ là khung chờ
   trôi mà không ai hay. Nên mọi ô đều để HAI dòng: dư ~44px cho cả khối thay
   vì thiếu ~390px, và không dính gì vào nội dung.
   Dư (khối co lại) chứ không thiếu (khối nở ra) là có chủ đích: nội dung dồn
   LÊN thì thứ người ta sắp chạm chạy ra xa ngón tay, không chui vào dưới nó.

   Thanh xám vẽ bằng `background` chứ không bằng chiều cao/lề của phần tử —
   mỗi `.sk` vẫn là một dòng chữ `&nbsp;` nên cao đúng bằng một dòng thật. */
.nx-skel .sk{display:block;color:transparent;
  background:linear-gradient(var(--line),var(--line)) no-repeat left center/100% 11px}
.nx-skel .ic{background:var(--line)!important;color:transparent!important}
.nx-skel b .sk{background-size:58% 13px}
.nx-skel{pointer-events:none}
@keyframes tileSkPulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(prefers-reduced-motion:no-preference){
  .nx-skel .sk,.nx-skel .ic{animation:tileSkPulse 1.4s ease-in-out infinite}
}
/* ── Q1: GỢI Ý THEO HÀNH VI ────────────────────────────────────────────────
   `.nx-why` là lý do — phần đáng giá nhất của khối này. Một thẻ gợi ý không
   nói được VÌ SAO thì đọc như quảng cáo mù (xem lib/tools/suggest-tool.ts). */
.next-wrap{margin-bottom:22px}
.nx-main{display:flex;gap:13px;align-items:flex-start;background:var(--white);border:1px solid var(--gold-soft);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);text-decoration:none;transition:.15s}
.nx-main:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(6,26,46,.09)}
.nx-main .ic{width:44px;height:44px;flex:0 0 auto;border-radius:11px;background:var(--navy);color:var(--gold);display:flex;align-items:center;justify-content:center}
.nx-main .ic svg{width:23px;height:23px}
.nx-tx{min-width:0}
.nx-tx b{display:block;font-family:var(--serif);font-size:16px;font-weight:600;color:var(--heading);margin-bottom:4px}
.nx-why{font-size:12.5px;color:var(--text-mid);line-height:1.55}
.nx-go{margin-left:auto;flex:0 0 auto;align-self:center;font-size:18px;color:var(--gold-soft)}
/* ── SPRINGBOARD — lưới TOÀN BỘ công cụ, luôn hiện (thay "Xem tất cả công cụ"
   gập lại + wcCards/allTools cũ). Xem `.grid`/.tile*` + section `.tint-*`
   ngay dưới đây, và `renderSpringboard()` trong <script>. */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px}
@container home (min-width:480px){.grid{grid-template-columns:repeat(6,1fr)}}
@container home (min-width:720px){.grid{grid-template-columns:repeat(8,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;background:none;border:none;padding:0}
.tile-ic{width:52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:transform .12s}
.tile:active .tile-ic{transform:scale(.92)}
.tile-lb{font-size:10.5px;line-height:1.25;color:var(--text-mid);text-align:center;max-width:76px}
/* Tint theo NHÓM (`need_tags` đầu tiên) — màu MANG NGHĨA (nhu cầu), không
   phải trang trí; glyph vẫn đơn sắc (Lucide qua `window.iconHtml`), chỉ nền ô
   đổi theo nhóm. Bản dark khai lại NGUYÊN VẸN — không suy từ light. */
.tint-ban-than{background:#F3E7C8;color:#8A6A1E}
.tint-su-nghiep{background:#DCE8F5;color:#1F4E79}
.tint-tinh-cam{background:#F6E1DF;color:#9B4A3F}
.tint-con-cai{background:#E1EEE1;color:#3F6B45}
.tint-nha-cua{background:#EFE2D3;color:#7A5230}
.tint-chon-ngay{background:#DCEAE8;color:#2B6E63}
.tint-hoi-nhanh{background:#E6E1F0;color:#5B4B8A}
.tint-tuong-mao{background:#EFE0E8;color:#7A4560}
:root[data-theme="dark"] .tint-ban-than{background:#2b2413;color:#E8C875}
:root[data-theme="dark"] .tint-su-nghiep{background:#152331;color:#7FB0EE}
:root[data-theme="dark"] .tint-tinh-cam{background:#301c19;color:#F08A7A}
:root[data-theme="dark"] .tint-con-cai{background:#15291d;color:#5FBF87}
:root[data-theme="dark"] .tint-nha-cua{background:#251d13;color:#D2A876}
:root[data-theme="dark"] .tint-chon-ngay{background:#0f211e;color:#6FC4B6}
:root[data-theme="dark"] .tint-hoi-nhanh{background:#201a2e;color:#B2A0E8}
:root[data-theme="dark"] .tint-tuong-mao{background:#2a1a22;color:#DE9DB8}
/* ── Header springboard (ô tìm) — tên hiệu đã có ở .ws-top, không lặp lại ── */
.hb-header{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.hb-search{display:flex;align-items:center;gap:8px;width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:var(--text-lt);font-family:inherit;font-size:13px;cursor:pointer;text-align:left}
.hb-search:hover{border-color:var(--gold-soft)}
.hb-search svg{width:16px;height:16px;flex:0 0 auto}
.hb-search span{flex:1}
/* ── VẬN HÔM NAY — thẻ hero theo ngày (deterministic, miễn phí) → mồi vào rail luận riêng ──
   Nền SÁNG theo token (`--white`), không còn navy cố định như bản cũ: thẻ nay
   là một tờ tranh, mà tranh thuỷ mặc thì phải đứng trên nền giấy. */
.today-card{position:relative;overflow:hidden;background:var(--white);border:1px solid var(--line);
  border-radius:20px;padding:22px 22px 16px;margin-bottom:22px;color:var(--text);box-shadow:var(--shadow)}
@container home (max-width:430px){.today-card{padding:16px 14px 13px;border-radius:16px;margin-bottom:18px}}
/* ── Tranh ngày ──────────────────────────────────────────────────────────
   4 bức thuỷ mặc trong public/img/van-ngay/, chọn theo dữ liệu engine (xem
   `anhCho()`). Mép trái + đáy nhoè tan vào nền thẻ bằng mask — cắt thẳng thì
   nhìn ra ngay là "một cái ảnh dán vào", mà cả điểm của thẻ là nó phải như
   một tờ tranh.
   🪤 MỘT gradient duy nhất, toả từ góc phải-trên. Bản đầu ghép hai gradient
   thẳng rồi giao lại bằng `mask-composite:intersect` — KHÔNG ăn, ảnh vẫn ra
   hình chữ nhật cạnh sắc. Một lớp thì không cần composite. */
.today-art{position:absolute;top:0;right:0;width:400px;height:228px;z-index:0;
  pointer-events:none;user-select:none;
  -webkit-mask-image:radial-gradient(120% 100% at 100% 0%,#000 26%,rgba(0,0,0,.46) 58%,transparent 82%);
          mask-image:radial-gradient(120% 100% at 100% 0%,#000 26%,rgba(0,0,0,.46) 58%,transparent 82%)}
.today-art img{width:100%;height:100%;object-fit:cover;display:block}
/* Bốn bức đều nền giấy kem. Ở dark KHÔNG hạ xuống thì nó là mảng sáng chói
   nằm giữa một cái thẻ tối. */
:root[data-theme="dark"] .today-art{opacity:.46}
@container home (max-width:520px){.today-art{width:250px;height:168px}}
/* Triện — chữ đơn, đồng bộ với triện in trong chính 4 bức (福 · 平 · 忍 · 忌). */
.today-seal{position:absolute;top:18px;right:20px;z-index:2;width:32px;height:32px;border-radius:5px;
  background:var(--red);color:#fff;font-family:var(--serif);font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(192,57,43,.35)}
@container home (max-width:520px){.today-seal{top:13px;right:12px;width:27px;height:27px;font-size:15px}}
/* Chừa chỗ cho vùng ĐẶC của tranh — mask tắt hẳn ở ~58% bề rộng khung. */
.today-head{position:relative;z-index:1;padding-right:186px;min-height:120px}
@container home (max-width:520px){.today-head{padding-right:112px;min-height:100px}}
.today-eyebrow{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--text-lt);font-weight:700;margin-bottom:5px}
.today-date{font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.1;color:var(--heading);letter-spacing:-.01em}
@container home (max-width:520px){.today-date{font-size:26px}}
.today-badgerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:11px}
/* Nhãn tốt/bình/xấu/kỵ — màu là tín hiệu ĐỌC LƯỚT, đừng đổi thành một màu
   hết: cả điểm của thẻ là nhìn 1 giây biết hôm nay có nên khởi sự không. */
.today-hanh{font-size:13px;font-weight:700;border-radius:22px;padding:5px 16px;white-space:nowrap;
  background:var(--warn-bg);color:var(--warn-tx)}
.today-hanh.v-tot{background:var(--ok-bg);color:var(--ok-tx);border:1px solid var(--ok-line)}
.today-hanh.v-xau{background:var(--no-bg);color:var(--no-tx);border:1px solid var(--no-line)}
/* Ngày kỵ đặc hơn ngày xấu một bậc — nó là luật CẤM khởi sự, không phải một
   ngày yếu. */
.today-hanh.v-ky{background:var(--red);color:#fff}
.today-dot-sep{width:4px;height:4px;border-radius:50%;background:var(--line-2);flex:0 0 auto}
.today-sub{font-size:13.5px;color:var(--text-mid);line-height:1.45}
@container home (max-width:520px){.today-sub{font-size:12.5px;flex-basis:100%}.today-dot-sep{display:none}}
/* Ba mặt nền tín hiệu. Khai ở đây (không phải shell.css) vì chỉ thẻ này dùng. */
.today-card{--ok-bg:#F1F8F3;--ok-line:#D5E9DC;--ok-tx:#1E6B3C;
  --no-bg:#FDF2F2;--no-line:#F5D9D5;--no-tx:#9B2C1C;
  --hr-bg:#FBF7EC;--hr-line:#EDE1C7;--hr-tx:#7A5E22;
  --warn-bg:#FBEBC8;--warn-tx:#6B4E12}
:root[data-theme="dark"] .today-card{--ok-bg:#152219;--ok-line:#26402E;--ok-tx:#5FBF87;
  --no-bg:#2A1A18;--no-line:#4A2B26;--no-tx:#F08A7A;
  --hr-bg:#241F14;--hr-line:#3D3421;--hr-tx:#D8BE73;
  --warn-bg:#3A2E12;--warn-tx:#E7C976}
/* Mọi khối SAU phần đầu phải nằm TRÊN tranh: tranh là `position:absolute` nên
   nền của khối tĩnh vẽ ở dưới nó — không nâng thì núi ló lên mặt ô. */
.today-grid,.today-me,.today-next-h,.today-next,.today-week,.today-cta,.today-foot{position:relative;z-index:1}
.today-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.tbox{border-radius:14px;padding:14px 15px}
.tbox.bad{background:var(--no-bg);border:1px solid var(--no-line)}
.tbox.good{background:var(--ok-bg);border:1px solid var(--ok-line)}
.tbox.hour{background:var(--hr-bg);border:1px solid var(--hr-line)}
.tbox-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.tbox.bad .tbox-h{color:var(--no-tx)}
.tbox.good .tbox-h{color:var(--ok-tx)}
.tbox.hour .tbox-h{color:var(--hr-tx)}
.tbox-h .ic{width:22px;height:22px;flex:0 0 auto}
.tbox-h .ic svg{width:100%;height:100%;display:block}
.tbad-main{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--no-tx);line-height:1.2;margin-bottom:6px}
.tbad-note{font-size:13px;color:var(--text-lt);line-height:1.45}
.tdo{display:flex;flex-direction:column;gap:9px}
.tdo-row{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--heading)}
.tdo-row .ic{width:20px;height:20px;flex:0 0 auto;color:var(--ok-tx)}
.tdo-row .ic svg{width:100%;height:100%;display:block}
.tdo-ten{flex:1;min-width:0}
/* Điểm của engine (0-10) hiện ngay cạnh việc: danh sách nay chứa cả 6/10 lẫn
   10/10, không ghi điểm là gộp hai thứ khác hẳn nhau thành một danh sách phẳng.
   Nhạt hơn tên việc — nó là chú thích, không phải thứ đọc trước. */
.tdo-diem{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--ok-tx);opacity:.72;
  font-variant-numeric:tabular-nums}
.tdo-diem::after{content:"/10";font-weight:400;opacity:.7}
.thr{display:flex;flex-direction:column}
.thr-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--hr-line)}
.thr-row:last-child{border-bottom:0;padding-bottom:0}
.thr-row:first-child{padding-top:0}
.thr-t{font-size:15px;font-weight:700;color:var(--heading);white-space:nowrap}
.thr-v{font-size:13px;color:var(--text-lt);white-space:nowrap}
.tbox-empty{font-size:13px;color:var(--text-lt);font-style:italic;line-height:1.45}
/* Ở máy hẹp CỐ Ý không xếp 3 ô chồng lên nhau: thẻ này là khối ĐẦU của /app,
   mỗi dòng thêm là một dòng đẩy danh sách công cụ xuống dưới màn hình đầu —
   đúng lý do engine chỉ trả 3 việc nên / 2 việc kiêng. Cần tránh + Nên làm
   đứng cạnh nhau, Giờ đẹp nằm ngang hết bề rộng. */
@container home (max-width:600px){
  .today-grid{grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
  .tbox{padding:11px 11px 12px}
  .tbox-h{margin-bottom:8px;gap:7px;font-size:10px}
  .tbox-h .ic{width:17px;height:17px}
  .tbad-main{font-size:17px;margin-bottom:5px}
  .tbad-note{font-size:11.5px}
  .tdo{gap:7px}
  .tdo-row{font-size:13.5px;gap:8px}
  .tdo-diem{font-size:10.5px}
  .tdo-row .ic{width:17px;height:17px}
  .tbox-empty{font-size:11.5px}
  .tbox.hour{grid-column:1/-1}
  .tbox.hour .thr{flex-direction:row;gap:10px}
  .tbox.hour .thr-row{flex:1;flex-direction:column;align-items:flex-start;gap:1px;
    border-bottom:0;border-right:1px solid var(--hr-line);padding:0 10px 0 0}
  .tbox.hour .thr-row:last-child{border-right:0;padding-right:0}
  .thr-t{font-size:13.5px}
  .thr-v{font-size:11.5px}
}
/* ── Vận riêng của bạn ── */
.today-me{display:flex;align-items:center;gap:18px;width:100%;text-align:left;margin-top:14px;
  background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.tme-av{width:52px;height:52px;border-radius:50%;flex:0 0 auto;background:var(--paper-2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-lt)}
.tme-av svg{width:28px;height:28px}
/* Tranh minh hoạ cung/sắc thái — CỐ Ý to hơn hẳn `.tme-av` (icon dự phòng khi
   chưa có lá số): 52px không đủ để thấy được cảnh vẽ, cả thẻ mất hết tác dụng
   trang trí. Lớp riêng vì `.tme-av` còn dùng cho fallback icon nhỏ. */
.tme-av-img{width:128px;height:128px;border-radius:50%;flex:0 0 auto;object-fit:cover;
  border:1px solid var(--line);background:var(--paper-2)}
@container home (max-width:600px){.today-me{margin-top:10px;padding:13px 14px;gap:13px}

   đang active vào `.ws-avatar` — cho Home nó vẽ icon nhà chung chung, lệch
   hẳn triện thật vừa đổi vào `.ws-title` bên cạnh. Thay bằng ảnh triện thật.

   🔑 KHÔNG patch một lần: `mountToolIcon()` XOÁ rồi DỰNG LẠI `.ws-avatar` mỗi
   lần `renderSidebar()` chạy — mà hàm đó chạy TỚI BA LẦN không đồng bộ (boot()

   nên patch một lần lúc DOMContentLoaded sẽ bị viết đè ngay sau đó. Theo dõi
   bằng MutationObserver để tự vá lại mỗi lần `.ws-avatar` bị dựng mới — không
   đụng shell.js dùng chung cho 52 trang còn lại. */
(function(){
  var SEAL='<img src="/seal.webp" alt="Tử Vi Minh Bảo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block">';
  function patchWsAvatar(){
    var av=document.querySelector('.ws-top .ws-avatar');
    if(av && av.firstElementChild && av.firstElementChild.tagName!=='IMG') av.innerHTML=SEAL;
  }
  function start(){
    patchWsAvatar();
    var top=document.querySelector('.ws-top');
    if(top && window.MutationObserver) new MutationObserver(patchWsAvatar).observe(top,{childList:true,subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start);
  else start();
})();
/* ── Q1: GỢI Ý "TIẾP THEO NÊN XEM GÌ" ─────────────────────────────────────

   ô giá nào để mà lệch — `npm run check:prices` không phải canh.

   🪤 BA HỆ TÊN TOOL (bài học D1 trong CLAUDE.md): `SHELL_ACTIVE` dùng
   'luan-giai' trong khi `tool_pricing.tool_id` là 'laso'; 'bat-tu' vs
   'tu-binh'; 'sinh-con' vs 'xem-tuoi-sinh-con'. Cầu nối DUY NHẤT không chép
   tay là `app_path` — '/app/luan-giai' → khoá shell 'luan-giai'. Đừng bao giờ
   ghép '/app/' + tool_id. */
function shellKeyOf(row) {
  var p = row && row.app_path;
  if (typeof p !== 'string' || p.indexOf('/app/') !== 0) return null;
  return p.slice(5) || null;
}

/* Chuỗi "bước tiếp theo" — chép tay CÓ CHỦ ĐÍCH vì phần đáng giá là câu LÝ DO,
   không suy được từ dữ liệu. Khoá là khoá SHELL (xem shellKeyOf).
   `after` = chỉ gợi khi đã dùng tool đó; thiếu `after` = gợi được bất cứ lúc nào.
   Mục nào trỏ tới công cụ đang TẮT sẽ tự rơi ra khi đối chiếu danh mục. */
var FLOW = [
  { key: 'luan-giai', why: 'Lập lá số một lần — 24 phần luận giải, và gần như mọi công cụ khác đều đọc từ đây.' },
  { key: 'van-han-nam', after: 'luan-giai', why: 'Đã đọc lá số tổng quan rồi thì bước tiếp là 12 tháng sắp tới, từng tháng một.' },
  { key: 'cong-so', after: 'luan-giai', why: 'Cùng lá số đó, đọc theo hướng nghề nghiệp: hợp kiểu làm việc nào, ghép đội ra sao.' },
  { key: 'gio-sinh', after: 'luan-giai', why: 'Không chắc giờ sinh? Sai giờ là lệch gần hết lá số — đối chiếu lại một lượt cho yên tâm.' },
  { key: 'chan-dung-vo-chong', after: 'luan-giai', why: 'Cung Phu Thê tả người bạn đời — công cụ này dựng hẳn chân dung đó thành tranh.' },
  { key: 'bat-tu', after: 'luan-giai', why: 'Cùng ngày sinh, đọc bằng một bộ môn khác (Tử Bình) để đối chiếu hai bên có nói giống nhau không.' },
  { key: 'chan-dung-tien-kiep', why: 'Lá số của bạn đặt vào một bối cảnh xưa — một bức chân dung và một câu chuyện để đọc.' },
  { key: 'duyen-no-tien-kiep', after: 'chan-dung-tien-kiep', why: 'Thêm lá số người thứ hai: kiếp trước hai người từng là gì của nhau.' },
  { key: 'day-con', why: 'Có con nhỏ? Đọc lá số của bé theo hướng tính khí và cách dạy nào vào được.' },
  { key: 'huong-nghiep-tre', after: 'day-con', why: 'Đã đọc tính khí của bé — xem bé hợp làm quen với loại việc gì.' },
  { key: 'nhan-mach', after: 'cong-so', why: 'Đọc cả đội 2–8 người một lượt: ai giẫm chân ai, đội đang thiếu kiểu người nào.' }
];
/* Đệm khi hết mục trong FLOW — toàn công cụ MIỄN PHÍ, dùng thử không tốn Lượng. */
var FREE_PICKS = ['than-so-hoc', 'tuong-hop', 'nap-am', 'kinh-dich', 'ngu-hanh-ten', 'ban-do-sao'];
var FREE_WHY = 'Miễn phí — thử ngay, không tốn Lượng nào.';

function hasBirthLocal() {
  try {
    var b = window.Shell && Shell.getRememberedBirth && Shell.getRememberedBirth();
    return !!(b && (b.nam || b.year));
  } catch (e) { return false; }
}
function usedMap() {
  try { return (window.Shell && Shell.usedTools) ? Shell.usedTools() : {}; } catch (e) { return {}; }
}

/* Trả ĐÚNG 1 gợi ý [{row, why}] (Henry 2026-09: một lựa chọn rõ ràng thay vì
   dàn hàng 3). Không có dữ liệu danh mục → mảng rỗng và khối tự ẩn: thà không
   gợi còn hơn dẫn người ta tới một trang không tồn tại. */
function pickNext(d) {
  var rows = (d && d.rows) || [];
  if (!rows.length) return [];
  var byKey = {};
  rows.forEach(function (r) { var k = shellKeyOf(r); if (k && !byKey[k]) byKey[k] = r; });

  var used = usedMap(), out = [], taken = {};
  function add(key, why) {
    if (out.length >= 1 || taken[key] || used[key] || !byKey[key]) return;
    taken[key] = 1; out.push({ row: byKey[key], why: why });
  }

  /* Chưa có lá số: mọi thứ khác đều chờ nó, nên đó là gợi ý số một. */
  if (!hasBirthLocal()) {
    add('luan-giai', FLOW[0].why);
    FREE_PICKS.forEach(function (k) { add(k, FREE_WHY); });
    return out;
  }
  FLOW.forEach(function (f) {
    if (f.after && !used[f.after]) return;
    add(f.key, f.why);
  });
  FREE_PICKS.forEach(function (k) { add(k, FREE_WHY); });
  return out;
}

function cardIcon(row) { return window.iconHtml ? window.iconHtml(row.icon) : svg('grid'); }

function renderNext(d) {
  var host = document.getElementById('nextCard'); if (!host) return;
  var picks = pickNext(d);
  if (!picks.length) {
    // Chưa có dữ liệu (khách lần đầu: `navFallback()` trả null) → GIỮ khung chờ.
    // Xoá về rỗng ở đây là tự bỏ chỗ đã giữ, rồi khối nở ra lúc dữ liệu về —
    // đúng cú nhảy mà khung chờ sinh ra để chặn.
    if (!host.classList.contains('nx-skel')) host.innerHTML = '';
    return;
  }
  host.classList.remove('nx-skel');
  host.removeAttribute('aria-busy');
  host.removeAttribute('aria-label');
  var first = picks[0];
  var html = '<div class="next-wrap">' +
    '<div class="grp-title">✦ Gợi ý cho bạn</div>' +
    '<a class="nx-main" href="' + esc(first.row.app_path) + '">' +
      '<div class="ic">' + cardIcon(first.row) + '</div>' +
      '<div class="nx-tx"><b>' + esc(first.row.label) + '</b>' +
        '<div class="nx-why">' + esc(first.why) + '</div></div>' +
      '<div class="nx-go" aria-hidden="true">›</div>' +
    '</a>';
  host.innerHTML = html + '</div>';
  if (window.mountIcons) window.mountIcons(host);
}
renderNext(window.ToolPrices ? ToolPrices.navFallback() : null);
if (window.ToolPrices) ToolPrices.load().then(function (d) { if (d) renderNext(d); });

/* ── SPRINGBOARD — lưới TOÀN BỘ công cụ đã bật, luôn hiện (thay hẳn nút
   "Xem tất cả công cụ" gập lại + lưới wcCards của màn chào cũ). Henry
   2026-09: 4,8% người vào /app từng mở tiếp một công cụ — số đó phải lên,
   giấu 46 công cụ sau một nút bấm là nguyên nhân.

   Thứ tự = `tool_pricing.home_rank` (sửa trong Admin/SQL, không cần deploy).
   24 mục đầu là dãy Henry XẾP TAY, CỐ Ý xen kẽ nhiều nhóm nhu cầu — đứng
   RIÊNG không chia nhóm, vì chia nhóm đè lên là làm ngược đúng thứ tự đó.
   Phần còn lại rơi về ĐÚNG nhóm của nó (`tool_groups` + `groupsOf` — CÙNG
   nguồn sidebar dùng, không tự nghĩ ra một cách chia mới). */
var SPRINGBOARD_MAIN_COUNT = 24;
/* Tint ô theo nhóm NHU CẦU chính (`need_tags` đầu tiên) — xem 8 lớp `.tint-*`
   trong <style>. Không khớp lớp nào (nhóm mới thêm chưa kịp gán màu) thì rơi
   về `ban-than`, KHÔNG để ô trắng không màu. */
function tileTint(row) {
  return (String(row.need_tags || '').split(',')[0] || '').trim() || 'ban-than';
}
function tileHtml(row) {
  return '<a class="tile" href="' + esc(row.app_path) + '">' +
    '<div class="tile-ic tint-' + esc(tileTint(row)) + '">' + cardIcon(row) + '</div>' +
    '<span class="tile-lb">' + esc(row.label) + '</span></a>';
}
function renderSpringboard(d) {
  var host = document.getElementById('springboard'); if (!host) return;
  var rows = (d && d.rows) || [], groups = (d && d.groups) || [];
  var inApp = rows.filter(function (r) { return r && r.app_path; });
  if (!inApp.length) return; // chưa có dữ liệu — giữ nguyên lượt render trước (hoặc rỗng), đừng xoá
  var sorted = inApp.slice().sort(function (a, b) {
    var ra = a.home_rank == null ? 1e9 : a.home_rank, rb = b.home_rank == null ? 1e9 : b.home_rank;
    return ra - rb || String(a.label).localeCompare(String(b.label), 'vi');
  });
  var main = sorted.slice(0, SPRINGBOARD_MAIN_COUNT);
  var mainIds = {}; main.forEach(function (r) { mainIds[r.tool_id] = 1; });
  var rest = sorted.filter(function (r) { return !mainIds[r.tool_id]; });

  var html = '<div class="grp-title">Công cụ chính</div><div class="grid">' + main.map(tileHtml).join('') + '</div>';
  var seen = {};
  groups.forEach(function (g) {
    var items = rest.filter(function (r) { return window.ToolPrices && ToolPrices.groupsOf(r, groups).indexOf(g.key) >= 0; });
    if (!items.length) return;
    items.forEach(function (r) { seen[r.tool_id] = 1; });
    html += '<div class="grp-title">' + esc(g.title) + '</div><div class="grid">' + items.map(tileHtml).join('') + '</div>';
  });
  var other = rest.filter(function (r) { return !seen[r.tool_id]; });
  if (other.length) html += '<div class="grp-title">Khác</div><div class="grid">' + other.map(tileHtml).join('') + '</div>';
  host.innerHTML = html;
  if (window.mountIcons) window.mountIcons(host);
}
renderSpringboard(window.ToolPrices ? ToolPrices.navFallback() : null);
if (window.ToolPrices) ToolPrices.load().then(function (d) { if (d) renderSpringboard(d); });

/* Ô tìm — mượn ĐÚNG command palette đã có (Ctrl K trên desktop), không dựng
   một hộp tìm kiếm thứ hai. */
(function () {
  var b = document.getElementById('hbSearchBtn'); if (!b) return;
  b.addEventListener('click', function () { try { Shell.openCmd(); } catch (e) { /* ignore */ } });
})();
</script>

<script>
/* ── VẬN HÔM NAY ─────────────────────────────────────────────────────────────
   Thẻ hero theo ngày. Số liệu lấy từ `/api/van-ngay` (nguồn: engine ngày-tốt
   đã có test) — deterministic, MIỄN PHÍ, KHÔNG một lượt LLM nào, không bịa số.

   🔑 Vì sao gọi API chứ không tính ở client như bản cũ: bản cũ dùng
   `HoangDaoTool` nên chỉ có can chi + giờ hoàng đạo, tức thẻ GIỐNG HỆT NHAU
   với mọi người — không ai quay lại mỗi ngày để đọc thứ tờ lịch bloc cũng có.
   Luật 12 trực / 28 tú / ngày kỵ / chấm điểm từng loại việc nằm trong
   `tuvi-engine` (664 dòng, có test); port sang trình duyệt là tạo bản thứ hai
   của cùng bộ luật rồi để hai bản trôi khỏi nhau.

   HoangDaoTool GIỮ LẠI làm đường lùi: API hỏng thì thẻ vẫn hiện như bản cũ,
   KHÔNG biến mất (nó là khối đầu trang chủ).

   Mồi rail: đã nhớ lá số → gắn birth (thầy luận vận riêng, tính Lượng như mọi
   lượt rail); chưa có → kịch bản hoang-dao. Gói/paywall GIỮ NGUYÊN. */
(function(){
  var WD=['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  function vnToday(){
    try{ var s=new Date().toLocaleString('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'});
      var m=s.match(/(\d{4})-(\d{2})-(\d{2})/); if(m) return {y:+m[1],mo:+m[2],d:+m[3]}; }catch(e){}
    var t=new Date(); return {y:t.getFullYear(),mo:t.getMonth()+1,d:t.getDate()};
  }
  function el(id){ return document.getElementById(id); }

  /* Địa chỉ mã QR in trong ảnh tải về — dùng CHUNG `Poster.qrLink` với mọi
     poster khác, nó tự đi qua Shell.viralUrl để mang mã giới thiệu. Chép tay
     riêng ở đây thì sớm muộn hai bên trôi khỏi nhau. */
  function qrLink(){ return Poster.qrLink('van-ngay','/app'); }

  var _birth=null, _hasBirth=false, _today=null, _week=null, _viewing=null;
  function isLoggedIn(){
    try{ var s=window.Auth&&Auth.getSession&&Auth.getSession(); return !!(s&&s.access_token); }catch(e){ return false; }
  }
  // Bản CHỮ THUẦN của khối "Vận riêng của bạn" — poster vẽ trên canvas nên
  // không dùng lại được chuỗi có thẻ <b>; dựng song song ngay lúc render để hai
  // bên không bao giờ nói khác nhau.
  var _meText='';
  // Can chi năm sinh của người xem, do ENGINE trả về (`caNhan.canChiNam`) chứ
  // không suy lại ở client — quy đổi năm → can chi là cổ pháp, có bản thứ hai ở
  // đây là có ngày hai bản trôi khỏi nhau. Nhiệm vụ "bật thông báo" cần nó để
  // lời mời nêu đúng tuổi.
  var _canChiNam='';

  function iso(t){ return t.y+'-'+('0'+t.mo).slice(-2)+'-'+('0'+t.d).slice(-2); }

  /* Xin dữ liệu MỘT ngày. `wantTuan` chỉ bật ở lượt đầu (neo dải ở hôm nay) —
     bấm sang ngày khác mà xin lại cả dải thì dải nhảy theo ngày đang xem, mất
     luôn ý nghĩa "7 ngày TỚI". */
  function fetchDay(t,wantTuan){
    var d=iso(t);
    return (_hasBirth
      ? fetch('/api/van-ngay',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({d:d,birth:_birth,tuan:!!wantTuan})})
      : fetch('/api/van-ngay?d='+d+(wantTuan?'':'&tuan=0'))
    ).then(function(r){ return r.ok?r.json():null; });
  }

  function run(){
  var card=el('todayCard'); if(!card) return;
  _today=vnToday();

  // Bậc cuối của phễu nhắc: có người BẬT rồi có người MỞ không. Đọc `from=push`
  // chứ không đọc `utm_source`: UTM chỉ ghi first-touch, nên người đã ghé site
  // từ trước — đúng nhóm duy nhất nhận được thông báo — sẽ không bao giờ hiện
  // ở bảng nguồn. Hai thứ khác nhau, cả hai đều nằm trong link.
  //
  // 🪤 PHẢI xếp hàng chờ: `shell.js` nạp `track.js` KHÔNG ĐỒNG BỘ, nên lúc hàm
  // này chạy thì `window.Track` chưa tồn tại. Bản đầu gọi thẳng → ReferenceError
  // rơi vào catch và event im lặng biến mất; test bắt được vì `push_optin_shown`
  // (bắn 6 giây sau) thì có mà `push_open` thì không.
  if(/[?&]from=push\b/.test(location.search)) emitWhenReady('push_open');
  function emitWhenReady(type){
    var n=0;
    (function tick(){
      try{
        if(window.Track&&window.Track.event){ window.Track.event(type,{tool_id:'van-ngay'}); return; }
      }catch(e){}
      if(++n<50) setTimeout(tick,100);
    })();
  }

  // birth nhớ trong localStorage theo shape của TuviForm (ngay/thang/nam); rail
  // VÀ api chỉ hiểu shape contract (day/month/year) → PHẢI đổi, đừng truyền thẳng.
  try{ _birth=(Shell.getRememberedBirth&&Shell.birthToApi)?Shell.birthToApi(Shell.getRememberedBirth()):null; }catch(e){}
  _hasBirth=!!(_birth&&_birth.day&&_birth.month&&_birth.year);

  fetchDay(_today,true)
    .then(function(v){ if(v&&v.ok){ if(v.tuan)_week=v.tuan; render(v,_today,_birth,_hasBirth); }
                       else fallback(_today,_birth,_hasBirth); })
    .catch(function(){ fallback(_today,_birth,_hasBirth); });

  el('todayBack').onclick=function(){ goDay(_today); };

  /* Nhiệm vụ (M3) — chạy SONG SONG với lượt lấy vận ngày, không nối đuôi: thẻ
     Vận hôm nay là nội dung chính của màn hình này và không được chờ một lượt
     mạng khác. Hoãn 1,2 giây để `Auth` kịp khôi phục phiên — hỏi token quá sớm
     thì người đã đăng nhập lại bị coi là khách. */
  setTimeout(function(){ khSync(); },1200);
  }

  /* Chuyển thẻ sang một ngày khác trong dải. Vẫn MIỄN PHÍ, vẫn deterministic —
     đây là chỗ người ta lướt thử "thứ Bảy này có được không". */
  function goDay(t){
    fetchDay(t,false).then(function(v){
      if(!v||!v.ok) return;
      render(v,t,_birth,_hasBirth);
      try{ window.Track&&Track.event('tool_open',{tool_id:'van-ngay',meta:{day:iso(t)}}); }catch(e){}
    }).catch(function(){});
  }

  /* Dải ngày — móc quay lại rẻ nhất: nhìn một cái là biết hôm nào nên hẹn
     việc, bấm vào là xem được ngày đó. Hiện 3 ngày cho gọn (thẻ này là khối
     ĐẦU trang chủ), mở ra đủ 7 khi bấm.
     🐞 Nút mở phải gắn lại onclick MỖI lượt render: `todayNext` bị ghi đè
     innerHTML nên nút cũ đã bị vứt cùng DOM cũ. */
  function renderWeek(cur){
    var host=el('todayNext'), head=el('todayNextH'), wk=el('todayWeek');
    if(!_week||!_week.length){ host.style.display='none'; head.style.display='none'; wk.hidden=true; return; }
    function cls(x){ return x.tinhChat==='tốt'?'v-tot':x.tinhChat==='xấu'?'v-xau':'v-binh'; }
    function nhan(x){ return x.bixung?'Xung':x.ngayKy?'Ngày kỵ'
      :x.tinhChat==='tốt'?'Tốt':x.tinhChat==='xấu'?'Xấu':'Bình'; }
    function on(x){ return x.d===cur.d&&x.m===cur.mo&&x.y===cur.y; }
    host.innerHTML=_week.slice(0,3).map(function(x){
      return '<button type="button" class="tday '+cls(x)+(on(x)?' on':'')+'" data-iso="'+esc(x.iso)+'"'
        +' title="'+esc(x.canChi)+'"><span class="dot"></span>'
        +'<span class="tday-tx"><b>'+x.d+'/'+x.m+'</b><span>'+esc(nhan(x))+'</span></span></button>';
    }).join('')
      +'<button class="tall" id="todayAll" type="button" aria-expanded="false">'
      +'<span class="ic" data-icon="calendar-days"></span><span><b>Xem cả</b><small>7 ngày</small></span></button>';
    wk.innerHTML=_week.map(function(x){
      return '<button type="button" class="tw-cell'+(x.tinhChat==='tốt'?' v-tot':x.tinhChat==='xấu'?' v-xau':'')
        +(on(x)?' on':'')+'" data-iso="'+esc(x.iso)+'" title="'+esc(x.canChi+' · ngày '+x.tinhChat+(x.ngayKy?' · ngày kỵ':''))+'">'
        +'<div class="tw-thu">'+esc(x.thu)+'</div><div class="tw-d">'+x.d+'/'+x.m+'</div>'
        +'<div class="tw-dot"></div>'+(x.bixung?'<div class="tw-x">xung</div>':'')+'</button>';
    }).join('');
    host.style.display=''; head.style.display='';
    var all=el('todayAll');
    all.onclick=function(){
      var open=wk.hidden;
      wk.hidden=!open;
      all.setAttribute('aria-expanded',open?'true':'false');
    };
    Array.prototype.forEach.call(document.querySelectorAll('#todayNext .tday, #todayWeek .tw-cell'),function(b){
      b.onclick=function(){
        var p=(b.getAttribute('data-iso')||'').split('-');
        if(p.length===3) goDay({y:+p[0],mo:+p[1],d:+p[2]});
      };
    });
  }


  /* ── Bảng TRA cho phần trình bày ─────────────────────────────────────────
     Đều là ánh xạ TRÌNH BÀY, khoá bằng giá trị API đã trả — không tính lại gì. */

  /* Việc nên làm → NHÃN thẻ + icon. Khoá là `nen[].ten` (ACTIVITY_META.name).
     🔑 ĐỔI TÊN Ở ĐÂY, KHÔNG ĐỔI TRONG ENGINE. Cùng chuỗi `ACTIVITY_META.name`
     đang chở hai việc khác cần đúng từ cổ: SEO `/ngay-tot/<viec>` lấy nó làm
     H1 + <title> (chính từ khoá người ta gõ), và công cụ Hoàng lịch đọc thẳng
     `nen[].ten` của `computeVanNgay` — ở một cuốn hoàng lịch thì "Nhập trạch",
     "An táng" là đúng chỗ. Chỉ THẺ trang chủ mới cần giọng đời thường.
     `null` = ẨN khỏi thẻ: ba việc này không thuộc về khối đầu trang chủ. Giá đã
     đo trên 365 ngày 2026 — ô trống trên ngày lành 2% → 5%; riêng Sinh con
     chưa từng lọt top-3 (0/365) và Đào giếng chỉ 9 ngày, nên gần như free.
     ⚠️ NHÃN ĐO BẰNG PIXEL, KHÔNG ĐẾM KÝ TỰ. Cột tên chỉ rộng **61px** ở máy
     360px và 76px ở máy 390px — đo trên chính trang này, sau khi trừ icon,
     hai khe gap và ô điểm; ước theo số ký tự lệch gần gấp đôi. Nhãn quá khổ
     không vỡ layout, nó xuống hai dòng và làm hai ô lệch chiều cao.
     Bề rộng đã đo @360px: Cưới hỏi 57 · Nhà mới 55 · Xây nhà 52 · Đi xa 33 ·
     Ký kết 41 · Sửa nhà 55 — vừa hết. "Khai trương" 79px là ngoại lệ CỐ Ý:
     không có từ đời thường nào ngắn hơn mà không đổi nghĩa, và nó vốn đã
     xuống dòng ở bản đang chạy nên giữ nguyên không phải hồi quy. */
  var VIEC_NHAN={'Cưới hỏi':'Cưới hỏi','Khai trương':'Khai trương',
    'Nhập trạch':'Nhà mới','Khởi công xây dựng':'Xây nhà',
    'Xuất hành':'Đi xa','Cầu tài':'Ký kết','Sửa nhà':'Sửa nhà',
    'An táng':null,'Đào giếng':null,'Sinh con':null};
  /* Khoá bằng nhãn ĐÃ đổi — `vietChoThe()` chạy trước mọi lượt vẽ. */
  var VIEC_ICON={'Cưới hỏi':'heart','Khai trương':'store','Nhà mới':'home',
    'Xây nhà':'landmark','Đi xa':'compass','Ký kết':'briefcase',
    'Sửa nhà':'landmark'};

  /* Lọc + đổi tên + cắt 3, MỘT LẦN ngay đầu render, để thẻ · rail · bản chia sẻ
     không bao giờ gọi khác tên nhau. Idempotent: chạy lại trên mảng đã đổi thì
     nhãn mới không còn trong `VIEC_NHAN` nên rơi về `x.ten` và giữ nguyên.
     🔑 CẮT 3 Ở ĐÂY, SAU khi lọc — engine CỐ Ý trả tới 6 (xem `van-ngay.ts`).
     Cắt trước khi lọc là để việc bị ẩn ăn mất một chỗ: 34/365 ngày thẻ hiện 2
     dòng thay vì 3. */
  function vietChoThe(nen){
    return (nen||[]).filter(function(x){ return VIEC_NHAN[x.ten]!==null; })
      .map(function(x){
        var nhan=VIEC_NHAN[x.ten];
        return nhan&&nhan!==x.ten ? {ten:nhan,diem:x.diem,vi:x.vi} : x;
      }).slice(0,3);
  }
  /* `gioTot[].viec` của engine dài 3 vế — ô Giờ đẹp chỉ có chỗ cho một NHÃN.
     Khoá bằng `gioTot[].sao` (12 thần), API đã trả sẵn.
     🔑 Giờ Hoàng Đạo tính THEO CHI NGÀY (tuvi-engine/src/ngay-tot/engine.ts,
     `computeGio`), độc lập hoàn toàn với hệ Ngày Kỵ (Tam Nương/Nguyệt Kỵ/Dương
     Công tính theo NGÀY ÂM LỊCH) — hai hệ cổ pháp riêng, không sai. Nhưng nhãn
     KHÔNG được trùng đúng chữ mà ô "Cần tránh" đang cấm ("việc lớn", "khởi
     sự"), không thì đọc như hai ô chọi nhau ngay trên cùng một thẻ.*/
  var GIO_NHAN={'Thanh Long':'Hanh thông','Minh Đường':'Gặp gỡ','Kim Quỹ':'Tiền bạc',
    'Thiên Đức':'Gia đạo','Ngọc Đường':'Thi cử','Tư Mệnh':'Xuất hành'};
  /* Vế đuôi ngắn của "Vận riêng" — rút từ bảng QH đầy đủ bên dưới. */
  var QH_NGAN={'duoc-sinh':'có người giúp','hoa':'tự chủ được','sinh':'hao lực, giữ sức',
    'bi-khac':'dễ vướng, làm chậm','khac':'chủ động, tốn công'};
  /* Tên cung → slug ảnh minh hoạ (public/img/van-rieng/<slug>-<sac-thai>.webp).
     12 cung CỐ ĐỊNH theo TEN_CUNG (tuvi-engine/src/constants.ts) — khớp đúng
     key của CUNG_LINH_VUC trong lib/engine/van-ngay.ts, không phải bảng riêng. */
  var CUNG_SLUG={'Mệnh':'menh','Phụ Mẫu':'phu-mau','Phúc Đức':'phuc-duc',
    'Điền Trạch':'dien-trach','Quan Lộc':'quan-loc','Nô Bộc':'no-boc',
    'Thiên Di':'thien-di','Tật Ách':'tat-ach','Tài Bạch':'tai-bach',
    'Tử Tức':'tu-tuc','Phu Thê':'phu-the','Huynh Đệ':'huynh-de'};
  /* Tên màu (caNhan.mauCaNhan) → mã màu để chấm tròn. */
  var MAU_HEX={'xanh lá':'#2F8F55','xanh lục':'#2F8F55','xanh ngọc':'#4FBFA8','xanh dương':'#2E6FBF',
    'xanh nước biển':'#1F5C9E','đen':'#22262B','trắng':'#EDEDE8','bạc':'#C9CCD1','xám':'#9AA0A6',
    'vàng':'#E0B93C','nâu':'#8A6A45','nâu đất':'#8A6A45','be':'#D9C9A8',
    'đỏ':'#D4483A','hồng':'#E17A9A','cam':'#E08A3C','tím':'#7B5EA7'};

  /* ── Tranh ngày ─────────────────────────────────────────────────────────
     4 bức thuỷ mặc trong public/img/van-ngay/. `anhCho()` là hàm quyết định
     DUY NHẤT — nó chọn CẢ bức tranh LẪN chữ trên huy hiệu, nên hai thứ không
     bao giờ nói khác nhau.

     🔑 NGÀY KỴ XÉT TRƯỚC `tinhChat`: `tinhChatNgay()` (lib/engine/van-ngay.ts)
     chỉ hạ trần tốt→bình khi trúng ngày kỵ, KHÔNG hạ tiếp — nên phần lớn ngày
     kỵ mang nhãn 'bình'. Chọn theo `tinhChat` thì ~1/3 số ngày (9 ngày mỗi
     tháng âm: Tam Nương 3·7·13·18·22·27 + Nguyệt Kỵ 5·14·23, cộng Dương Công
     kỵ nhật) sẽ hiện bức "trời dịu, xóm nhỏ yên ả" ngay cạnh dòng "hoãn việc
     trọng đại", và huy hiệu vàng "Ngày bình" ngay trên đó. Tranh cãi chữ.

     `caNhan.bixung` CỐ Ý không đổi tranh: nó là tầng CÁ NHÂN, mà tranh nằm ở
     tầng ngày đang được cache CDN chung (DAY_CACHE, s-maxage=21600 ở
     app/api/van-ngay/route.ts) — vẽ theo tuổi người xem là phá cache tầng
     ngày. Việc đó để chữ nói: ô "Cần tránh" đã gọi tên rồi. */
  var ANH_BASE='/img/van-ngay/', ANH_V='?v=1';
  var TRIEN={tot:'福',binh:'平',xau:'忍',ky:'忌'};
  var BADGE={tot:['Ngày tốt',' v-tot'],binh:['Ngày bình',''],
             xau:['Ngày xấu',' v-xau'],ky:['Ngày kỵ',' v-ky']};
  function anhCho(v){
    if(v.ngayKy&&v.ngayKy.length) return 'ky';
    var t=v.danhGia&&v.danhGia.tinhChat;
    return t==='tốt'?'tot':t==='xấu'?'xau':'binh';
  }

  /* Hai cỡ ảnh, để `srcset` tự chọn. Khung tranh là 250px trên máy hẹp và
     400px trên desktop ⇒ @2x cần 500w và 800w. Một cỡ duy nhất thì hoặc mờ ở
     desktop, hoặc bắt điện thoại tải file to gấp đôi cho một khung bé.
     🪤 `sizes` chỉ hiểu media query theo VIEWPORT, còn bề rộng khung tranh do
     `@container` quyết. Hai thứ lệch nhau ở đúng một ca: desktop mở rail nên
     cột hẹp (<520px) mà viewport vẫn rộng ⇒ tải 800w cho khung 250px. Chấp
     nhận thừa ở ca đó, KHÔNG hạ ngưỡng: hạ xuống là điện thoại xoay ngang lại
     nhận ảnh mờ, mà đó mới là số đông.
     `width/height` để sẵn dù CSS đã ấn định khung — ảnh chỉ biết mình vẽ gì
     SAU khi /api/van-ngay trả lời, khung có kích thước từ trước thì cú chèn
     không đẩy gì bên dưới. */
  function imgTranh(key){
    var b=ANH_BASE+'ngay-'+key;
    return '<img src="'+b+'-800w.webp'+ANH_V+'"'
      +' srcset="'+b+'-500w.webp'+ANH_V+' 500w, '+b+'-800w.webp'+ANH_V+' 800w"'
      +' sizes="(max-width:520px) 250px, 400px"'
      +' alt="" width="800" height="469" decoding="async" draggable="false">';
  }

  /* ── Vẽ thẻ đầy đủ ─────────────────────────────────────────────────────── */
  function render(v,td,birth,hasBirth){
    // Đổi tên + ẩn TRƯỚC khi gán `_viewing`: rail (`vietNen`) và bản chia sẻ
    // đọc lại chính `_viewing`, nên làm ở đây là ba mặt cùng một danh sách.
    v.nen=vietChoThe(v.nen);
    _viewing=v;
    var key=anhCho(v);
    var isToday=!_today||(td.d===_today.d&&td.mo===_today.mo&&td.y===_today.y);
    el('todayEyebrow').textContent=isToday?'Vận hôm nay':'Vận ngày '+td.d+'/'+td.mo;
    // 🐞 PHẢI đặt 'block', không phải '': luật CSS của .today-back là
    // `display:none`, nên gán '' chỉ xoá inline style rồi rơi về đúng luật đó —
    // nút không bao giờ hiện.
    el('todayBack').style.display=isToday?'none':'block';

    // Tranh + triện. `alt` rỗng + aria-hidden vì nó thuần trang trí: mọi thông
    // tin nó chở đều đã có bằng chữ ngay bên cạnh (huy hiệu + câu chốt).
    el('todayArt').innerHTML=imgTranh(key);
    el('todaySeal').textContent=TRIEN[key];

    el('todayDate').textContent=v.ngay.thu+' · '+td.d+'/'+td.mo;
    var badge=el('todayHanh');
    badge.textContent=BADGE[key][0];
    badge.className='today-hanh'+BADGE[key][1];
    el('todaySub').textContent=v.danhGia.nhan;

    /* ── Ô CẦN TRÁNH — mục ai cũng đọc vì nó gọi tên trực tiếp một nhóm người ── */
    var yrs=(v.xung&&v.xung.namSinh||[]).slice(-3).join(', ');
    var badNote=yrs?'Sinh '+yrs+' — tránh việc lớn hôm nay.':'Tránh việc lớn trong hôm nay.';
    var badKy=(v.ngayKy&&v.ngayKy.length)?'Trùng '+v.ngayKy.join(' + ')+' — cổ pháp kiêng khởi sự.':'';
    var boxBad='<div class="tbox bad"><div class="tbox-h"><span class="ic" data-icon="alert-triangle"></span>Cần tránh</div>'
      +'<div class="tbad-main">Xung tuổi '+esc(v.xung?v.xung.chi:'—')+'</div>'
      +'<div class="tbad-note">'+esc(badNote)+(badKy?'<br>'+esc(badKy):'')+'</div></div>';

    /* ── Ô NÊN LÀM — điểm từng loại việc lấy thẳng của engine, không tự xếp hạng.
       🔑 NGÀY KỴ thì ô này KHÔNG liệt kê việc. Engine hạ ngưỡng xuống 5 điểm để
       ô bớt trống trên ngày lành (31% → 2%), nhưng cùng lúc làm 65/121 ngày kỵ
       có việc lọt vào — tức thẻ khuyên "Nên làm: Cưới hỏi 5/10" ngay cạnh ô
       "Cần tránh" đang ghi "cổ pháp kiêng khởi sự". Đo trên 365 ngày của 2026.
       Chặn ở ĐÂY (tầng trình bày) chứ không ở engine: engine phải trả đúng
       điểm nó tính được, còn "có nên nói ra không" là việc của mặt hiển thị.
       Dùng lại `key` của `anhCho()` — cùng một hàm quyết định với tranh và huy
       hiệu, nên ba thứ không bao giờ nói khác nhau.
       CỐ Ý chỉ chặn ngày KỴ, không chặn ngày xấu: ngày kỵ là luật CẤM khởi sự
       nên liệt kê việc là cãi thẳng một luật cứng; còn ngày xấu chỉ là ngày
       yếu — một việc 7/10 ở đó vẫn là thông tin thật, và điểm hiện ngay bên
       cạnh đã đủ để người đọc tự cân. */
    var boxGood='<div class="tbox good"><div class="tbox-h"><span class="ic" data-icon="check-circle"></span>Nên làm</div>'
      +(key==='ky'
        ? '<div class="tbox-empty">'+esc('Ngày '+(v.ngayKy||[]).join(' + ')+' — cổ pháp kiêng khởi sự. Việc thường ngày vẫn làm bình thường.')+'</div>'
        :(v.nen&&v.nen.length)
        ? '<div class="tdo">'+v.nen.map(function(x){
            // Điểm hiện KÈM tên việc. Engine hạ ngưỡng xuống 5 để ô này bớt
            // trống, nên danh sách nay có cả việc 5/10 lẫn 10/10 — không ghi
            // điểm là gộp hai thứ khác hẳn nhau thành một danh sách phẳng, tức
            // thẻ đang khuyên quá tay.
            // `x.ten` ở đây đã là nhãn của `vietChoThe()`, không phải tên engine.
            return '<div class="tdo-row"><span class="ic" data-icon="'+(VIEC_ICON[x.ten]||'check-circle')
              +'"></span><span class="tdo-ten">'+esc(x.ten)+'</span>'
              +(x.diem?'<b class="tdo-diem">'+x.diem+'</b>':'')+'</div>'; }).join('')+'</div>'
        : '<div class="tbox-empty">Hôm nay không việc lớn nào được điểm cao — để dành sang ngày khác.</div>')
      +'</div>';

    /* ── Ô GIỜ ĐẸP — giờ tốt mà không nói để làm gì thì không dùng được ── */
    var hours=(v.gioTot||[]).slice(0,3);
    var boxHour='<div class="tbox hour"><div class="tbox-h"><span class="ic" data-icon="clock"></span>Giờ đẹp</div>'
      +(hours.length
        ? '<div class="thr">'+hours.map(function(h){
            return '<div class="thr-row"><span class="thr-t">'+esc(String(h.range).replace('-',' – '))
              +'</span><span class="thr-v">'+esc(GIO_NHAN[h.sao]||h.sao||'')+'</span></div>'; }).join('')+'</div>'
        : '<div class="tbox-empty">Ngày này không có giờ hoàng đạo.</div>')
      +'</div>';
    var grid=el('todayGrid');
    grid.innerHTML=boxBad+boxGood+boxHour;
    grid.style.display='';

    /* ── Khối CÁ NHÂN — vế duy nhất khiến thẻ là "của bạn". Không có lá số thì
       để trống có chủ đích: chỗ trống đó chính là CTA lập lá số. ── */
    var me=el('todayMe');
    _meText='';
    if(v.caNhan){
      var c=v.caNhan, plain=[];
      var star=(c.chinhTinh&&c.chinhTinh.length)?c.chinhTinh.join(', '):'vô chính diệu';
      // Ngày Kỵ (key==='ky') là luật CẤM khởi sự, đứng trên quan hệ ngũ hành
      // ngày↔bản mệnh — không thì tail có thể đọc "chủ động, tốn công" ngay
      // cạnh ô Cần tránh đang ghi "cổ pháp kiêng khởi sự".
      var isKy=key==='ky';
      // Card hiện ra cho người thường đọc — không nhắc thuật ngữ (tên cung, tên
      // sao Hán Việt, văn cách cục cổ). `loai` cách cục (tốt/xấu/trung) dịch
      // thẳng sang kết luận ngắn, mạnh, khẳng định; ưu tiên trên ngũ hành vì
      // cách cục đọc đúng cung đang được chiếu, ngũ hành chỉ là suy diễn chung.
      var LOAI_CAU={'tốt':'thuận lợi','xấu':'cần thận trọng','trung':'bình ổn'};
      var tail=c.bixung?'xung chính tuổi bạn':(isKy?'ngày kỵ, hoãn việc lớn'
        :c.cachCuc?(LOAI_CAU[c.cachCuc.loai]||'bình ổn'):(QH_NGAN[c.quanHeHanh]||''));
      // Sắc thái tranh minh hoạ (tot/binh-thuong/xau) — CÙNG một thứ tự ưu tiên
      // với `tail` phía trên, để tranh không bao giờ "nói khác" chữ hiển thị.
      var LOAI_SAC={'tốt':'tot','xấu':'xau','trung':'binh-thuong'};
      var QH_SAC={'duoc-sinh':'tot','hoa':'tot','sinh':'binh-thuong','bi-khac':'xau','khac':'xau'};
      var sacThai=c.bixung||isKy?'xau'
        :c.cachCuc?(LOAI_SAC[c.cachCuc.loai]||'binh-thuong')
        :(QH_SAC[c.quanHeHanh]||'binh-thuong');
      var cungSlug=CUNG_SLUG[c.cungNhatHan];
      var avImg=cungSlug?'/img/van-rieng/'+cungSlug+'-'+sacThai+'.webp':'';
      // Nhãn đầu dòng: mảng đời sống NGẮN (vế đầu trước dấu phẩy của `linhVuc`,
      // vd "tiền bạc, tài chính" → "Tiền bạc") — không hiện tên cung/sao gốc.
      var vucNgan=c.linhVuc?c.linhVuc.split(',')[0]:'';
      var vucHoa=vucNgan?vucNgan.charAt(0).toUpperCase()+vucNgan.slice(1):c.cungNhatHan;
      // `linhVuc` dịch tên cung sang mảng đời sống người thường đọc được (vd
      // Tài Bạch → "tiền bạc, tài chính") — KHÔNG đổi ý nghĩa cổ pháp của cung,
      // chỉ thêm chữ. Nguồn: `CUNG_LINH_VUC` trong lib/engine/van-ngay.ts.
      plain.push('Ngày hôm nay rơi vào cung '+c.cungNhatHan+(c.linhVuc?' ('+c.linhVuc+')':'')
        +(c.diaChiNhatHan?' ('+c.diaChiNhatHan+')':'')
        +(c.chinhTinh&&c.chinhTinh.length?' — chính tinh '+c.chinhTinh.join(', '):' — vô chính diệu'));
      if(c.bixung) plain.push('Ngày xung chính tuổi bạn — nên giữ nhịp, tránh quyết định lớn.');
      else if(isKy) plain.push('Hôm nay là ngày kỵ khởi sự — hoãn việc lớn, việc thường ngày vẫn làm bình thường.');
      // Cách cục tại đúng cung Nhật Hạn hôm nay (đồng cung / tam hợp / xung
      // chiếu, engine đã tính sẵn — xem `cachCucChoCung` trong van-ngay.ts) —
      // lớp chi tiết SÂU hơn hẳn câu ngũ hành chung bên dưới, vì đọc thẳng cách
      // cục thật của đúng cung đang được chiếu, không phải suy diễn ngũ hành.
      if(c.cachCuc&&c.cachCuc.tomTat) plain.push('Cách cục: '+c.cachCuc.tomTat);
      var QH={'duoc-sinh':'hành ngày sinh cho bản mệnh — thuận, dễ được giúp',
              'hoa':'hành ngày cùng hành bản mệnh — hòa, tự chủ được',
              'sinh':'bản mệnh sinh cho hành ngày — hao lực, nên giữ sức',
              'bi-khac':'hành ngày khắc bản mệnh — dễ vướng, làm chậm lại',
              'khac':'bản mệnh khắc hành ngày — chủ động được, hơi tốn công'};
      // Ngày kỵ thì gắn rõ QH chỉ nói về việc thường ngày, không phải cổ vũ
      // khởi sự lớn.
      if(c.quanHeHanh&&QH[c.quanHeHanh]) plain.push((isKy&&!c.bixung?'Riêng việc thường ngày, ':'')+QH[c.quanHeHanh]+'.');
      var mau=(c.mauCaNhan||[]).slice(0,2);
      if(mau.length) plain.push('Màu hợp bản mệnh: '+mau.join(', ')+'.');
      // Bản CHỮ THUẦN cho poster — poster vẽ trên canvas nên không dùng lại
      // được chuỗi có thẻ; dựng song song ngay tại đây để hai bên không bao
      // giờ nói khác nhau.
      _meText=plain.join(' ');
      // Nói RÕ thẻ đang dựa trên lá số nào + cho đường sửa. Trước đây khối này
      // luận vận riêng mà không hé lộ nguồn, nên lá số sai (hoặc của người khác
      // dùng nhờ máy) thì người xem không hiểu vì sao và không sửa được.
      var srcLine='';
      try{ srcLine=(Shell.birthSummary&&birth)?Shell.birthSummary(birth):''; }catch(e){}
      me.innerHTML='<div class="today-me">'
        +(avImg?'<img class="tme-av-img" src="'+avImg+'" alt="" width="128" height="128" loading="lazy">'
          :'<span class="tme-av" data-icon="user"></span>')
        +'<span class="tme-b"><span class="tme-h">Vận riêng của bạn</span>'
        +'<span class="tme-t">'+esc(vucHoa)
        +(tail?' <span class="lt">– '+esc(tail)+'</span>':'')+'</span>'
        +(mau.length?'<span class="tme-s">Màu hợp: '+esc(mau.join(', '))+'<span class="tme-swatch">'
          +mau.map(function(m){ return '<i style="background:'+(MAU_HEX[m]||'#999')+'"></i>'; }).join('')
          +'</span></span>':'')
        +'<span class="tme-src"><span class="ic" data-icon="calendar"></span><span>Theo lá số: <b>'+esc(srcLine||'đã lưu trên máy này')+'</b></span>'
        +'<button class="tme-edit" id="tmeEdit" type="button">Đổi lá số</button></span>'
        +'<span id="tmeFormHost"></span></span></div>';
    } else {
      me.innerHTML='<div class="today-me"><span class="tme-av" data-icon="user"></span>'
        +'<span class="tme-b"><span class="tme-h">Vận riêng của bạn</span>'
        +'<span class="tme-t">Trên đây là vận CHUNG của ngày — giống nhau với mọi người.</span>'
        +'<span class="tme-s">Nhập ngày sinh một lần để thấy hôm nay rơi vào cung nào của riêng bạn.</span>'
        +'<button class="tme-cta" id="tmeEdit" type="button">Nhập lá số của bạn →</button>'
        +'<span id="tmeFormHost"></span></span></div>';
    }
    wireBirthForm(td);

    renderWeek(td);
    if(window.mountIcons) window.mountIcons(el('todayCard'));
    wire(v,td,birth,hasBirth,hours);
    try{ _canChiNam=(v&&v.caNhan&&v.caNhan.canChiNam)||_canChiNam; }catch(e){}
    maybeAskPush(v,isToday,birth);
  }

  /* ── Mời bật nhắc hằng ngày ─────────────────────────────────────────────
     Hỏi SAU khi thẻ đã dựng xong, KHÔNG phải lúc vào trang. Xin quyền trước
     khi người ta thấy mình được gì là cách chắc nhất bị bấm "Chặn" — mà
     "Chặn" trên trình duyệt là VĨNH VIỄN, không có đường hỏi lại.

     Ba điều kiện, mỗi cái bịt một kiểu hỏi sai chỗ:
       • `isToday` — đang xem ngày khác thì lời mời "mỗi sáng" lệch ngữ cảnh.
       • có `caNhan` — người đã lưu lá số. Chỉ họ mới nhận được phần đáng giá
         nhất của tin nhắc (ngày nào xung chính tuổi mình); mời người chưa có
         lá số là hứa một thứ nhạt hơn hẳn.
       • trễ 6 giây — đủ để đọc xong thẻ. Bật lên ngay khi thẻ vừa hiện thì
         hộp thoại che đúng thứ vừa thuyết phục họ.

     Nạp `pwa-push.js` ĐÚNG LÚC CẦN (không nhét vào <head>): trang này là màn
     hình đầu của /app, mỗi file thêm vào đường tải là một nhịp chậm cho mọi
     người, kể cả người sẽ không bao giờ thấy lời mời. */
  var _pushAsked=false;
  function maybeAskPush(v,isToday,birth){
    if(_pushAsked||!isToday||!v||!v.caNhan) return;
    _pushAsked=true;
    var nam=(birth&&+birth.year)||0;
    setTimeout(function(){
      function go(){
        if(!window.askPushPermission) return;
        try{ window.askPushPermission(nam, (v.caNhan&&v.caNhan.canChiNam)||''); }catch(e){}
      }
      if(window.askPushPermission) return go();
      var s=document.createElement('script');
      s.src='/pwa-push.js?v=3'; s.onload=go; s.onerror=function(){};
      document.head.appendChild(s);
    },6000);
  }

  /* ── Nhập / đổi lá số NGAY TRONG THẺ ────────────────────────────────────
     Trước đây khối "Vận riêng của bạn" khi trống chỉ là một câu chữ chết: nó
     BẢO người ta lập lá số mà không có chỗ nào bấm. Còn khi có lá số thì lại
     không nói đang dùng lá số nào — sai một trường là hỏng cả khối mà không có
     đường sửa.

     Lá số nhớ trong localStorage (`app_birth`, do Shell.rememberBirth ghi khi
     người dùng chạy bất kỳ tool nào có form ngày sinh) → THEO MÁY, không theo
     tài khoản: đổi máy hay mở ẩn danh là khối này trống lại. Đó là lý do phải
     có đường nhập ngay tại đây. */
  function wireBirthForm(td){
    var btn=el('tmeEdit'), host=el('tmeFormHost');
    if(!btn||!host) return;
    btn.onclick=function(){
      if(!window.TuviForm){ try{ location.href='/app/la-so'; }catch(e){} return; }
      btn.style.display='none';
      host.innerHTML='<div class="tme-form"><div id="tmeFields"></div>'
        +'<div class="tme-actions"><button class="tme-save" id="tmeSave" type="button">Xem vận riêng của tôi →</button>'
        +'<button class="tme-cancel" id="tmeCancel" type="button">Hủy</button>'
        +'<span class="tme-err" id="tmeErr"></span></div></div>';
      var prev=null;
      try{ prev=Shell.getRememberedBirth&&Shell.getRememberedBirth(); }catch(e){}
      TuviForm.render('tmeFields',{mode:'compact',showName:true,gioitinh:(prev&&prev.gioitinh)||'nam'});
      if(prev) try{ TuviForm.setData(prev); TuviForm._update(''); }catch(e){}
      el('tmeCancel').onclick=function(){ host.innerHTML=''; btn.style.display=''; };
      el('tmeSave').onclick=function(){
        var fd=null; try{ fd=TuviForm.getData(); }catch(e){}
        if(!fd||!fd.ngay||!fd.thang||!fd.nam){ el('tmeErr').textContent='Thiếu ngày/tháng/năm sinh.'; return; }
        // Lưới đỡ: ô tên có sẵn (setData đã điền từ prev) nên bình thường fd.hoten
        // đã đúng; giữ fallback này chỉ để phòng ô bị bỏ trống ngoài ý muốn —
        // ghi đè trắng thì rail mất cách xưng hô đúng tên.
        if(prev&&prev.hoten&&!fd.hoten) fd.hoten=prev.hoten;
        try{ Shell.rememberBirth(fd); }catch(e){}
        try{ _birth=Shell.birthToApi(fd); }catch(e){ _birth=null; }
        _hasBirth=!!(_birth&&_birth.day&&_birth.month&&_birth.year);
        if(!_hasBirth){ el('tmeErr').textContent='Ngày sinh chưa hợp lệ.'; return; }
        el('tmeSave').disabled=true; el('tmeSave').textContent='Đang lập…';
        // Xin lại CẢ dải 7 ngày: `bixung` của từng ô phụ thuộc tuổi người xem,
        // giữ dải cũ là để lại 7 ô tính cho "người chưa có lá số".
        fetchDay(_today,true).then(function(v){
          if(v&&v.ok){ if(v.tuan)_week=v.tuan; render(v,_today,_birth,_hasBirth); }
          else { host.innerHTML=''; btn.style.display=''; }
          try{ window.Track&&Track.event('tool_run',{tool_id:'van-ngay',meta:{from:'today_card_birth'}}); }catch(e){}
          // Vừa lưu lá số → bước 1 của Khởi Hành xong. `Shell.rememberBirth`
          // ghi lên sổ tài khoản theo lối BẮN-VÀ-QUÊN nên phải chờ một nhịp,
          // không thì server hỏi `user_charts` trước khi dòng kịp vào.
          setTimeout(function(){ _khLast=0; khSync(); },1800);
        }).catch(function(){
          el('tmeSave').disabled=false; el('tmeSave').textContent='Xem vận riêng của tôi →';
          el('tmeErr').textContent='Không lập được, thử lại sau.';
        });
      };
    };
  }

  /* ── Đường lùi: API hỏng → thẻ tối giản như bản cũ ───────────────────────
     HoangDaoTool GIỮ LẠI làm đường lùi: API hỏng thì thẻ vẫn hiện, KHÔNG biến
     mất (nó là khối đầu trang chủ). Bản lùi chỉ có can chi + giờ hoàng đạo nên
     KHÔNG có `danhGia`/`ngayKy` ⇒ `anhCho()` rơi về 'binh' — đúng: không biết
     ngày tốt hay xấu thì đừng vẽ tranh nắng cũng đừng vẽ tranh mưa. */
  function fallback(td,birth,hasBirth){
    if(!window.HoangDaoTool) return;
    var r=HoangDaoTool.compute(td.d,td.mo,td.y); if(!r||!r.ok) return;
    var wd=WD[new Date(td.y,td.mo-1,td.d).getDay()];
    var hours=(r.data.gioHoangDao||'').split(' · ').slice(0,3).map(function(h){
      var m=h.match(/^(\S+)\s*\(([^)]+)\)/); return m?{chi:m[1],range:m[2],sao:m[1]}:{chi:h,range:'',sao:''};
    });
    el('todayArt').innerHTML=imgTranh('binh');
    el('todaySeal').textContent=TRIEN.binh;
    el('todayDate').textContent=wd+' · '+td.d+'/'+td.mo;
    var badge=el('todayHanh');
    badge.textContent='Ngày '+r.data.canChiNgay; badge.className='today-hanh';
    el('todaySub').textContent='Hành '+r.data.canHanh+' — số liệu rút gọn, thử tải lại sau.';
    var grid=el('todayGrid');
    grid.innerHTML='<div class="tbox hour" style="grid-column:1/-1">'
      +'<div class="tbox-h"><span class="ic" data-icon="clock"></span>Giờ đẹp</div>'
      +(hours.length?'<div class="thr">'+hours.map(function(h){
          return '<div class="thr-row"><span class="thr-t">'+esc(h.chi)+'</span>'
            +'<span class="thr-v">'+esc(h.range)+'</span></div>'; }).join('')+'</div>'
        :'<div class="tbox-empty">Không lấy được giờ hoàng đạo.</div>')+'</div>';
    grid.style.display='';
    if(window.mountIcons) window.mountIcons(el('todayCard'));
    wire({ngay:{canChi:r.data.canChiNgay,canHanh:r.data.canHanh},_flat:r.data},td,birth,hasBirth,hours);
  }

  /* ── Câu chào HỎI THĂM ───────────────────────────────────────────────────
     Thầy nói trước, và nói như người quen chứ không như một cái máy tra cứu.
     Dựng bằng TRA BẢNG + tối đa MỘT mẩu hồ sơ — CỐ Ý không gọi LLM: trả tiền
     cho một câu mà quá nửa số người chưa đọc đã gõ tiếp là phí.
     Chỉ nhắc lại chuyện cũ khi ĐÃ XA ÍT NHẤT MỘT NGÀY — hỏi lại "chuyện đó đỡ
     chưa" ngay trong cùng buổi thì thành lải nhải. Và chỉ nhắc nhóm `moi_lo`:
     đó là thứ người ta thật sự mong có người hỏi tới, khác hẳn "nhà có hai con
     nhỏ" (biết thì hay, mà lôi ra chào thì kỳ).                             */
  function daysAway(){
    try{
      var last=(window.Shell&&Shell.lastChatAt)?Shell.lastChatAt():0;
      if(!last) return -1;                                   // chưa lần nào
      return Math.floor((Date.now()-last)/86400000);
    }catch(e){ return -1; }
  }

  // Lấy MỘT mối lo trong hồ sơ. Có hạn giờ 1,5s và luôn gọi cb đúng một lần —
  // hồ sơ chậm thì rơi về câu chào chung, không để rail treo không lời nào.
  function fetchWorry(cb){
    var tk=null;
    try{ tk=(window.Auth&&Auth.getSession&&Auth.getSession()||{}).access_token||null; }catch(e){}
    if(!tk){ cb(null); return; }
    var done=false;
    var fin=function(x){ if(done)return; done=true; cb(x); };
    setTimeout(function(){ fin(null); },1500);
    fetch('/api/payment?action=my-memory',{headers:{Authorization:'Bearer '+tk}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        var it=((j&&j.items)||[]).filter(function(x){ return x&&x.loai==='moi_lo'&&x.noi_dung; })[0];
        fin(it?String(it.noi_dung):null);
      })
      .catch(function(){ fin(null); });
  }

  function greetingFor(cc,nm,away,worry){
    var xung=nm?(', '+nm):'';
    if(away<0) return 'Chào con'+xung+'. Thầy ở đây — con muốn kể gì cũng được: chuyện đi làm, chuyện trong nhà, '
      + 'hay chỉ là hôm nay thấy mệt. Mà nếu muốn xem vận ngày **'+cc+'** hôm nay thì thầy soi luôn.';
    if(away>=1&&worry) return 'Mấy hôm nay con thế nào'+xung+'? Lần trước con có nhắc chuyện **'+worry+'** — '
      + 'chuyện đó tới đâu rồi con?';
    if(away>=3) return 'Lâu rồi con chưa ghé'+xung+'. Dạo này ổn cả chứ? Có gì muốn kể với thầy không?';
    if(away>=1) return 'Con lại ghé rồi'+xung+'. Hôm nay thế nào — có chuyện gì trong lòng không?';
    return 'Thầy đây'+xung+'. Con còn muốn hỏi gì nữa không, hay có chuyện gì muốn kể?';
  }

  // Chips = câu người dùng BẤM ĐỂ GỬI. Trộn hai đường: mở lòng và tra cứu.
  // Trước đây cả 4 đều là câu tra vận, nên khung chat chỉ đọc thành một cái
  // máy bói — người đang muốn nói chuyện không thấy chỗ nào để bắt đầu.
  var CHIPS_TAM_SU=['Dạo này con thấy mệt mỏi quá','Con đang bế tắc chuyện công việc',
                    'Vận hôm nay của con thế nào?','Thời gian tới có gì đáng lưu ý không?'];

  /* ── Mồi rail + nút ────────────────────────────────────────────────────── */
  /* Báo trạng thái cho nút BIỂU TƯỢNG. Bản cũ ghi `btn.textContent='✓ Đã chép
     link'` — với nút chỉ có icon thì lệnh đó XOÁ LUÔN cái SVG bên trong, nút
     thành một ô vuông đựng chữ tràn. Đổi icon rồi trả về mới là cách đúng. */
  function flashIcon(btn,icon,ms){
    if(!btn) return;
    var sp=btn.firstElementChild; if(!sp) return;
    var cu=sp.getAttribute('data-icon');
    sp.setAttribute('data-icon',icon);
    if(window.mountIcons) window.mountIcons(btn);
    setTimeout(function(){
      sp.setAttribute('data-icon',cu);
      if(window.mountIcons) window.mountIcons(btn);
    },ms||1800);
  }

  function wire(v,td,birth,hasBirth,hours){
    var cc=v.ngay.canChi;
    try{
      if(hasBirth){
        var nm=(birth.name||'').trim();
        var away=daysAway();
        // Mồi NGAY bằng câu chào chung để rail dùng được liền, rồi NÂNG CẤP khi
        // hồ sơ về (nếu có mối lo). setContext lượt sau dựng lại thread — vô hại
        // vì người dùng chưa gõ gì trong ~1,5s đầu.
        var prime=function(worry){
          Shell.setContext({
            birth:birth,
            label:'Trò chuyện với Thầy'+(nm?' · '+nm:''),
            placeholder:'Kể cho thầy nghe…',
            greeting:greetingFor(cc,nm,away,worry),
            chips:CHIPS_TAM_SU,
            passive:true
          });
        };
        prime(null);
        if(away>=1) fetchWorry(function(w){ if(w) prime(w); });
      } else {
        // ⚠️ `extractGenericContext` BỎ QUA mọi giá trị là object → payload phải
        // PHẲNG, nếu không rail nhận được đúng mấy dòng rồi luận chay.
        var flat=v._flat||{
          ngayDL:td.d+'/'+td.mo+'/'+td.y, amLich:v.ngay.am, thuTrongTuan:v.ngay.thu,
          canChiNgay:cc, canHanh:v.ngay.canHanh,
          truc:v.truc.ten+' ('+v.truc.tinhChat+')', tu:v.tu.ten+' ('+v.tu.tinhChat+')',
          saoNgay:v.saoNgay.ten+' — '+v.saoNgay.yNghia+(v.saoNgay.hoangDao?' [hoàng đạo]':' [hắc đạo]'),
          tinhChatNgay:v.danhGia.tinhChat, ngayKy:(v.ngayKy||[]).join(', '),
          xungTuoi:v.xung?v.xung.chi:'',
          vietNen:(v.nen||[]).map(function(x){return x.ten;}).join(', '),
          vietKieng:(v.kieng||[]).map(function(x){return x.ten;}).join(', '),
          gioHoangDao:(v.gioTot||[]).map(function(h){return h.chi+' ('+h.range+')';}).join(' · '),
          mauHop:(v.mau&&v.mau.list||[]).join(', '),
          huongHyThan:v.huong?v.huong.hyThan:'', huongTaiThan:v.huong?v.huong.taiThan:''
        };
        Shell.setContext({
          scenario:{type:'hoang-dao',data:flat},
          label:'Vận ngày '+td.d+'/'+td.mo,
          greeting:'Hôm nay là ngày **'+cc+'** (hành '+v.ngay.canHanh+'). Bạn định làm việc gì để tôi chọn giờ đẹp? Lập lá số để tôi luận vận riêng cho bạn.',
          chips:['Hôm nay nên làm gì, tránh gì?','Giờ nào đẹp để xuất hành?','Lập lá số xem vận của tôi','Ngày mai có tốt không?'],
          passive:true
        });
      }
    }catch(e){ if(window.console)console.error('[today]',e); }

    var ask=el('todayAsk');
    ask.onclick=function(){
      // 🔑 CHỈ MỞ rail, KHÔNG tự gửi câu hỏi. Trước đây nút này bắn thẳng
      // "Hôm nay vận của tôi thế nào?" — tức trả lời hộ người ta câu "muốn nói
      // gì", và đóng khung mọi cuộc trò chuyện thành một lượt tra vận. Nay thầy
      // chào trước, người dùng chọn: bấm chip, hay tự kể chuyện của mình.
      // Người chưa có lá số vẫn giữ đường cũ — rail của họ là kịch bản
      // `hoang-dao` (không có hồ sơ, không có lá số), mở ra mà im lặng thì
      // không có gì để bắt chuyện.
      try{
        if(hasBirth){ Shell.openRail(); var ta=document.getElementById('railInput'); if(ta) ta.focus(); }
        else Shell.ask('Hôm nay là ngày gì, tôi nên làm gì và tránh gì?');
      }catch(e){}
    };

    // Nút "Hỏi trợ lý" của khối chào lần đầu — CHỈ mở rail, không tự gửi gì.
    // `Shell.setContext` phía trên đã mồi sẵn câu chào + chip gợi ý (kịch bản
    // hoang-dao khi chưa có lá số) → mở ra là thấy ngay một menu để chọn, đúng
    // vai một tiếp tân, không phải một cái máy tự hỏi thay người dùng.
    var welcomeAsk=el('welcomeAsk');
    if(welcomeAsk) welcomeAsk.onclick=function(){ try{ Shell.openRail(); }catch(e){} };

    // Chia sẻ vận (vòng khám phá): điện thoại mở share sheet native; desktop chép link.
    var shareBtn=el('todayShare');
    shareBtn.onclick=function(){
      var url='https://tuviminhbao.com/app';
      var hlist=hours.map(function(h){return h.chi+(h.range?' ('+h.range+')':'');}).join(', ');
      var txt='Vận ngày '+td.d+'/'+td.mo+' — Ngày '+cc+' (hành '+v.ngay.canHanh+')'
        +(v.danhGia?', '+v.danhGia.tinhChat:'')+'. Giờ hoàng đạo: '+hlist+'. Xem vận của bạn tại Luận Đường:';
      if(navigator.share){ navigator.share({title:'Vận hôm nay — Tử Vi Minh Bảo',text:txt,url:url}).catch(function(){}); return; }
      var full=txt+' '+url, done=function(){ flashIcon(shareBtn,'check',1800); };
      if(navigator.clipboard){ navigator.clipboard.writeText(full).then(done,function(){}); }
      else { try{ var ta=document.createElement('textarea');ta.value=full;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();done(); }catch(e){} }
    };

    /* Ảnh 9:16 để đăng Story/TikTok. Người Việt chia sẻ ẢNH nhiều hơn chia sẻ
       LINK, mà ảnh không mang thương hiệu thì lan đi rồi không về.
       CỐ Ý là nút RIÊNG, không gộp vào "Chia sẻ": ảnh tải về không có link bấm
       được nên không bao giờ sinh ra share_view/cta_click — gộp chung là kéo
       K-factor tụt giả (đúng lý do `poster_download` là loại event riêng). */
    var posterBtn=el('todayPoster');
    // Đường lùi (API chết) không có đủ dữ kiện để dựng poster → ẩn nút hẳn thay
    // vì để nó đó rồi bấm không ra gì.
    posterBtn.style.display=(v.danhGia&&window.Poster&&Poster.downloadDay)?'':'none';
    posterBtn.onclick=function(){
      if(!window.Poster||!Poster.downloadDay||!v.danhGia) return;
      posterBtn.disabled=true; flashIcon(posterBtn,'hourglass',60000);
      var rows=[];
      if(v.nen&&v.nen.length) rows.push(['Nên hôm nay', v.nen.map(function(x){return x.ten;}).join(' · ')]);
      if(v.kieng&&v.kieng.length) rows.push(['Nên kiêng', v.kieng.map(function(x){return x.ten;}).join(' · ')]);
      // Giờ tốt KÈM việc nên làm — trên web đã kèm, poster mà cắt đi thì người
      // đọc ảnh có giờ đẹp mà không biết để làm gì.
      if(hours&&hours.length) rows.push(['Giờ tốt', hours.map(function(h){return h.chi+' '+h.range+(h.viec?' ('+h.viec+')':'');}).join(' · ')]);
      // Cảnh báo: đúng hai dòng web đang hiện trong khung đỏ.
      var warn=[];
      if(v.xung&&v.xung.chi){
        var yrs=(v.xung.namSinh||[]).slice(-4).join(', ');
        warn.push('Xung tuổi '+v.xung.chi+(yrs?' (sinh '+yrs+')':''));
      }
      if(v.ngayKy&&v.ngayKy.length) warn.push('Trùng '+v.ngayKy.join(' + ')+' — cổ pháp kiêng khởi sự');
      // Dòng tra cứu ĐỦ như thẻ: thêm tú, màu hợp, tài thần (bản cũ bỏ cả ba).
      var sub=[v.ngay.am,'hành '+v.ngay.canHanh,'trực '+v.truc.ten,'sao '+v.saoNgay.ten,'tú '+v.tu.ten];
      if(v.mau&&v.mau.list&&v.mau.list.length) sub.push('màu hợp '+v.mau.list.slice(0,2).join(', '));
      if(v.huong&&v.huong.taiThan) sub.push('tài thần '+v.huong.taiThan);
      Poster.downloadDay({
        verdict:v.danhGia.tinhChat,
        verdictLabel:(v.danhGia.tinhChat==='tốt'?'Ngày tốt':v.danhGia.tinhChat==='xấu'?'Ngày xấu':'Ngày bình'),
        title:v.ngay.thu+' · '+td.d+'/'+td.mo+' — Ngày '+v.ngay.canChi,
        subtitle:sub.join(' · '),
        quote:v.danhGia.nhan,
        warn:warn,
        me:_meText,
        rows:rows,
        // Mã QR mang utm RIÊNG (poster/image) + mã giới thiệu của chính người
        // tải ảnh → ai quét mã mà đăng ký thì người chia sẻ được thưởng, và
        // panel Vòng Lặp Viral tách được đường ẢNH khỏi đường LINK.
        qrUrl:qrLink(),
        qrCaption:'Quét mã — xem vận ngày của riêng bạn'
      },'van-ngay-'+td.y+'-'+td.mo+'-'+td.d+'.png').then(function(){
        try{ window.Track&&Track.event('poster_download',{tool_id:'van-ngay'}); }catch(e){}
      }).catch(function(){
        // Dựng hỏng thì phải NÓI, đừng im lặng — người ta bấm mà không thấy gì
        // là tưởng máy đứng.
        posterBtn.disabled=false; flashIcon(posterBtn,'x-circle',2200);
      }).then(function(){
        posterBtn.disabled=false; flashIcon(posterBtn,'image',0);
      });
    };
  }
  /* ══ KHỞI HÀNH — 3 bước, thay M3 ═════════════════════════════════════════
     Đo prod 07/08 (M3): 48 người nhận 25 Lượng quà đăng ký, đổi lại 3 liên kết
     kênh chat · 2 lượt bật thông báo · 2 dòng lá số của ĐÚNG một người · 0 lượt
     mời bạn — 4 lượt nhận nhiệm vụ / 2 người trong 66 tài khoản. Ba việc hành
     chính đó (lưu lá số/bật push/liên kết kênh) không việc nào cho thấy SẢN
     PHẨM hay hơn, nên gần như không ai làm hết cả ba.

     Khởi Hành đổi sang BA VIỆC MỞ RA THỨ ĐỌC ĐƯỢC (lập lá số → hỏi Thầy → thử
     một công cụ), thưởng THEO CHUỖI — chỉ cộng khi đủ CẢ BA (+15 Lượng, một
     lần/đời, một dòng `onboarding_tasks` khoá `khoi_hanh`). Thưởng lẻ từng
     bước thì người ta nhặt bước rẻ nhất rồi bỏ — đúng thứ M3 vừa cho thấy.

     BẬC 0 (khách vô danh, 90% người chạy tool — xem docs/QUEST-PLAN.md §2.1):
     tiến độ tính hoàn toàn ở MÁY (renderKhoiHanhGuest), thưởng khoá tới khi
     tạo tài khoản. Lúc đó bằng chứng server cần (user_charts/events) đã nằm
     sẵn — họ dùng đúng những nút này trước khi đăng ký — nên không cần đường
     "chuyển bậc" riêng, `khSync()` xử đúng ngay lượt gọi đầu sau khi có token.

     Server tự kiểm và tự cộng cho người đã đăng nhập (lib/onboarding/tasks.ts,
     action=onboarding-sync). Trang này chỉ VẼ và dẫn người ta tới đúng chỗ
     làm — không tự quyết ai xong việc gì. */
  var _khBusy=false, _khLast=0, _khGot=0, _khSteps=[], _khActiveDefs=[];
  var _khGuestDefs=null, _khGuestCredits=15, _khDefsRetried=false, _signupBonusTxt='';

  function khToken(){
    try{ var s=window.Auth&&Auth.getSession&&Auth.getSession(); return s?s.access_token:''; }catch(e){ return ''; }
  }

  /* Định nghĩa 3 bước cho khách VÔ DANH — đọc từ server (action=khoi-hanh-defs,
     công khai, không cần token) thay vì chép tay lần hai ở client: câu chữ chỉ
     có MỘT nguồn (lib/onboarding/tasks.ts), tránh đúng bẫy "bảng dịch dựng từ
     một nguồn thì chỉ phủ nguồn đó" đã cắn repo này 3 lần. */
  function loadKhoiHanhDefs(){
    return fetch('/api/payment?action=khoi-hanh-defs')
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){
        if(d&&Array.isArray(d.steps)&&d.steps.length){ _khGuestDefs=d.steps; _khGuestCredits=(+d.credits)||15; }
      })
      .catch(function(){ /* hỏng thì khối khách vãng lai không hiện — không bịa nội dung */ });
  }
  // Câu "+N Lượng chào mừng" đi kèm nút Tạo tài khoản — cùng nguồn công khai
  // đang phục vụ `topup.html`/thẻ mời bạn, KHÔNG viết cứng số (giá đổi theo
  // A/B `credits.signup_bonus_variants`).
  function loadSignupBonusTxt(){
    fetch('/api/payment?action=signup-bonus')
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ if(d&&d.bonus) _signupBonusTxt=(+d.bonus)+' Lượng chào mừng'; })
      .catch(function(){});
  }

  /* Tiến độ BẬC 0 — tính hoàn toàn ở máy, KHÔNG gọi server:
     1. đã lập lá số     → hasBirthLocal() (đã dùng ở khối "Tiếp theo nên xem
        gì" phía trên — một nguồn duy nhất, không tự hỏi lại Shell lần hai).
     2. đã hỏi Thầy      → cờ 'tvp_kh_hoi', shell.js ghi ngay khi gửi câu hỏi
        đầu tiên trong rail (cùng lúc bắn track('chat_msg', …)).
     3. đã thử 1 công cụ → Shell.usedTools() — map {tool_id:mốc giờ} đã có sẵn
        cho khối gợi ý, dùng lại chứ không tự đếm lần hai. */
  function localKhoiHanhFlags(){
    var s1=false, s2=false, s3=false;
    try{ s1=hasBirthLocal(); }catch(e){}
    try{ s2=localStorage.getItem('tvp_kh_hoi')==='1'; }catch(e){}
    try{ var u=(window.Shell&&Shell.usedTools)?Shell.usedTools():{}; s3=!!Object.keys(u).length; }catch(e){}
    return [s1,s2,s3];
  }

  function khBarHtml(done,total){
    var h='<div class="kh-bar">';
    for(var i=0;i<total;i++) h+='<div class="kh-seg'+(i<done?' on':'')+'"></div>';
    return h+'</div>';
  }

  // 🪤 `esc()` của trang chỉ thoát `& < >`, KHÔNG thoát dấu nháy — nên tuyệt
  // đối không nhét chuỗi từ server vào GIÁ TRỊ THUỘC TÍNH. Gắn nút theo CHỈ SỐ
  // (số do chính mình sinh ra, không cần thoát gì) rồi tra ngược trong
  // `_khActiveDefs` — cùng khuôn đã dùng cho nhiệm vụ kênh liên lạc bên dưới.
  function khStepRow(step,idx,done,isNext){
    return '<div class="kh-step'+(done?' done':isNext?' next':'')+'">'
      +'<div class="kh-num">'+(done?'✓':(idx+1))+'</div>'
      +'<div class="kh-body"><div class="kh-t">'+esc(step.title)+'</div>'
      +(done?'':'<div class="kh-d">'+esc(step.desc)+'</div>')+'</div>'
      +(done?'':'<button class="kh-go" type="button" data-i="'+idx+'">'+esc(step.cta)+'</button>')
      +'</div>';
  }

  function wireKhSteps(host){
    var btns=host.querySelectorAll('.kh-go');
    for(var i=0;i<btns.length;i++) btns[i].onclick=khStepClick;
  }

  /* Bấm bước nào làm đúng việc đó NGAY TẠI TRANG — không đá người ta sang nơi
     khác để làm đúng việc đang có sẵn ở đây (chỗ rơi rẻ nhất). Dùng chung cho
     CẢ khách vô danh lẫn thành viên: hành vi bấm giống hệt nhau, chỉ khác ai
     đang tra bằng chứng (máy hay server). */
  function khStepClick(){
    var s=_khActiveDefs[+this.getAttribute('data-i')]; if(!s) return;
    if(s.key==='lap_la_so'){
      var b=el('tmeEdit');
      if(b){ try{ b.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){} b.click(); }
      return;
    }
    if(s.key==='hoi_thay'){
      try{
        // Có lá số → mở rail để họ tự gõ câu hỏi (đúng cta "Hỏi ngay"). Chưa có
        // lá số thì rail im lặng không có gì để bắt chuyện — mồi bằng
        // `Shell.ask`, cùng lối `todayAsk` đã dùng phía trên.
        if(_hasBirth){ Shell.openRail(); var ta=document.getElementById('railInput'); if(ta) ta.focus(); }
        else Shell.ask('Hôm nay là ngày gì, tôi nên làm gì và tránh gì?');
      }catch(e){}
      return;
    }
    if(s.key==='mo_thu_cong_cu'){ try{ location.href=s.href||'/cong-cu'; }catch(e){} }
  }

  function renderKhoiHanh(d){
    var host=el('khoiHanhCard'); if(!host) return;
    var kh=d.khoiHanh; if(!kh){ khHide(); return; }
    if(kh.justGranted) _khGot+=(+kh.credits||0);
    // Badge nhắc trên sidebar (public/shell.js) đọc đúng cờ này — không gọi
    // riêng một API cho mọi trang /app, chỉ đọc lại thứ trang chủ vừa biết.
    try{ localStorage.setItem('tvp_kh_pending', kh.claimed?'0':'1'); }catch(e){}
    // Thưởng đã vào ví → biến mất hẳn. Giữ lại một thẻ toàn dấu tích là chiếm
    // chỗ vĩnh viễn trên màn hình đầu để khoe một việc đã cũ.
    if(kh.claimed){ khHide(); return; }

    _khSteps=kh.steps||[]; _khActiveDefs=_khSteps;
    var done=0; for(var i=0;i<_khSteps.length;i++) if(_khSteps[i].done) done++;

    var h='<div class="kh-card"><div class="kh-eyebrow">Khởi Hành</div>'
      +'<div class="kh-h">3 bước đầu tiên trên Luận Đường</div>'
      +'<div class="kh-sub">Làm xong cả ba, nhận thẳng <b>+'+(+kh.credits||15)+' Lượng</b> vào ví — đủ cho một lượt luận tiếp theo.</div>'
      +khBarHtml(done,_khSteps.length);
    if(_khGot>0) h+='<div class="kh-got">✓ Vừa cộng <b>+'+_khGot+' Lượng</b> vào ví bạn.</div>';
    h+='<div class="kh-steps">';
    var seenNext=false;
    for(var j=0;j<_khSteps.length;j++){
      var s=_khSteps[j], isNext=!s.done&&!seenNext; if(isNext) seenNext=true;
      h+=khStepRow(s,j,s.done,isNext);
    }
    h+='</div></div>';
    host.innerHTML=h;
    host.style.display='';
    khShown(host);
    wireKhSteps(host);
  }

  /* Bản KHÁCH VÔ DANH — không gọi `onboarding-sync` (chưa có token để gọi),
     dựng từ `_khGuestDefs` (tĩnh, tải một lần) + tiến độ máy. */
  /* Thẻ này khởi đầu bằng KHUNG CHỜ (xem markup #khoiHanhCard), nên mọi đường
     "không dựng được" phải ẩn tay — bỏ quên một đường là khung chờ nhấp nháy
     vĩnh viễn ở giữa trang. */
  function khHide(){
    var h=el('khoiHanhCard'); if(!h) return;
    h.style.display='none'; h.classList.remove('kh-skel');
    h.removeAttribute('aria-busy'); h.removeAttribute('aria-label');
  }
  function khShown(host){
    host.classList.remove('kh-skel');
    host.removeAttribute('aria-busy'); host.removeAttribute('aria-label');
  }

  function renderKhoiHanhGuest(){
    var host=el('khoiHanhCard'); if(!host) return;
    if(!_khGuestDefs||!_khGuestDefs.length){
      // Lượt đầu: thử nạp lại. Lượt sau vẫn hụt ⇒ ẩn hẳn, KHÔNG bịa nội dung.
      if(!_khDefsRetried){ _khDefsRetried=true; loadKhoiHanhDefs().then(renderKhoiHanhGuest); }
      else khHide();
      return;
    }
    _khActiveDefs=_khGuestDefs;
    var flags=localKhoiHanhFlags();
    var done=0; for(var i=0;i<flags.length;i++) if(flags[i]) done++;
    var allDone=done===_khGuestDefs.length;

    var h='<div class="kh-card"><div class="kh-eyebrow">Khởi Hành</div>'
      +'<div class="kh-h">3 bước đầu tiên trên Luận Đường</div>'
      +'<div class="kh-sub">Làm xong cả ba, mở khoá <b>+'+_khGuestCredits+' Lượng</b> — nhận được ngay khi bạn tạo tài khoản.</div>'
      +khBarHtml(done,_khGuestDefs.length)+'<div class="kh-steps">';
    var seenNext=false;
    for(var j=0;j<_khGuestDefs.length;j++){
      var d2=_khGuestDefs[j], done2=flags[j], isNext=!done2&&!seenNext; if(isNext) seenNext=true;
      h+=khStepRow(d2,j,done2,isNext);
    }
    h+='</div>';

    var guestTxt=allDone
      ? 'Bạn đã xong <b>cả 3 bước</b> — tạo tài khoản để nhận ngay <b>+'+_khGuestCredits+' Lượng</b>'+(_signupBonusTxt?(' + '+esc(_signupBonusTxt)):'')+'.'
      : 'Đã xong <b>'+done+'/'+_khGuestDefs.length+'</b> bước. Tạo tài khoản để giữ tiến độ này và nhận Lượng khi làm xong.';
    h+='<div class="kh-guest"><div class="kh-guest-txt">'+guestTxt+'</div>'
      +'<button class="kh-guest-btn" type="button" id="khGuestSignup">Tạo tài khoản</button></div></div>';
    host.innerHTML=h;
    host.style.display='';
    khShown(host);
    wireKhSteps(host);
    var b=el('khGuestSignup');
    if(b) b.onclick=function(){
      try{ window.Track&&Track.event('cta_click',{tool_id:'home',meta:{from:'khoi_hanh_guest'}}); }catch(e){}

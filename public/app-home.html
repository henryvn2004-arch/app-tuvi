      try{ if(window.Auth&&Auth.require){ Auth.require(function(){ location.reload(); }); return; } }catch(e){}
      location.href='/topup.html';
    };
  }

  /* ══ KÊNH LIÊN LẠC — 2 nhiệm vụ cũ của M3, tầng riêng ═══════════════════
     Bật thông báo · liên kết chat: KHÔNG đổi bằng chứng/mức thưởng, chỉ tách
     ra khỏi Khởi Hành (đây là kênh nhắc, không phải bước làm quen sản phẩm) và
     CHỈ hiện cho người đã đăng nhập — khách vãng lai chưa có ví để mà cộng. */
  var _chGot=0, _chDefs=[];

  function renderChannels(d){
    var host=el('channelCard'); if(!host) return;
    var ch=d.channels;
    if(!ch||!ch.tasks||!ch.tasks.length||ch.tasks.every(function(t){return t.done;})){
      host.style.display='none'; return;
    }
    _chDefs=ch.tasks;
    var got=0; for(var i=0;i<ch.tasks.length;i++) if(ch.tasks[i].justGranted) got+=(+ch.tasks[i].credits||0);
    _chGot+=got;

    var h='<div class="ch-card"><div class="ch-h">Kênh liên lạc — nhận thêm Lượng</div>';
    if(_chGot>0) h+='<div class="kh-got">✓ Vừa cộng <b>+'+_chGot+' Lượng</b> vào ví bạn.</div>';
    h+='<div class="ch-list">';
    for(var j=0;j<ch.tasks.length;j++){
      var t=ch.tasks[j];
      h+='<div class="ch-row'+(t.done?' done':'')+'" data-row="'+j+'"><div class="ch-tick"></div>'
       + '<div class="ch-body"><div class="ch-t">'+esc(t.title)+'</div>'
       + (t.done?'':'<div class="ch-d">'+esc(t.desc)+'</div>')+'</div>'
       + '<div class="ch-pay"><div class="ch-amt">'+(t.done?'+':'')+(+t.credits||0)+' Lượng</div>'
       + (t.done?'':'<button class="ch-go" type="button" data-i="'+j+'">'+esc(t.cta)+'</button>')
       + '</div></div>';
    }
    h+='</div></div>';
    host.innerHTML=h;
    host.style.display='';

    var btns=host.querySelectorAll('.ch-go');
    for(var k=0;k<btns.length;k++) btns[k].onclick=chGo;
  }

  function chGo(){
    var t=_chDefs[+this.getAttribute('data-i')]; if(!t) return;
    var key=t.key, href=t.href||'';
    if(href){ try{ location.href=href; }catch(e){} return; }
    if(key==='bat_thong_bao'){
      var nam=(_birth&&+_birth.year)||0, cc=_canChiNam;
      // 🔴 Bản trước gọi `askPushPermission` — hàm của ĐƯỜNG TỰ MỜI, trả
      // `undefined` ở mọi nhánh và im lặng bỏ qua khi iOS tab thường / vừa hỏi
      // trong 30 ngày / đã bị chặn. Nay gọi `enablePushNow` (trả trạng thái) và
      // bắt buộc nói lại một câu cho MỌI ngả.
      function ask(){
        if(!window.enablePushNow) return chNote(this_i,'err','Chưa nạp được phần thông báo. Tải lại trang rồi thử lại giúp tôi.');
        chNote(this_i,'wait','Đang bật…');
        window.enablePushNow(nam,cc).then(function(st){
          chNote(this_i,PUSH_NOTE[st]?PUSH_NOTE[st][0]:'err',(PUSH_NOTE[st]||PUSH_NOTE.error)[1]);
          if(st==='granted'||st==='already') setTimeout(function(){ khSync(); },1200);
        }).catch(function(){ chNote(this_i,'err',PUSH_NOTE.error[1]); });
      }
      var this_i=+this.getAttribute('data-i');
      if(window.enablePushNow) return ask();
      var s=document.createElement('script');
      s.src='/pwa-push.js?v=3'; s.onload=ask;
      s.onerror=function(){ chNote(this_i,'err','Không tải được phần thông báo. Thử lại sau giúp tôi.'); };
      document.head.appendChild(s);
    }
  }

  /* Câu trả lời cho từng ngả của `enablePushNow`. Viết ở đây chứ không nhét vào
     pwa-push.js: đó là module KỸ THUẬT (đăng ký/huỷ đăng ký), còn đây là chữ
     người dùng đọc — trộn vào nhau thì sau này sửa câu chữ phải đụng module. */
  var PUSH_NOTE={
    granted:['ok','Đã bật. Mai 7h sáng sẽ có tin đầu tiên.'],
    already:['ok','Máy này đã bật từ trước — vừa gắn vào tài khoản của bạn.'],
    denied:['err','Trình duyệt đang CHẶN thông báo của trang này. Mở phần cài đặt trang (biểu tượng bên trái thanh địa chỉ) → bật lại Thông báo, rồi bấm lại nút này.'],
    dismissed:['err','Bạn chưa chọn gì ở hộp xin quyền. Bấm lại rồi chọn "Cho phép" giúp tôi.'],
    // Ca của Henry. Đây KHÔNG phải lỗi của trang: Apple chỉ mở Web Push cho
    // trang đã thêm vào Màn hình chính (iOS 16.4+), tab Safari thường thì
    // `Notification` còn không tồn tại. Nói thẳng ra cùng đúng ba bước bấm.
    // ⚠️ Câu này phải khớp `start_url` của manifest (`/?utm_source=pwa`) — mở
    // biểu tượng vừa thêm là về TRANG CHỦ, không về thẳng Luận Đường. Bỏ bước
    // "vào Luận Đường" là dẫn người ta tới một trang không có nút này.
    'ios-need-install':['err','iPhone/iPad chỉ cho bật thông báo khi trang đã nằm ở Màn hình chính. Bấm nút Chia sẻ ở thanh dưới Safari → "Thêm vào MH chính" → mở biểu tượng vừa thêm → vào Luận Đường → bấm lại nút này.'],
    unsupported:['err','Trình duyệt này không hỗ trợ thông báo. Thử bằng Chrome trên Android hoặc máy tính.'],
    error:['err','Chưa bật được. Thử lại sau ít phút giúp tôi.']
  };

  /* Dán câu trả lời vào ĐÚNG hàng nhiệm vụ vừa bấm — không dùng alert (chặn cả
     trang) cũng không dùng toast (trôi mất trong khi câu hướng dẫn iOS dài 3
     bước, người ta cần đọc lại được trong lúc thao tác). */
  function chNote(i,kind,msg){
    var host=el('channelCard'); if(!host) return;
    var row=host.querySelector('.ch-row[data-row="'+i+'"]'); if(!row) return;
    var n=row.querySelector('.ch-note');
    if(!n){ n=document.createElement('div'); n.className='ch-note'; (row.querySelector('.ch-body')||row).appendChild(n); }
    n.className='ch-note '+kind;
    n.textContent=msg;
  }

  /* Điểm vào DUY NHẤT: quyết định vẽ bản khách vô danh hay hỏi server, tuỳ có
     token hay không. Gọi lại được nhiều lần (đổi tab, vừa lưu lá số…).

     🔑 Khởi Hành/Kênh liên lạc đã CHUYỂN HẲN sang tab "Nhiệm Vụ"
     (/app/tai-khoan, account-core.js) — #khoiHanhCard/#channelCard không còn
     trong HTML của trang này. Chặn ngay từ đầu thay vì để mọi hàm render*
     bên dưới lặng lẽ no-op (chúng đều tự `if(!host) return`): thiếu dòng này
     thì mỗi lượt vào /app vẫn bắn một POST onboarding-sync vô ích. */
  function khSync(){
    if(!el('khoiHanhCard')&&!el('channelCard')) return;
    var tk=khToken();
    if(!tk){
      renderKhoiHanhGuest();
      var ch=el('channelCard'); if(ch) ch.style.display='none'; // chưa có ví, chưa có gì để cộng
      return;
    }
    if(_khBusy) return;
    _khBusy=true; _khLast=Date.now();
    fetch('/api/payment?action=onboarding-sync',{method:'POST',headers:{Authorization:'Bearer '+tk}})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(d){ if(d){ renderKhoiHanh(d); renderChannels(d); } })
      .catch(function(){ khHide(); /* hỏng thì thẻ không hiện — không chặn gì của trang */ })
      .then(function(){ _khBusy=false; });
  }

  /* Quay lại tab thì đồng bộ lại — đây mới là ca thường gặp nhất: bấm "Liên
     kết" → sang profile → nối Telegram → quay về. Không có bước này thì nhiệm
     vụ vẫn hiện là chưa làm cho tới lần tải trang sau. Chặn 20 giây để đổi tab
     qua lại không thành một tràng gọi API. */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&Date.now()-_khLast>20000) khSync();
  });

  // Định nghĩa bậc 0 + câu quà đăng ký không cần chờ auth — tải song song ngay
  // từ đầu để có sẵn khi `khSync()` chạy lượt đầu (1200ms, xem run()). Cùng
  // guard với `khSync()` ở trên: không có host thì khỏi tải, đỡ 2 lượt mạng
  // vô ích mỗi lần vào /app.
  if(el('khoiHanhCard')||el('channelCard')){
    loadKhoiHanhDefs();
    loadSignupBonusTxt();
  }

  // Chạy SAU khi shell.boot() render rail (boot hoãn tới DOMContentLoaded).
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
})();
</script>

<script>
/* ══ CHÀO DẪN — coachmark một lần cho Tổng Quan ═════════════════════════════
   KHÔNG phải modal ép xem: 90% người chạy tool là khách vô danh, phần lớn chỉ
   có ĐÚNG một lượt (docs/QUEST-PLAN.md §2.1/§2.2) — ép xem nhiều bước giải
   thích UI trước khi cho thấy giá trị là đốt đúng vài giây quý giá đó vào thứ
   không ai cần đọc hai lần. Từng điểm dừng bỏ qua được bất cứ lúc nào, cả
   chuỗi hiện ĐÚNG MỘT LẦN (localStorage). KHÔNG chặn thao tác khác của trang —
   không có lớp phủ riêng, độ tối quanh điểm sáng là một CHIÊU CSS (box-shadow
   lan ra hết màn hình của `.tour-spot`, xem shell CSS phía trên) chứ không
   phải một phần tử `pointer-events` chặn click; `.tour-spot` tự đặt
   `pointer-events:none`.

   🔑 Đi hết một lượt các mặt của sản phẩm (không chỉ Khởi Hành): hỏi Thầy ở
   rail, tìm công cụ qua Ctrl K, chia sẻ, Ví Lượng — tất cả đều là CHROME CỐ
   ĐỊNH của shell.js nên có mặt trên mọi trang /app/*, script này chỉ cần nạp
   Ở Tổng Quan là đủ chỉ hết. Bước "Đăng ký" CHỈ thêm cho khách vô danh — ép nó
   vào cho người đã có tài khoản là một bước rỗng, không trỏ tới gì thật. */
(function(){
  'use strict';
  if(navigator.webdriver) return; // đừng dựng overlay khi Playwright/CI lái trang

  // v2: đổi từ 3 điểm (Khởi Hành/Ví/gợi ý tiếp) sang đi hết các mặt chính của
  // sản phẩm — bump khoá để người đã tắt bản v1 vẫn thấy bản đầy đủ một lần.
  var TOUR_KEY='tvp_tour_seen_v2';

  function isLoggedIn(){
    try{ var s=window.Auth&&Auth.getSession&&Auth.getSession(); return !!(s&&s.access_token); }
    catch(e){ return false; }
  }

  var STEPS=[
    {
      // Khởi Hành đã chuyển sang tab "Nhiệm Vụ" trong Tài khoản (không còn
      // #khoiHanhCard ở /app) — neo THẲNG vào nút mở tab đó, đúng nơi bấm
      // được thật, thay vì trỏ vào một khối không còn tồn tại.
      sel:'.tab-home-btn',
      t:'Đây là đường về Luận Đường',
      d:'Bấm vào đây từ BẤT KỲ đâu để quay lại màn hình này. Mở khoá Lượng ở tab Tài khoản → Nhiệm Vụ: lập lá số, hỏi Thầy một câu, thử một công cụ.'
    },
    {
      sel:'#railInput',
      t:'Hỏi Thầy ngay tại đây',
      d:'Gõ bất kỳ điều gì đang canh cánh — tình duyên, sự nghiệp, hôm nay nên làm gì — rồi Enter là gửi. Cần lập lá số (bước trước) để mở khoá ô này.'
    },
    {
      sel:'.kbtn[data-act="cmd"]',
      t:'58 công cụ chỉ cách một phím',
      d:'Bấm vào đây hoặc gõ Ctrl K để tìm nhanh: xem tuổi, hợp hôn nhân, vận từng tháng… Mỗi công cụ soi lá số của bạn theo một góc khác.'
    },
    {
      sel:'[data-act="share"]',
      t:'Thấy hay thì rủ bạn xem cùng',
      d:'Chia sẻ nguyên phiên luận qua link, Facebook hay Zalo — bạn bè bấm vào đọc được ngay, không cần đăng nhập.'
    },
    {
      sel:'a.item[href="/app/tai-khoan#credits"]',
      t:'Đây là Ví Lượng của bạn',
      d:'Mỗi lượt hỏi Thầy hay mở khoá một bản luận đều dùng Lượng ở đây. Số dư hiện ngay cạnh tên bạn — hết thì bấm vào, có nút Nạp Lượng ngay trong đó.'
    }
  ];
  if(!isLoggedIn()){
    STEPS.push({
      sel:'a.sb-foot',
      t:'Đăng ký miễn phí, nhận Lượng ngay',
      d:'Không cần thẻ, không cần chờ — có tài khoản là được tặng Lượng để hỏi tiếp, và mọi lá số/lượt hỏi hôm nay được lưu lại đúng chỗ.'
    });
  }
  STEPS.push({
    sel:'#nextCard .nx-main',
    t:'Thầy đã chọn sẵn cho bạn',
    d:'Dựa trên những gì bạn vừa xem, đây là công cụ hợp để thử tiếp theo. Bấm vào xem Thầy nói gì.'
  });

  function seen(){ try{ return localStorage.getItem(TOUR_KEY)==='1'; }catch(e){ return true; } }
  function markSeen(){ try{ localStorage.setItem(TOUR_KEY,'1'); }catch(e){} }
  function esc2(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Vùng NHÌN THẤY THẬT. `window.innerHeight` trên iOS Safari tính cả dải nằm
  // SAU thanh công cụ dưới cùng của trình duyệt, nên đặt trong innerHeight vẫn
  // có thể bị thanh đó che. `visualViewport` mới là con số người dùng thấy.
  function viewport(){
    var vv=window.visualViewport;
    return vv ? {top:vv.offsetTop, left:vv.offsetLeft, h:vv.height, w:vv.width}
              : {top:0, left:0, h:window.innerHeight, w:window.innerWidth};
  }

  // `offsetParent===null` bắt cả "không tồn tại" lẫn "tồn tại nhưng
  // display:none" (Khởi Hành chưa kịp dựng, hoặc bị ẩn vì đã xong) — coi cả
  // hai là CHƯA CÓ, đừng chỉ vào một khối vô hình. Dùng cho `onResize()`: bước
  // ĐANG MỞ rồi thì đừng đóng tour giữa chừng chỉ vì một lượt resize đẩy neo ra
  // khỏi khung nhìn tạm thời (vd bàn phím mobile đóng/mở) — `place()` tự kẹp
  // popup vào khung nhìn, không cần huỷ bước.
  function findTarget(sel){
    var e=document.querySelector(sel);
    return (e && e.offsetParent!==null) ? e : null;
  }

  // Soát CHẶT HƠN — dùng khi QUYẾT ĐỊNH có mở một bước MỚI hay không (`step()`
  // và lượt quét `any` trong `start()`). `offsetParent!==null` chỉ bắt
  // display:none, KHÔNG bắt sidebar/rail đóng bằng
  // `transform:translateX(-100%)` trên mobile — neo vẫn "có" trong layout
  // nhưng nằm hẳn ngoài màn hình bên trái, và (khác kiểu cuộn dọc quá tầm)
  // `scrollIntoView` trong `place()` KHÔNG kéo nó vào được vì nó là
  // `position:fixed` bị dịch, không phải bị cuộn qua. Kết quả nếu không chặn ở
  // đây: vòng sáng chỉ vào chỗ không ai thấy, tooltip nổi lơ lửng không dính
  // gì tới nút nào (bug mobile 2026-09, ảnh chụp step "Đăng ký"/"Ví Lượng" —
  // cả hai đều neo bên trong sidebar). Bước nào neo trong drawer đang đóng thì
  // bỏ qua, y hệt cách bỏ qua bước chưa dựng kịp.
  function findVisibleTarget(sel){
    var e=findTarget(sel);
    if(!e) return null;
    var r=e.getBoundingClientRect();
    if(r.width<=0&&r.height<=0) return null;
    var vp=viewport();
    if(r.right<=vp.left||r.bottom<=vp.top||r.left>=vp.left+vp.w||r.top>=vp.top+vp.h) return null;
    return e;
  }

  var _i=-1, _spot=null, _pop=null, _scrolled=false;

  function place(target,data,isLast){
    var pad=6;

    _pop.innerHTML='<div class="tour-step">Bước '+(_i+1)+'/'+STEPS.length+'</div>'
      +'<div class="tour-t">'+esc2(data.t)+'</div>'
      +'<div class="tour-d">'+esc2(data.d)+'</div>'
      +'<div class="tour-row"><button class="tour-skip" type="button" id="tourSkip">Bỏ qua</button>'
      +'<button class="tour-next" type="button" id="tourNext">'+(isLast?'Đã hiểu, khám phá thôi':'Tiếp →')+'</button></div>';

    // 🪤 findTarget() chỉ đòi phần tử CÓ TRONG LAYOUT, KHÔNG đòi nó trong tầm
    // nhìn. Neo nằm ngoài màn thì (a) vòng sáng chỉ vào chỗ không ai thấy, và
    // (b) popup bị đẩy ra theo. Kéo neo vào giữa màn trước đã. `_scrolled` để
    // scrollIntoView (sinh sự kiện scroll → onResize → place) không tự gọi lại
    // chính nó thành vòng lặp.
    var vp0=viewport(), r0=target.getBoundingClientRect();
    if(!_scrolled && (r0.top<vp0.top || r0.bottom>vp0.top+vp0.h)){
      _scrolled=true;
      try{ target.scrollIntoView({block:'center',behavior:'auto'}); }catch(e){ try{ target.scrollIntoView(); }catch(e2){} }
    }

    function position(){
      var vp=viewport(), r=target.getBoundingClientRect();
      _spot.style.left=(r.left-pad)+'px';
      _spot.style.top=(r.top-pad)+'px';
      _spot.style.width=(r.width+pad*2)+'px';
      _spot.style.height=(r.height+pad*2)+'px';

      // Popup cao hơn cả vùng nhìn thấy thì cho nó tự cuộn bên trong — thà đọc
      // phải cuộn còn hơn nút bấm nằm ngoài màn.
      _pop.style.maxHeight=Math.max(120,vp.h-20)+'px';

      var popH=_pop.offsetHeight||160, popW=_pop.offsetWidth||290;
      var top=r.bottom+14;
      if(top+popH>vp.top+vp.h-10) top=r.top-14-popH;   // hết chỗ dưới → đặt lên trên
      // 🔴 KẸP CỨNG vào vùng nhìn thấy. Bản trước thiếu đúng bước này: chọn
      // xong trên/dưới là gán thẳng, nên neo nằm dưới mép màn thì popup văng
      // theo và NÚT "Bỏ qua"/"Tiếp" ra ngoài màn — người dùng kẹt trong tour,
      // không còn đường thoát. Đo được: neo ở 1072px trên màn 844 → nút nằm
      // dưới đáy 204px.
      var minTop=vp.top+10, maxTop=vp.top+vp.h-popH-10;
      if(maxTop<minTop) maxTop=minTop;
      _pop.style.top=Math.min(Math.max(top,minTop),maxTop)+'px';

      var minLeft=vp.left+12, maxLeft=vp.left+vp.w-popW-12;
      if(maxLeft<minLeft) maxLeft=minLeft;
      _pop.style.left=Math.min(Math.max(r.left,minLeft),maxLeft)+'px';
    }

    position();
    // Đo lại ở khung hình sau: webfont/ảnh đáp xuống muộn làm popup CAO HƠN lúc
    // đo đầu, mà lúc đó phép kẹp đã tính theo chiều cao cũ.
    if(window.requestAnimationFrame) requestAnimationFrame(position);

    document.getElementById('tourSkip').onclick=finish;
    document.getElementById('tourNext').onclick=function(){ step(_i+1); };
  }

  function step(i){
    if(i>=STEPS.length){ finish(); return; }
    var data=STEPS[i], target=findVisibleTarget(data.sel);
    if(!target){ step(i+1); return; } // chưa dựng kịp HOẶC đang nằm trong drawer đóng → bỏ qua bước đó, đừng đứng khựng
    _i=i; _scrolled=false;
    place(target,data,i===STEPS.length-1);
  }

  function finish(){
    markSeen();
    if(_spot){ _spot.remove(); _spot=null; }
    if(_pop){ _pop.remove(); _pop=null; }
    bindWatchers(false);
  }

  // 🪤 Trang /app cuộn trong #ws chứ không cuộn window → phải nghe 'scroll' ở
  // pha CAPTURE trên document, gắn vào window là không bao giờ nổ (bẫy đã ghi
  // trong CLAUDE.md). visualViewport đổi khi thanh công cụ iOS thu/giãn — không
  // nghe thì popup đứng yên trong lúc vùng nhìn thấy co lại quanh nó.
  function bindWatchers(on){
    var m=on?'addEventListener':'removeEventListener';
    window[m]('resize',onResize);
    document[m]('scroll',onResize,true);
    if(window.visualViewport){ window.visualViewport[m]('resize',onResize); window.visualViewport[m]('scroll',onResize); }
    document[m]('keydown',onKey);
  }

  // Đường thoát cuối: Esc luôn đóng được tour, kể cả khi vì lý do nào đó nút
  // vẫn không bấm tới. Rẻ, và đúng thứ đã thiếu lúc Henry bị kẹt.
  function onKey(e){ if(e.key==='Escape'||e.keyCode===27) finish(); }

  function onResize(){
    if(_i<0||_i>=STEPS.length) return;
    var data=STEPS[_i], target=findTarget(data.sel);
    if(target) place(target,data,_i===STEPS.length-1); else finish();
  }

  function start(){
    if(seen()) return;
    // Không bước nào có điểm neo (trang lỗi, hoặc các khối cùng chưa kịp
    // dựng) → đừng tạo một overlay không trỏ vào đâu cả.
    var any=false;
    for(var k=0;k<STEPS.length;k++) if(findVisibleTarget(STEPS[k].sel)){ any=true; break; }
    if(!any) return;

    _spot=document.createElement('div'); _spot.className='tour-spot';
    _pop=document.createElement('div'); _pop.className='tour-pop';
    document.body.appendChild(_spot);
    document.body.appendChild(_pop);
    bindWatchers(true);
    step(0);
  }

  // Chờ các khối khác dựng xong (Khởi Hành ~1200ms sau boot, nextCard cần
  // ToolPrices tải xong) trước khi tìm điểm neo — đủ trễ để phần tử đích tồn
  // tại, đủ sớm để không lỡ mất khoảnh khắc tò mò đầu tiên của trang.
  setTimeout(start,2400);
})();
</script>
</body>
</html>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#061A2E;--navy-mid:#0D3B5E;--blue:#1455A4;
  --gold:#9A7B3A;--gold-lt:#F9F4EB;--gold-bright:#c9a84c;
  --text:#1a1a1a;--text-mid:#444;--text-lt:#777;
  --border:#CCCCCC;--border-lt:#E8E8E8;
  --bg:#FFFFFF;--bg-soft:#FAFAF8;
  --green:#1E6B3C;
}
html,body{height:100%;overflow:hidden;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── Page wrapper ── */
.tc-page{height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Hero ── */
.tc-hero{
  background:var(--navy);
  padding:14px 20px;
  display:flex;align-items:center;gap:14px;
  flex-shrink:0;
}
.tc-hero-icon{
  width:36px;height:36px;
  background:rgba(201,168,76,.15);
  border:1px solid rgba(201,168,76,.35);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.tc-hero-title{font-size:17px;font-weight:700;color:#fff;font-family:'Noto Serif',Georgia,serif;line-height:1.2}
.tc-hero-sub{font-size:11px;color:#8BAACC;margin-top:2px}

/* ── Form bar ── */
.tc-form-bar{
  background:var(--gold-lt);
  border-bottom:1px solid #e8d9b0;
  padding:12px 20px;
  flex-shrink:0;
}
.tc-form-label{
  font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--gold);margin-bottom:10px;
}
.tc-form-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.tc-form-group{display:flex;flex-direction:column;gap:4px}
.tc-form-lbl{font-size:9px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--text-lt)}
.tc-form-input{
  background:#fff;border:1px solid var(--border);border-radius:6px;
  padding:7px 10px;font-size:14px;color:var(--text);
  font-family:Arial,sans-serif;outline:none;
  transition:border-color .15s;
  -webkit-appearance:none;
}
.tc-form-input:focus{border-color:var(--navy)}
.tc-input-num{width:70px}
.tc-input-select{width:auto;cursor:pointer}
.tc-form-sep{font-size:16px;color:var(--border);padding-bottom:6px;flex-shrink:0}
.tc-btn-an-sao{
  background:var(--navy);color:#c9a84c;
  border:none;border-radius:7px;
  padding:8px 18px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:Arial,sans-serif;
  transition:background .15s,transform .1s;
  flex-shrink:0;
  align-self:flex-end;
}
.tc-btn-an-sao:hover{background:var(--navy-mid);transform:translateY(-1px)}

/* ── Lá số summary bar (replaces form after an sao) ── */
.tc-laso-bar{
  background:var(--gold-lt);
  border-bottom:1px solid #e8d9b0;
  padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-shrink:0;
}
.tc-laso-chip{
  display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--navy);font-weight:600;
}
.tc-laso-chip-dot{
  width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;
}
.tc-btn-reset{
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:4px 11px;font-size:11px;color:var(--text-lt);
  cursor:pointer;font-family:Arial,sans-serif;
  transition:border-color .15s,color .15s;
  flex-shrink:0;
  white-space:nowrap;
}
.tc-btn-reset:hover{border-color:var(--navy);color:var(--navy)}

/* ── Chat area ── */
.tc-chat-area{
  flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
.tc-messages{
  flex:1;overflow-y:auto;padding:20px 20px 8px;
  display:flex;flex-direction:column;gap:0;
  min-height:0;
}
.tc-messages::-webkit-scrollbar{width:4px}
.tc-messages::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

/* ── Message rows ── */
.tc-msg{
  display:flex;gap:10px;align-items:flex-end;
  margin-bottom:14px;
  animation:tc-in .18s ease;
}
@keyframes tc-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tc-msg.user{flex-direction:row-reverse}
.tc-av{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;flex-shrink:0;
}
.tc-msg.bot  .tc-av{background:transparent}
.tc-msg.user .tc-av{background:var(--blue);color:#fff}
.tc-bub{
  max-width:72%;padding:10px 14px;font-size:14px;
  line-height:1.75;border-radius:14px;position:relative;
}
.tc-msg.bot  .tc-bub{background:#fff;color:var(--text);border:1px solid var(--border-lt);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tc-msg.user .tc-bub{background:var(--navy);color:#F9F4EB;border-bottom-right-radius:4px}

/* typing dots */
.tc-msg.typing .tc-bub{display:flex;gap:5px;align-items:center;padding:14px 16px}
.tc-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:tc-bounce 1.2s infinite}
.tc-dot:nth-child(2){animation-delay:.18s}
.tc-dot:nth-child(3){animation-delay:.36s}
@keyframes tc-bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* ── Suggestions ── */
.tc-suggs{
  padding:8px 20px 0;
  display:flex;flex-wrap:wrap;gap:7px;
  flex-shrink:0;
}
.tc-sug{
  background:var(--bg-soft);border:1px solid var(--border-lt);
  border-radius:16px;padding:5px 13px;
  font-size:12px;color:var(--blue);
  cursor:pointer;font-family:Arial,sans-serif;
  transition:all .13s;line-height:1.4;
}
.tc-sug:hover{background:#EBF3FF;border-color:var(--blue)}

/* ── Input bar ── */
.tc-input-bar{
  padding:10px 20px 14px;
  border-top:1px solid var(--border-lt);
  display:flex;gap:10px;align-items:flex-end;
  flex-shrink:0;background:var(--bg);
}
.tc-textarea{
  flex:1;border:1.5px solid var(--border);border-radius:9px;
  padding:9px 12px;font-size:14px;font-family:Arial,sans-serif;
  line-height:1.5;resize:none;max-height:110px;overflow-y:auto;
  background:var(--bg-soft);color:var(--text);
  outline:none;transition:border-color .15s;
}
.tc-textarea:focus{border-color:var(--navy);background:#fff}
.tc-textarea::placeholder{color:#bbb}
.tc-send{
  width:38px;height:38px;border-radius:9px;
  background:var(--navy);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .1s;
}
.tc-send:hover:not(:disabled){background:var(--navy-mid);transform:scale(1.05)}
.tc-send:disabled{background:#C4C4C4;cursor:not-allowed;transform:none}
.tc-hint{
  text-align:center;font-size:10px;color:#C4C4C4;
  padding:0 20px 8px;letter-spacing:.3px;flex-shrink:0;
}

@media(max-width:640px){
  .tc-bub{max-width:85%;font-size:13.5px}
  .tc-form-row{gap:8px}
  .tc-input-num{width:60px}
  .tc-hero{padding:10px 16px}
  .tc-form-bar,.tc-laso-bar{padding:10px 16px}
  .tc-messages{padding:16px 16px 6px}
  .tc-input-bar{padding:8px 16px 12px}
  .tc-suggs{padding:6px 16px 0}
}
</style>
</head>
<body>

<div class="tc-page">

  <!-- Nav rendered by nav.js -->
  <div id="site-nav"></div>

  <!-- Hero strip -->
  <div class="tc-hero">
    <div class="tc-hero-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div>
      <div class="tc-hero-title">Tử Vi Chat</div>
      <div class="tc-hero-sub">An sao · Luận giải từng cung · Xem vận hạn — tất cả trong một chat</div>
    </div>
  </div>

  <!-- Birth date form bar -->
  <div class="tc-form-bar" id="tc-form-bar">
    <div class="tc-form-label">Nhập ngày sinh dương lịch để an sao</div>
    <div class="tc-form-row">
      <div class="tc-form-group">
        <span class="tc-form-lbl">Ngày</span>
        <input class="tc-form-input tc-input-num" type="number" id="tc-ngay" min="1" max="31" placeholder="3">
      </div>
      <span class="tc-form-sep">/</span>
      <div class="tc-form-group">
        <span class="tc-form-lbl">Tháng</span>
        <input class="tc-form-input tc-input-num" type="number" id="tc-thang" min="1" max="12" placeholder="6">
      </div>
      <span class="tc-form-sep">/</span>
      <div class="tc-form-group">

          <option value="6">Ngọ (11h–13h)</option>
          <option value="7">Mùi (13h–15h)</option>
          <option value="8">Thân (15h–17h)</option>
          <option value="9">Dậu (17h–19h)</option>

      <div class="tc-form-group">
        <span class="tc-form-lbl">Giới tính</span>

  <!-- Lá số summary bar (shown after an sao) -->

  <!-- Chat area -->

</div>

<script src="/nav.js?v=14"></script>
<script>
(function () {
  'use strict';

  var CHI      = ['Tý','Sửu','Dần','Mão','Thìn','Tỵ','Ngọ','Mùi','Thân','Dậu','Tuất','Hợi'];
  var NAM_XEM  = 2027;
  var API_PATH = '/api/lasotuvi?action=chat';

  var _lasoData = null;
  var _msgs     = [];
  var _busy     = false;

  var $msgs, $suggs, $ta, $send;

  // ─── Slim laso for API (same logic as chatbot.js) ───────────────
  function slimLaso(ls) {
    if (!ls) return null;
    var palaces = (ls.palaces || []).map(function(p) {
      return {
        cungName:   p.cungName,
        diaChi:     p.diaChi,
        isMenh:     !!p.isMenh,
        isThan:     !!p.isThan,
        majorStars: (p.majorStars || []).map(function(s) { return { ten: s.ten, brightness: s.brightness, hoa: s.hoa }; }),
        stars:      (p.stars || []).slice(0, 12).map(function(s) { return { ten: s.ten, nhom: s.nhom, hoa: s.hoa }; }),
        cungScores: p.cungScores || null,
      };
    });
    var daiVans = (ls.daiVans || []).slice(0, 9).map(function(dv) {
      return { diaChi: dv.diaChi, tuoiStart: dv.tuoiStart, tuoiEnd: dv.tuoiEnd, cungIdx: dv.cungIdx,
               scoring: dv.scoring ? { tong: dv.scoring.tong, flag: dv.scoring.flag } : null };
    });
    var dvHT = ls.daiVanHienTai;
    return {
      _type:         'tuvi',
      canChiNam:     ls.canChiNam,
      napAm:         ls.napAm,
      napAmHanh:     ls.napAmHanh,
      menhDC:        ls.menhDC,
      thanDC:        ls.thanDC,
      tuoiXem:       ls.tuoiXem,
      cachCuc:       (Array.isArray(ls.cachCuc) ? ls.cachCuc : []).map(function(c) { return { ten: typeof c === 'object' ? c.ten : c }; }),
      palaces:       palaces,
      daiVans:       daiVans,
      daiVanHienTai: dvHT ? { diaChi: dvHT.diaChi, tuoiStart: dvHT.tuoiStart, tuoiEnd: dvHT.tuoiEnd,
                               cungIdx: dvHT.cungIdx,
                               scoring: dvHT.scoring ? { tong: dvHT.scoring.tong, flag: dvHT.scoring.flag } : null } : null,
    };
  }

  // ─── Suggestions ────────────────────────────────────────────────
  var SUGG_INIT = [
    'Tử Vi Đẩu Số là gì?',
    'Đại vận là gì và xem như thế nào?',
    'Cung Quan Lộc ảnh hưởng sự nghiệp ra sao?',
    'Tam phương tứ chính là gì?',
  ];
  var SUGG_AFTER_LASO = [
    'Luận giải Cung Mệnh',
    'Cung Quan Lộc (sự nghiệp)',
    'Cung Tài Bạch (tài chính)',
    'Cung Phu Thê (tình duyên)',
    'Đại vận hiện tại',
    'Điểm mạnh và yếu trong lá số',
  ];

  // ─── DOM helpers ────────────────────────────────────────────────
  function scrollToBottom() {
    if ($msgs) $msgs.scrollTop = $msgs.scrollHeight;
  }

  function appendMsg(role, content, isTyping) {
    var wrap = document.createElement('div');
    wrap.className = 'tc-msg ' + role + (isTyping ? ' typing' : '');
    if (isTyping) wrap.id = '_tc_typing';

    var av = document.createElement('div');
    av.className = 'tc-av';
    if (role === 'bot') {
      av.innerHTML = '<img src="/thay-tuvi.webp" style="width:28px;height:28px;border-radius:50%;object-fit:cover;display:block;" alt="">';
      av.style.background = 'transparent';
    } else {
      av.textContent = 'Bạn';
    }

    var bub = document.createElement('div');
    bub.className = 'tc-bub';
    if (isTyping) {
      bub.innerHTML = '<span class="tc-dot"></span><span class="tc-dot"></span><span class="tc-dot"></span>';
    } else {
      bub.innerHTML = content
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    wrap.appendChild(av);
    wrap.appendChild(bub);
    $msgs.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function renderSuggs(list) {
    $suggs.innerHTML = '';
    if (!list || !list.length) return;
    list.forEach(function(t) {
      var b = document.createElement('button');
      b.className = 'tc-sug';
      b.textContent = t;
      b.onclick = function() { send(t); };
      $suggs.appendChild(b);
    });
  }

  function autoResize() {
    $ta.style.height = 'auto';
    $ta.style.height = Math.min($ta.scrollHeight, 110) + 'px';
  }

  // ─── An Sao ─────────────────────────────────────────────────────
  function doAnSao() {
    var ngay   = parseInt(document.getElementById('tc-ngay').value)  || 0;
    var thang  = parseInt(document.getElementById('tc-thang').value) || 0;
    var nam    = parseInt(document.getElementById('tc-nam').value)   || 0;
    var gioIdx = parseInt(document.getElementById('tc-gio').value);
    var gt     = parseInt(document.getElementById('tc-gt').value);

    if (!ngay || ngay < 1 || ngay > 31) { alert('Vui lòng nhập ngày hợp lệ (1–31)'); return; }
    if (!thang || thang < 1 || thang > 12) { alert('Vui lòng nhập tháng hợp lệ (1–12)'); return; }
    if (!nam || nam < 1920 || nam > 2010) { alert('Vui lòng nhập năm sinh hợp lệ (1920–2010)'); return; }

    try {
      var al = convertDuongToAm(ngay, thang, nam, gioIdx);
      var ls = anSaoLaSo({
        ngayAL:   al.ngayAL,
        thangAL:  al.thangAL,
        namAL:    al.namAL,
        canNam:   al.canNam,
        chiNam:   al.chiNam,
        gioIdx:   gioIdx,
        gioitinh: gt,
        namXem:   NAM_XEM,
      });

      _lasoData = slimLaso(ls);

      // Build summary chip text
      var menh    = (ls.palaces || []).find(function(p) { return p.isMenh; });
      var chinh   = menh ? (menh.majorStars || []).map(function(s) { return s.ten; }).join(', ') || 'Vô chính diệu' : 'Vô chính diệu';
      var chipTxt = (ls.canChiNam || '') + ' · Cung Mệnh: ' + (ls.menhDC || '') + ' · ' + chinh;
      document.getElementById('tc-laso-chip-text').textContent = chipTxt;

      // Switch bars
      document.getElementById('tc-form-bar').style.display = 'none';
      document.getElementById('tc-laso-bar').style.display  = 'flex';

      // Build bot greeting
      var dvHT  = ls.daiVanHienTai;
      var dvTxt = dvHT
        ? 'Đại vận hiện tại: ' + dvHT.diaChi + ' (' + dvHT.tuoiStart + '–' + dvHT.tuoiEnd + ' tuổi).'
        : '';
      var cc    = (Array.isArray(ls.cachCuc) ? ls.cachCuc : []).map(function(c) { return typeof c === 'object' ? c.ten : c; }).join(', ');
      var greeting = 'Đã an sao xong! Bạn tuổi **' + (ls.canChiNam || '') + '**, bản mệnh **' + (ls.napAm || '') + '**. Cung Mệnh tại **' + (ls.menhDC || '') + '** có chính tinh **' + chinh + '**.' +
        (cc ? ' Cách cục nổi bật: ' + cc + '.' : '') +
        (dvTxt ? '\n' + dvTxt : '') +
        '\n\nBạn muốn tìm hiểu phần nào trước?';

      appendMsg('bot', greeting);
      _msgs.push({ role: 'assistant', content: greeting });
      renderSuggs(SUGG_AFTER_LASO);
      $ta.focus();

    } catch(e) {
      alert('Có lỗi khi an sao. Vui lòng kiểm tra lại ngày sinh.\n' + e.message);
      console.error('[TuviChat] an sao error', e);
    }
  }

  // ─── Send message ────────────────────────────────────────────────
  async function send(text) {
    text = (text || $ta.value).trim();
    if (!text || _busy) return;

    $ta.value = '';
    autoResize();
    $send.disabled = true;
    $suggs.innerHTML = '';

    appendMsg('user', text);
    _msgs.push({ role: 'user', content: text });

    _busy = true;
    appendMsg('bot', '', true);

    try {
      // RAG search
      var docs = '';
      try {
        var sr = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text, matchCount: 5 }),
        });
        docs = (await sr.json()).docs || '';
      } catch(e) { /* RAG optional */ }

      var res = await fetch(API_PATH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: _msgs.slice(-12),
          lasoData: _lasoData,
          scenario: _lasoData ? 'laso' : 'general',
          docs: docs,
        }),
      });

      var typing = document.getElementById('_tc_typing');
      if (typing) typing.remove();

      if (!res.ok) throw new Error(res.status);
      var data   = await res.json();
      var answer = data.answer || 'Xin lỗi, có lỗi xảy ra.';

      appendMsg('bot', answer);
      _msgs.push({ role: 'assistant', content: answer });
      renderSuggs(_lasoData ? SUGG_AFTER_LASO : SUGG_INIT);

    } catch(e) {
      var typing = document.getElementById('_tc_typing');
      if (typing) typing.remove();
      appendMsg('bot', 'Xin lỗi, có lỗi kết nối. Vui lòng thử lại.');
      console.error('[TuviChat] send error', e);
    }

    _busy = false;
    $send.disabled = !$ta.value.trim();
    $ta.focus();
  }

  // ─── Init ────────────────────────────────────────────────────────
  function init() {
    $msgs  = document.getElementById('tc-messages');
    $suggs = document.getElementById('tc-suggs');
    $ta    = document.getElementById('tc-input');
    $send  = document.getElementById('tc-send');

    // Initial bot greeting
    appendMsg('bot', 'Chào bạn! Nhập ngày sinh dương lịch bên trên để an sao lá số, sau đó hỏi tôi bất cứ điều gì.\n\nHoặc bạn có thể hỏi thẳng về Tử Vi Đẩu Số ngay bây giờ.');
    renderSuggs(SUGG_INIT);

    // An sao button
    document.getElementById('tc-an-sao-btn').addEventListener('click', doAnSao);

    // Enter on form inputs
    ['tc-ngay','tc-thang','tc-nam'].forEach(function(id) {
      document.getElementById(id).addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doAnSao();
      });
    });

    // Reset button
    document.getElementById('tc-reset-btn').addEventListener('click', function() {
      _lasoData = null;
      _msgs = [];
      $msgs.innerHTML = '';
      document.getElementById('tc-laso-bar').style.display  = 'none';
      document.getElementById('tc-form-bar').style.display  = '';
      appendMsg('bot', 'Chào bạn! Nhập ngày sinh dương lịch bên trên để an sao lá số, sau đó hỏi tôi bất cứ điều gì.\n\nHoặc bạn có thể hỏi thẳng về Tử Vi Đẩu Số ngay bây giờ.');
      renderSuggs(SUGG_INIT);
    });

    // Textarea
    $ta.addEventListener('input', function() {
      autoResize();
      $send.disabled = !$ta.value.trim() || _busy;
    });
    $ta.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!$send.disabled) send();
      }
    });

    // Send button
    $send.addEventListener('click', function() { send(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</html>

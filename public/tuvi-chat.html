<meta property="og:description" content="Chat trực tiếp về lá số Tử Vi Đẩu Số — an sao, luận giải từng cung, xem vận hạn và tương hợp trong một giao diện chat thông minh."/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#061A2E;--navy-mid:#0D3B5E;--blue:#1455A4;
  --gold:#9A7B3A;--gold-lt:#F9F4EB;--gold-bright:#c9a84c;
  --text:#1a1a1a;--text-mid:#444;--text-lt:#777;
  --border:#CCCCCC;--border-lt:#E8E8E8;
  --bg:#FFFFFF;--bg-soft:#FAFAF8;
  --green:#1E6B3C;--red:#C0392B;
}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}

/* ── Layout ── */
.page{max-width:860px;margin:0 auto;padding:0 20px}
@media(max-width:600px){.page{padding:0 14px}}

/* ── Hero strip ── */
.tc-hero{background:var(--navy);padding:0}
.tc-hero-inner{max-width:860px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.tc-hero-icon{width:36px;height:36px;background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.35);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tc-hero-title{font-size:17px;font-weight:700;color:#fff;font-family:'Noto Serif',Georgia,serif;line-height:1.2}
.tc-hero-sub{font-size:11px;color:#8BAACC;margin-top:1px}
@media(max-width:600px){
  .tc-hero-inner{padding:11px 14px}
  .tc-hero-sub{display:none}
}

/* ── Form section ── */
.tc-form-section{background:var(--gold-lt);border-bottom:2px solid #e8d9b0;padding:28px 0}
@media(max-width:600px){.tc-form-section{padding:18px 0}}

/* TuviForm overrides */
.tc-form-section .form-section{padding:0;border:none}
.tc-form-section .section-eyebrow{margin-bottom:16px}
.tc-form-section .form-grid{border-radius:8px;overflow:hidden}

/* Collapse 3-col form to 1 col on mobile */
@media(max-width:720px){
  .tc-form-section .form-grid{grid-template-columns:1fr!important;display:flex;flex-direction:column}
  .tc-form-section .form-col{border-right:none!important;border-bottom:1px solid var(--border);padding:18px 16px!important}
  .tc-form-section .form-col:last-child{border-bottom:none}
  /* Hide the 3rd col "Thực Thi" description text, keep just the button */
  .tc-form-section .form-col:last-child > p{display:none}
}

.tc-form-section .btn-submit{background:var(--navy);color:var(--gold-bright);border:none;padding:13px 28px;font-size:15px;font-family:'Noto Serif',Georgia,serif;font-weight:700;border-radius:4px;cursor:pointer;transition:background .2s}
.tc-form-section .btn-submit:hover{background:var(--navy-mid)}
.error-msg{display:none;color:var(--red);font-size:13px;margin-top:8px}
.error-msg.active{display:block}
.tc-form-section .form-input{background:transparent;border:none;border-bottom:1px solid var(--border);padding:10px 0;font-size:16px;color:var(--text);font-family:Arial,sans-serif;outline:none;transition:border-color .2s;width:100%}
.tc-form-section .form-input:focus{border-color:var(--navy)}

/* ── Lá số summary bar ── */
.tc-laso-bar{background:var(--gold-lt);border-bottom:1px solid #e8d9b0;padding:9px 20px;display:none;align-items:center;justify-content:space-between;gap:10px}
.tc-laso-bar.active{display:flex}
.tc-laso-chip{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--navy);font-weight:600;min-width:0}
.tc-laso-chip-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex-shrink:0}
.tc-laso-chip-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-btn-reset{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;font-size:11px;color:var(--text-lt);cursor:pointer;font-family:Arial,sans-serif;transition:border-color .15s,color .15s;white-space:nowrap;flex-shrink:0}
.tc-btn-reset:hover{border-color:var(--navy);color:var(--navy)}
@media(max-width:600px){.tc-laso-bar{padding:9px 14px}}

/* ── Chat section ── */
.tc-chat-section{padding:0 0 4px}

/* messages */
.tc-messages{padding:20px 0 8px;display:flex;flex-direction:column;gap:0;min-height:160px}
.tc-msg{display:flex;gap:9px;align-items:flex-end;margin-bottom:12px;animation:tc-in .18s ease}
@keyframes tc-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.tc-msg.user{flex-direction:row-reverse}
.tc-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.tc-msg.bot .tc-av{background:transparent}
.tc-msg.user .tc-av{background:var(--blue);color:#fff}
.tc-bub{max-width:72%;padding:10px 14px;font-size:14px;line-height:1.75;border-radius:14px}
.tc-msg.bot .tc-bub{background:#fff;color:var(--text);border:1px solid var(--border-lt);border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.tc-msg.user .tc-bub{background:var(--navy);color:#F9F4EB;border-bottom-right-radius:4px}
.tc-msg.typing .tc-bub{display:flex;gap:5px;align-items:center;padding:13px 16px}
.tc-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:tc-bounce 1.2s infinite}
.tc-dot:nth-child(2){animation-delay:.18s}.tc-dot:nth-child(3){animation-delay:.36s}
@keyframes tc-bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

@media(max-width:600px){
  .tc-bub{max-width:86%;font-size:14px}
  .tc-messages{padding:16px 0 6px}
}

/* suggestions — horizontal scroll on mobile */
.tc-suggs{display:flex;flex-wrap:wrap;gap:7px;padding:4px 0 14px}
.tc-sug{background:var(--bg-soft);border:1px solid var(--border-lt);border-radius:16px;padding:6px 14px;font-size:12.5px;color:var(--blue);cursor:pointer;font-family:Arial,sans-serif;transition:all .13s;line-height:1.4;white-space:nowrap}
.tc-sug:hover{background:#EBF3FF;border-color:var(--blue)}
@media(max-width:600px){
  .tc-suggs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;scrollbar-width:none}
  .tc-suggs::-webkit-scrollbar{display:none}
}

/* ── Input bar — sticky at bottom ── */
.tc-input-bar{
  position:sticky;
  bottom:0;
  background:var(--bg);
  border-top:1px solid var(--border-lt);
  padding:10px 20px;
  padding-bottom:max(10px, env(safe-area-inset-bottom, 10px));
  display:flex;gap:10px;align-items:flex-end;
  z-index:20;
  max-width:860px;
  margin:0 auto;
}
/* Sticky bar needs full-width background */
.tc-input-wrap{
  position:sticky;
  bottom:0;
  background:var(--bg);
  z-index:20;
  border-top:1px solid var(--border-lt);
}
.tc-input-inner{
  max-width:860px;margin:0 auto;
  padding:10px 20px;
  padding-bottom:max(10px, env(safe-area-inset-bottom, 10px));
  display:flex;gap:10px;align-items:flex-end;
}
@media(max-width:600px){.tc-input-inner{padding:8px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom,10px))}}

.tc-textarea{
  flex:1;border:1.5px solid var(--border);border-radius:9px;
  padding:9px 12px;
  font-size:16px; /* ≥16px prevents iOS auto-zoom */
  font-family:Arial,sans-serif;line-height:1.5;
  resize:none;max-height:120px;overflow-y:auto;
  background:var(--bg-soft);color:var(--text);
  outline:none;transition:border-color .15s;
}
.tc-textarea:focus{border-color:var(--navy);background:#fff}
.tc-textarea::placeholder{color:#bbb;font-size:15px}
.tc-send{
  width:40px;height:40px;border-radius:10px;
  background:var(--navy);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .15s,transform .1s;
}
.tc-send:hover:not(:disabled){background:var(--navy-mid)}
.tc-send:disabled{background:#C4C4C4;cursor:not-allowed}
.tc-hint{text-align:center;font-size:10px;color:#D0D0D0;padding:6px 0 10px;letter-spacing:.3px}
@media(max-width:600px){.tc-hint{display:none}}
/* extra bottom space so last message isn't hidden behind sticky input */
.tc-chat-section{padding-bottom:80px}
</style>
</head>
<body>

<div id="site-nav"></div>

<!-- Hero -->
<div class="tc-hero">
  <div class="tc-hero-inner">
    <div class="tc-hero-icon">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c9a84c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div>
      <div class="tc-hero-title">Tử Vi Chat</div>
      <div class="tc-hero-sub">An sao · Luận giải từng cung · Xem vận hạn — tất cả trong một chat</div>
    </div>
  </div>
</div>

<!-- Birth date form (hidden after an sao) -->
<div class="tc-form-section" id="tc-form-section">
  <div class="page">
    <div id="tc-form-container"></div>
    <p id="error-msg" class="error-msg"></p>
  </div>
</div>

<!-- Lá số summary bar (shown after an sao) -->
<div class="tc-laso-bar" id="tc-laso-bar">
  <div class="tc-laso-chip">
    <div class="tc-laso-chip-dot"></div>
    <span class="tc-laso-chip-text" id="tc-laso-chip-text"></span>
  </div>
  <button class="tc-btn-reset" id="tc-reset-btn">Đổi lá số</button>
</div>

<!-- Chat -->
<div class="tc-chat-section" id="tc-chat-section">
  <div class="page">
    <div class="tc-messages" id="tc-messages"></div>
    <div class="tc-suggs" id="tc-suggs"></div>
  </div>
</div>

<!-- Sticky input bar (outside .page to span full width background) -->
<div class="tc-input-wrap">
  <div class="tc-input-inner">
    <textarea id="tc-input" class="tc-textarea" placeholder="Hỏi về lá số, vận hạn, tương hợp..." rows="1"></textarea>
    <button id="tc-send" class="tc-send" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="tc-hint">Tử Vi Minh Bảo · Tử Vi Đẩu Số theo cổ pháp</div>
</div>

<script src="/nav.js?v=14"></script>
<script>
(function () {
  'use strict';

  var NAM_XEM  = 2027;
  var API_PATH = '/api/lasotuvi?action=chat';

  var _lasoData = null;
  var _msgs     = [];
  var _busy     = false;

  var $msgs, $suggs, $ta, $send;

  // ── Slim laso (same as chatbot.js) ───────────────────────────
  function slimLaso(ls) {
    if (!ls) return null;
    var palaces = (ls.palaces || []).map(function(p) {
      return {
        cungName:   p.cungName,
        diaChi:     p.diaChi,
        isMenh:     !!p.isMenh,
        isThan:     !!p.isThan,
        majorStars: (p.majorStars || []).map(function(s) { return { ten: s.ten, brightness: s.brightness, hoa: s.hoa }; }),
        stars:      (p.stars || []).slice(0, 12).map(function(s) { return { ten: s.ten, nhom: s.nhom, hoa: s.hoa }; }),
        cungScores: p.cungScores || null,
      };
    });
    var daiVans = (ls.daiVans || []).slice(0, 9).map(function(dv) {
      return { diaChi: dv.diaChi, tuoiStart: dv.tuoiStart, tuoiEnd: dv.tuoiEnd, cungIdx: dv.cungIdx,
               scoring: dv.scoring ? { tong: dv.scoring.tong, flag: dv.scoring.flag } : null };
    });
    var dvHT = ls.daiVanHienTai;
    return {
      _type:         'tuvi',
      canChiNam:     ls.canChiNam,
      napAm:         ls.napAm,
      menhDC:        ls.menhDC,
      thanDC:        ls.thanDC,
      tuoiXem:       ls.tuoiXem,
      cachCuc:       (Array.isArray(ls.cachCuc) ? ls.cachCuc : []).map(function(c) { return { ten: typeof c === 'object' ? c.ten : c }; }),
      palaces:       palaces,
      daiVans:       daiVans,
      daiVanHienTai: dvHT ? { diaChi: dvHT.diaChi, tuoiStart: dvHT.tuoiStart, tuoiEnd: dvHT.tuoiEnd,
                               cungIdx: dvHT.cungIdx,
                               scoring: dvHT.scoring ? { tong: dvHT.scoring.tong, flag: dvHT.scoring.flag } : null } : null,
    };
  }

  // ── Suggestions ──────────────────────────────────────────────
  var SUGG_INIT = [
    'Tử Vi Đẩu Số là gì?',
    'Đại vận là gì?',
    'Cung Quan Lộc và sự nghiệp',
    'Tam phương tứ chính',
  ];
  var SUGG_AFTER_LASO = [
    'Cung Mệnh',
    'Cung Quan Lộc',
    'Cung Tài Bạch',
    'Cung Phu Thê',
    'Đại vận hiện tại',
    'Điểm mạnh & yếu',
  ];

  // ── DOM helpers ──────────────────────────────────────────────
  function scrollToLatest() {
    // Scroll so the last message is visible above sticky input
    var lastMsg = $msgs.lastElementChild;
    if (lastMsg) lastMsg.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function appendMsg(role, content, isTyping) {
    var wrap = document.createElement('div');
    wrap.className = 'tc-msg ' + role + (isTyping ? ' typing' : '');
    if (isTyping) wrap.id = '_tc_typing';

    var av = document.createElement('div');
    av.className = 'tc-av';
    if (role === 'bot') {
      av.innerHTML = '<img src="/thay-tuvi.webp" style="width:28px;height:28px;border-radius:50%;object-fit:cover;display:block;" alt="">';
    } else {
      av.textContent = 'Bạn';
    }

    var bub = document.createElement('div');
    bub.className = 'tc-bub';
    if (isTyping) {
      bub.innerHTML = '<span class="tc-dot"></span><span class="tc-dot"></span><span class="tc-dot"></span>';
    } else {
      bub.innerHTML = content
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    wrap.appendChild(av);
    wrap.appendChild(bub);
    $msgs.appendChild(wrap);
    scrollToLatest();
    return wrap;
  }

  function renderSuggs(list) {
    $suggs.innerHTML = '';
    (list || []).forEach(function(t) {
      var b = document.createElement('button');
      b.className = 'tc-sug';
      b.textContent = t;
      b.onclick = function() { send(t); };
      $suggs.appendChild(b);
    });
  }

  function autoResize() {
    $ta.style.height = 'auto';
    $ta.style.height = Math.min($ta.scrollHeight, 120) + 'px';
  }

  // ── An Sao (called by TuviForm submit) ───────────────────────
  function doAnSao() {
    var d = TuviForm.getData();
    if (!d.ngay || !d.thang || !d.nam) return;

    try {
      var conv = convertDuongToAm(d.ngay, d.thang, d.nam, d.gioHour);
      var ls   = anSaoLaSo({
        ngayAL:   conv.amLich.day,
        thangAL:  conv.amLich.month,
        namAL:    conv.amLich.year,
        canNam:   conv.canNam,
        chiNam:   conv.chiNam,
        gioIdx:   d.gioIdx,
        gioitinh: d.gioitinh,
        namXem:   NAM_XEM,
      });

      _lasoData = slimLaso(ls);

      // Summary chip
      var menh    = (ls.palaces || []).find(function(p) { return p.isMenh; });
      var chinh   = menh ? (menh.majorStars || []).map(function(s) { return s.ten; }).join(', ') || 'Vô chính diệu' : 'Vô chính diệu';
      var chipTxt = (ls.canChiNam || '') + ' · Mệnh ' + (ls.menhDC || '') + ' · ' + chinh;
      document.getElementById('tc-laso-chip-text').textContent = chipTxt;

      // Switch UI
      document.getElementById('tc-form-section').style.display = 'none';
      document.getElementById('tc-laso-bar').classList.add('active');

      // Bot greeting
      var dvHT  = ls.daiVanHienTai;
      var dvTxt = dvHT ? '\nĐại vận hiện tại: **' + dvHT.diaChi + '** (' + dvHT.tuoiStart + '–' + dvHT.tuoiEnd + ' tuổi).' : '';
      var cc    = (Array.isArray(ls.cachCuc) ? ls.cachCuc : []).map(function(c) { return typeof c === 'object' ? c.ten : c; }).join(', ');
      var greeting =
        'Đã an sao xong! Bạn tuổi **' + (ls.canChiNam || '') + '**, bản mệnh **' + (ls.napAm || '') + '**.' +
        ' Cung Mệnh tại **' + (ls.menhDC || '') + '** có chính tinh **' + chinh + '**.' +
        (cc ? ' Cách cục: ' + cc + '.' : '') + dvTxt +
        '\n\nBạn muốn tìm hiểu phần nào?';

      appendMsg('bot', greeting);
      _msgs.push({ role: 'assistant', content: greeting });
      renderSuggs(SUGG_AFTER_LASO);

      // Scroll chat into view on mobile
      setTimeout(function() {
        document.getElementById('tc-chat-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        $ta.focus();
      }, 100);

    } catch(e) {
      console.error('[TuviChat] an sao error', e);
      var errEl = document.getElementById('error-msg');
      errEl.textContent = 'Có lỗi khi an sao: ' + e.message;
      errEl.classList.add('active');
    }
  }

  // ── Send message ─────────────────────────────────────────────
  async function send(text) {
    text = (text || $ta.value).trim();
    if (!text || _busy) return;

    $ta.value = '';
    autoResize();
    $send.disabled = true;
    $suggs.innerHTML = '';

    appendMsg('user', text);
    _msgs.push({ role: 'user', content: text });

    _busy = true;
    appendMsg('bot', '', true);

    try {
      var docs = '';
      try {
        var sr = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text, matchCount: 5 }),
        });
        docs = (await sr.json()).docs || '';
      } catch(e) { /* RAG optional */ }

      var res = await fetch(API_PATH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: _msgs.slice(-12),
          lasoData: _lasoData,
          scenario: _lasoData ? 'laso' : 'general',
          docs: docs,
        }),
      });

      var typing = document.getElementById('_tc_typing');
      if (typing) typing.remove();

      if (!res.ok) throw new Error(res.status);
      var data   = await res.json();
      var answer = data.answer || 'Xin lỗi, có lỗi xảy ra.';

      appendMsg('bot', answer);
      _msgs.push({ role: 'assistant', content: answer });
      renderSuggs(_lasoData ? SUGG_AFTER_LASO : SUGG_INIT);

    } catch(e) {
      var typing = document.getElementById('_tc_typing');
      if (typing) typing.remove();
      appendMsg('bot', 'Xin lỗi, có lỗi kết nối. Vui lòng thử lại.');
      console.error('[TuviChat] send error', e);
    }

    _busy = false;
    $send.disabled = !$ta.value.trim();
    $ta.focus();
  }

  // ── Init ─────────────────────────────────────────────────────
  function init() {
    $msgs  = document.getElementById('tc-messages');
    $suggs = document.getElementById('tc-suggs');
    $ta    = document.getElementById('tc-input');
    $send  = document.getElementById('tc-send');

    TuviForm.render('tc-form-container', {
      onSubmit:    doAnSao,
      submitLabel: 'An Sao & Chat →',
      showSample:  false,
    });

    appendMsg('bot', 'Chào bạn! Nhập ngày sinh dương lịch bên trên để an sao lá số, sau đó hỏi tôi bất cứ điều gì.\n\nHoặc hỏi thẳng về Tử Vi Đẩu Số ngay bây giờ.');
    renderSuggs(SUGG_INIT);

    document.getElementById('tc-reset-btn').addEventListener('click', function() {
      _lasoData = null;
      _msgs = [];
      $msgs.innerHTML = '';
      document.getElementById('tc-laso-bar').classList.remove('active');
      document.getElementById('tc-form-section').style.display = '';
      appendMsg('bot', 'Chào bạn! Nhập ngày sinh dương lịch bên trên để an sao lá số, sau đó hỏi tôi bất cứ điều gì.\n\nHoặc hỏi thẳng về Tử Vi Đẩu Số ngay bây giờ.');
      renderSuggs(SUGG_INIT);
      document.getElementById('error-msg').classList.remove('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    $ta.addEventListener('input', function() {
      autoResize();
      $send.disabled = !$ta.value.trim() || _busy;
    });
    $ta.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!$send.disabled) send();
      }
    });
    $send.addEventListener('click', function() { send(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>

</body>
</html>

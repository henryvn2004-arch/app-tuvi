<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lục Nhâm Giản — Tử Vi Minh Bảo</title>
<meta name="description" content="Lục Nhâm Giản — tra 12 thần tướng theo giờ/ngày, thần đang trực cát hay hung. Hỏi trợ lý AI luận cho việc gặp gỡ, cầu tài, xuất hành.">
<link rel="icon" type="image/webp" href="/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" as="style" onload="this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/shell.css?v=18">
<style>
.form-card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);max-width:600px}
.form-card h2{font-family:var(--serif);font-size:16px;font-weight:600;margin-bottom:3px}
.form-card p.sub{font-size:12.5px;color:var(--text-lt);margin-bottom:16px}
.frow{display:flex;gap:11px;flex-wrap:wrap;align-items:flex-end;margin-bottom:13px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:10.5px;font-weight:600;color:var(--text-lt);letter-spacing:.04em;text-transform:uppercase}
.fg input,.fg select{border:1px solid var(--line-2);border-radius:7px;padding:8px 10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--paper);outline:none}
.fg input{width:80px}
.fg input:focus,.fg select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(20,85,164,.12)}
.btn-go{background:var(--red);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--serif)}
.err{color:var(--tx-red);font-size:13px;margin-top:8px;display:none}.err.active{display:block}
#resPanel{display:none;max-width:820px}
.res-block{background:#fff;border:1px solid var(--border-lt);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.res-block-header{background:var(--navy);padding:12px 16px}
.res-block-title{color:#fff;font-family:var(--serif);font-size:15px;font-weight:700}
.res-block-body{padding:16px}
.than-wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:700px){.than-wheel{grid-template-columns:repeat(2,1fr)}}
.than-card{padding:14px 12px;border-radius:8px;border:1px solid var(--border-lt);text-align:center}
.than-card.active-than{background:#e8f0fe;border-color:#1455A4;outline:2px solid #1455A4}
.than-card.good{background:#eaf4ed;border-color:#c3e0cc}.than-card.bad{background:#fef0ef;border-color:#f5c0bc}
.than-name{font-size:13px;font-weight:700;color:var(--heading);margin-bottom:4px}
.than-gio{font-size:11px;color:var(--text-lt);margin-bottom:6px}
.than-type{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:2px}
.ty-good{background:#c3e0cc;color:#1E6B3C}.ty-bad{background:#f5c0bc;color:#C0392B}
.ask{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gold-soft);border:1px dashed var(--gold-soft);border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--gold-lt);font-family:inherit}
</style>
</head>
<body>

<div class="shell">
  <aside class="sb" id="shell-sidebar"></aside>

  <main class="ws" id="ws">
    <div class="ws-top">
      <button class="btn mobile-only" onclick="document.getElementById('shell-sidebar').classList.toggle('open');window.shellSyncBackdrop&&shellSyncBackdrop()" aria-label="Menu">☰</button>
      <div class="ws-title"><b>Lục Nhâm Giản</b><span>12 thần tướng theo giờ · ngày</span></div>
      <div class="ws-actions">
        <button class="btn" id="btnEdit" onclick="showForm()" style="display:none">Sửa</button>
        <button class="btn mobile-only" onclick="Shell.openRail()">✦ Hỏi</button>
      </div>
    </div>
    <div class="ws-body">
      <div id="introHost"></div>
      <div id="shellRecent"></div>
      <div class="form-card" id="birthPanel">
        <h2>Ngày &amp; giờ cần xem</h2>
        <p class="sub">Tra thần tướng đang trực tại giờ hỏi (cát/hung) theo Lục Nhâm, rồi hỏi trợ lý luận cho việc gặp gỡ, cầu tài, xuất hành.</p>
        <div class="frow">
          <div class="fg"><label>Ngày</label><input type="number" id="ngay" min="1" max="31" placeholder="1–31"></div>
          <div class="fg"><label>Tháng</label><input type="number" id="thang" min="1" max="12" placeholder="1–12"></div>
          <div class="fg"><label>Năm</label><input type="number" id="nam" min="1900" max="2100" placeholder="2026"></div>
        </div>
        <div class="frow" style="margin-bottom:4px">
          <div class="fg" style="flex:1;min-width:170px"><label>Giờ cần xem</label>
            <select id="gio">
              <option value="0">Giờ Tý (23–01h)</option><option value="1">Giờ Sửu (01–03h)</option>
              <option value="2">Giờ Dần (03–05h)</option><option value="3">Giờ Mão (05–07h)</option>
              <option value="4">Giờ Thìn (07–09h)</option><option value="5">Giờ Tỵ (09–11h)</option>
              <option value="6" selected>Giờ Ngọ (11–13h)</option><option value="7">Giờ Mùi (13–15h)</option>
              <option value="8">Giờ Thân (15–17h)</option><option value="9">Giờ Dậu (17–19h)</option>
              <option value="10">Giờ Tuất (19–21h)</option><option value="11">Giờ Hợi (21–23h)</option>
            </select>
          </div>
          <button class="btn-go" id="btnGo" onclick="calculate()">Xem quẻ →</button>
        </div>
        <div class="err" id="error-msg"></div>
      </div>

      <div id="resPanel" data-ws-result>
        <div class="res-block">
          <div class="res-block-header"><span class="res-block-title" id="resTitle">—</span></div>
          <div class="res-block-body" id="activeBox" style="margin-bottom:20px"></div>
          <div class="res-block-body" style="padding-top:0">
            <div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-lt);margin-bottom:12px">Tất Cả 12 Thần Tướng Trong Ngày</div>
            <div class="than-wheel" id="thanWheel"></div>
          </div>
        </div>
        <div class="ask" data-ask="Thần tướng đang trực nói lên điều gì cho việc tôi định làm (gặp gỡ / cầu tài / ký kết / xuất hành)? Nên hay không nên, cách hóa giải?">✦ Hỏi trợ lý luận thần tướng</div>
      </div>
    </div>
  </main>

  <aside class="rail" id="shell-rail"></aside>
</div>

<script>window.SHELL_ACTIVE='luc-nham';window.SHELL_HISTORY=true;
window.SHELL_INTRO={key:'luc-nham',title:'Lục Nhâm Giản',desc:'Tra <b>12 thần tướng theo giờ/ngày</b> — thần đang trực cát hay hung. Rồi hỏi <b>trợ lý AI</b> luận cho việc gặp gỡ, cầu tài, xuất hành.'};</script>
<script src="/tools-shared/luc-nham.js?v=2"></script>
<script src="/tools-shared/dai-luc-nham.js?v=1"></script>
<script src="/auth.js?v=2"></script>
  <script src="/nav.js?v=22" data-icons-only></script>
<script src="/shell.js?v=66"></script>
<script>
// Ô giữa dùng CHUNG /tools-shared/luc-nham.js với /tools/luc-nham.html.
// `luc-nham.js` nay CHỈ kiểm ngày + dựng tiêu đề. Phần thần tướng lấy từ
// /api/liuren — xem chú thích đầu `dai-luc-nham.js` về vì sao KHÔNG dùng lại
// bánh xe thiên tướng cũ (công thức đoán, chưa verify được).
function _khiTu(d,m,y,g){var hh=(g*2)%24;return new Date(Date.UTC(+y,+m-1,+d,hh-7,0,0));}
function calculate(){
  var _d=document.getElementById('ngay').value,_m=document.getElementById('thang').value,
      _y=document.getElementById('nam').value,_g=+document.getElementById('gio').value||0;
  var r=LucNhamTool.compute(_d,_m,_y,_g);
  var err=document.getElementById('error-msg');err.classList.remove('active');
  if(!r.ok){err.textContent=r.error;err.classList.add('active');return;}
  document.getElementById('resTitle').textContent=r.titleText;
  document.getElementById('thanWheel').innerHTML='';
  document.getElementById('birthPanel').style.display='none';
  document.getElementById('resPanel').style.display='block';
  document.getElementById('btnEdit').style.display='';
  if(window.SHELL_INTRO)Shell.dismissIntro(window.SHELL_INTRO.key);
  document.querySelectorAll('#resPanel [data-ask]').forEach(function(el){el.addEventListener('click',function(){Shell.ask(el.getAttribute('data-ask'));});});

  // Rail CHỈ bật khi đã có khóa thật — không đặt ngữ cảnh từ công thức cũ, vì
  // rail luận trên đó là luận trên số liệu chưa verify được.
  DaiLucNham.ve(document.getElementById('activeBox'),_khiTu(_d,_m,_y,_g)).then(function(j){
    if(!j){Shell.setShareable(null);return;}
    var k=j.khoa, so=k.tamTruyen[0];
    // ⚠️ payload gửi rail phải PHẲNG — `extractGenericContext` bỏ qua object.
    Shell.setContext({
      scenario:{type:'luc-nham',data:Object.assign({ngayDL:r.data.ngayDL,gio:r.data.gio},j.rail)},
      label:'Lục Nhâm · '+k.canChi.ngay+' giờ '+k.canChi.gio,
      greeting:'Đã lập khóa **Đại Lục Nhâm** — ngày '+k.canChi.ngay+', giờ '+k.canChi.gio+', '+k.truDem+
               '. Thủ truyền theo phép **'+k.phap.ten+'**, sơ truyền **'+so.chi+' · '+so.tuong+'**. Bạn muốn hỏi việc gì?',
      chips:['Việc này thành hay bại?','Bao giờ có kết quả?','Nên tiến hay nên lui?','Tam truyền nói gì về diễn tiến?']
    });
    Shell.setShareable({
      kind:'text', toolId:'luc-nham',
      title:'Khóa Lục Nhâm · '+k.canChi.ngay+' giờ '+k.canChi.gio,
      text:['Đại Lục Nhâm — ngày '+k.canChi.ngay+', giờ '+k.canChi.gio+' ('+k.truDem+')',
        'Nguyệt tướng '+k.nguyetTuong+' gia giờ chiêm '+k.chiemThoi+'; Quý Nhân '+k.quyNhan.thienBan,
        'Tứ khóa: '+k.tuKhoa.map(function(x){return x.tren+'/'+x.duoi+' '+x.tuong;}).join(' · '),
        'Tam truyền: '+k.tamTruyen.map(function(x){return x.ten+' '+x.chi+' ('+x.tuong+')';}).join(' → '),
        'Phép thủ truyền: '+k.phap.ten+' · Khóa thể: '+k.khoaThe.join(', ')
      ].join('\n')
    });
  });
}
function showForm(){document.getElementById('resPanel').style.display='none';document.getElementById('birthPanel').style.display='block';document.getElementById('btnEdit').style.display='none';Shell.setShareable(null);}
(function(){var t=new Date();document.getElementById('ngay').value=t.getDate();document.getElementById('thang').value=t.getMonth()+1;document.getElementById('nam').value=t.getFullYear();var h=t.getHours();document.getElementById('gio').value=Math.floor(((h*60+60)%(24*60))/120)%12;})();
['ngay','thang','nam'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter')calculate();});});
</script>
<script>/*SHELL_RESTORE_BOOT*/(function(){function _r(){var r=window.Shell&&Shell.pendingRestore&&Shell.pendingRestore();if(r&&r.form){Shell.fillForm(r.form);calculate();}}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',_r);else _r();})();</script>
</body>
</html>

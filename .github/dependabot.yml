version: 2
updates:
  # NPM dependencies (root + tuvi-engine subpackage)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 5
    labels: ['deps', 'npm']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']
        # Group all non-major bumps thành 1 PR/tuần để khỏi spam

  - package-ecosystem: 'npm'
    directory: '/tuvi-engine'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 3
    labels: ['deps', 'npm', 'engine']
    commit-message:
      prefix: 'chore(deps,engine)'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  # GitHub Actions versions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'Asia/Ho_Chi_Minh'
    open-pull-requests-limit: 3
    labels: ['deps', 'github-actions']
    commit-message:
      prefix: 'chore(actions)'
      include: 'scope'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

name: Smoke — Prod & Preview

on:
  # Sau khi Vercel post deployment_status thành công (CẢ production LẪN preview)
  deployment_status:
  # Cron fallback mỗi 6h (UTC) — phát hiện regression không qua deploy
  schedule:
    - cron: '0 */6 * * *'
  # Trigger thủ công khi cần
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Override PROD_URL'
        required: false
        default: 'https://tuviminhbao.com'

permissions:
  issues: write
  contents: read

jobs:
  smoke:
    # Chạy khi deployment_status = success, KHÔNG phân biệt môi trường nữa:
    # preview đã qua được cửa SSO nhờ secret bypass (xem bước "Set target URL").
    # Trước đây preview bị chặn ở đây → check hiện "skipped" trên mọi PR.
    # (cron + dispatch luôn pass điều kiện này)
    if: >
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      # Production đo THẲNG domain thật (gồm cả DNS + redirect apex→www + CDN);
      # preview thì đo chính URL vừa deploy. Lấy qua env chứ không nội suy
      # ${{ }} thẳng vào shell — target_url/input là chuỗi từ ngoài vào.
      - name: Set target URL
        id: url
        env:
          INPUT_URL: ${{ github.event.inputs.prod_url }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            URL="$INPUT_URL"
          elif [ "$ENVIRONMENT" = "production" ] || [ "$ENVIRONMENT" = "Production" ]; then
            URL="https://tuviminhbao.com"
          elif [ -n "$TARGET_URL" ]; then
            URL="$TARGET_URL"
          else
            URL="https://tuviminhbao.com"
          fi
          echo "val=$URL" >> "$GITHUB_OUTPUT"
          echo "Smoke target: $URL"

      - name: Run smoke tests
        id: smoke
        env:
          PROD_URL: ${{ steps.url.outputs.val }}
          # Chìa qua cửa Vercel Authentication trên preview. Thiếu secret thì
          # config bỏ header đi — prod vẫn chạy bình thường (domain prod không bị gác),
          # còn preview sẽ đỏ hàng loạt vì 401, đó là dấu hiệu secret chưa tới nơi.
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
          CI: true
        run: npm run test:smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report-smoke/
          retention-days: 14

      # CHỈ mở issue "prod-down" cho lượt đo PROD. Preview đỏ thì để check đỏ
      # trên PR là đủ — hô "prod chết" mỗi lần một PR hỏng thì vài hôm là
      # không ai đọc nhãn đó nữa.
      - name: Create issue on failure
        if: >
          failure() &&
          (github.event_name != 'deployment_status' ||
           github.event.deployment.environment == 'production' ||
           github.event.deployment.environment == 'Production')
        uses: actions/github-script@v9
        env:
          SMOKE_URL: ${{ steps.url.outputs.val }}
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName === 'schedule'
              ? 'cron 6h'
              : context.eventName === 'deployment_status'
                ? `deploy → ${context.payload.deployment?.environment ?? 'unknown'}`
                : context.eventName;

            const title = `[prod-down] Smoke test failed (${new Date().toISOString().slice(0,16)} UTC)`;
            const body = [
              `## Prod smoke test thất bại`,
              ``,
              `**Trigger:** ${trigger}`,
              `**URL:** ${process.env.SMOKE_URL}`,
              `**Run:** ${runUrl}`,
              ``,
              `### Cần làm`,
              `- [ ] Mở run trên để xem trace + screenshot`,
              `- [ ] Verify thủ công ${process.env.SMOKE_URL}`,
              `- [ ] Identify root cause + fix`,
              `- [ ] Close issue khi prod xanh lại`,
              ``,
              `*Auto-generated by .github/workflows/smoke-prod.yml*`
            ].join('\n');

            // Dedupe — không tạo issue mới nếu đã có 1 issue prod-down open
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-down',
              per_page: 5,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Smoke lại fail — ${runUrl}`,
              });
              console.log(`Đã comment vào issue #${existing[0].number} thay vì tạo mới`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['prod-down', 'bug'],
              });
              console.log(`Created issue #${issue.number}`);
            }

name: Smoke — Prod

on:
  # Sau khi Vercel post deployment_status thành công
  deployment_status:
  # Cron fallback mỗi 6h (UTC) — phát hiện regression không qua deploy
  schedule:
    - cron: '0 */6 * * *'
  # Trigger thủ công khi cần
  workflow_dispatch:
    inputs:
      prod_url:
        description: 'Override PROD_URL'
        required: false
        default: 'https://tuviminhbao.com'

permissions:
  issues: write
  contents: read

jobs:
  smoke:
    # Chỉ chạy khi deployment_status = success VÀ env = production
    # (cron + dispatch luôn pass điều kiện này)
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'production' ||
        github.event.deployment.environment == 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Set PROD_URL
        id: url
        run: |
          if [ -n "${{ github.event.inputs.prod_url }}" ]; then
            echo "val=${{ github.event.inputs.prod_url }}" >> $GITHUB_OUTPUT
          else
            echo "val=https://tuviminhbao.com" >> $GITHUB_OUTPUT
          fi

      - name: Run smoke tests
        id: smoke
        env:
          PROD_URL: ${{ steps.url.outputs.val }}
          CI: true
        run: npm run test:smoke

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ github.run_id }}
          path: playwright-report-smoke/
          retention-days: 14

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const trigger = context.eventName === 'schedule'
              ? 'cron 6h'
              : context.eventName === 'deployment_status'
                ? `deploy → ${context.payload.deployment?.environment ?? 'unknown'}`
                : context.eventName;

            const title = `[prod-down] Smoke test failed (${new Date().toISOString().slice(0,16)} UTC)`;
            const body = [
              `## Prod smoke test thất bại`,
              ``,
              `**Trigger:** ${trigger}`,
              `**URL:** https://tuviminhbao.com`,
              `**Run:** ${runUrl}`,
              ``,
              `### Cần làm`,
              `- [ ] Mở run trên để xem trace + screenshot`,
              `- [ ] Verify thủ công https://tuviminhbao.com`,
              `- [ ] Identify root cause + fix`,
              `- [ ] Close issue khi prod xanh lại`,
              ``,
              `*Auto-generated by .github/workflows/smoke-prod.yml*`
            ].join('\n');

            // Dedupe — không tạo issue mới nếu đã có 1 issue prod-down open
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'prod-down',
              per_page: 5,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body: `Smoke lại fail — ${runUrl}`,
              });
              console.log(`Đã comment vào issue #${existing[0].number} thay vì tạo mới`);
            } else {
              const { data: issue } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['prod-down', 'bug'],
              });
              console.log(`Created issue #${issue.number}`);
            }

name: Warm Ngày Tốt ISR — nightly

on:
  schedule:
    # 2:30am UTC every night — rotate through 17 năm over 17 đêm
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Năm cần warm (2020–2036, để trống = auto)'
        required: false
        type: string

jobs:
  warm-year:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pick year to warm
        id: pick
        run: |
          # Priority: ưu tiên năm gần (2026, 2027) trước
          YEARS=(2026 2027 2028 2025 2029 2030 2024 2031 2032 2023 \
                 2033 2034 2022 2035 2036 2021 2020)
          if [ -n "${{ github.event.inputs.year }}" ]; then
            YEAR="${{ github.event.inputs.year }}"
          else
            IDX=$(( ($(date +%j) - 1) % 17 ))
            YEAR="${YEARS[$IDX]}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "Warming ngày tốt năm: $YEAR"

      - name: Build URL list for year ${{ steps.pick.outputs.year }}
        id: build
        run: |
          YEAR="${{ steps.pick.outputs.year }}"
          BASE="https://www.tuviminhbao.com"

          ACTIVITIES=(cuoi-hoi khoi-cong khai-truong nhap-trach xuat-hanh \
                      cau-tai sinh-con an-tang dao-gieng sua-nha)

          TMPFILE=$(mktemp)

          # 1. Year hub (1)
          echo "${BASE}/ngay-tot/lich/${YEAR}" >> "$TMPFILE"

          # 2. 12 month overview
          for m in $(seq 1 12); do
            echo "${BASE}/ngay-tot/lich/${YEAR}/thang-${m}" >> "$TMPFILE"
          done

          # 3. 10 × 12 = 120 activity × month (HIGH PRIORITY — SEO long-tail)
          for act in "${ACTIVITIES[@]}"; do
            for m in $(seq 1 12); do
              echo "${BASE}/ngay-tot/${act}/${YEAR}/thang-${m}" >> "$TMPFILE"
            done
          done

          # 4. ~365 day-detail pages
          for m in $(seq 1 12); do
            case $m in
              1|3|5|7|8|10|12) max_d=31;;
              4|6|9|11)         max_d=30;;
              2)
                if (( YEAR % 4 == 0 && (YEAR % 100 != 0 || YEAR % 400 == 0) )); then
                  max_d=29
                else
                  max_d=28
                fi;;
            esac
            for d in $(seq 1 $max_d); do
              echo "${BASE}/ngay-tot/ngay/${YEAR}/${m}/${d}" >> "$TMPFILE"
            done
          done

          TOTAL=$(wc -l < "$TMPFILE")
          echo "Total URLs to warm: $TOTAL"
          echo "tmpfile=$TMPFILE" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"

      - name: Warm URLs (batches of 20, 2s cooldown)
        run: |
          TMPFILE="${{ steps.build.outputs.tmpfile }}"
          TOTAL="${{ steps.build.outputs.total }}"
          BATCH=20
          BATCH_NUM=0
          OK=0
          while IFS= read -r url; do
            curl -sf -o /dev/null --max-time 15 "$url" && OK=$((OK+1)) &
            BATCH_NUM=$(( BATCH_NUM + 1 ))
            if (( BATCH_NUM % BATCH == 0 )); then
              wait
              sleep 2
            fi
          done < "$TMPFILE"
          wait

          echo "Warmed $OK / $TOTAL URLs for năm ${{ steps.pick.outputs.year }}"
          rm -f "$TMPFILE"

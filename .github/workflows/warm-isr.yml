name: Warm ISR Cache — nightly

on:
  schedule:
    # Chạy 2 lần/ngày: 1:30am UTC (đêm) + 13:30 UTC (chiều VN)
    # → cycle qua 30 năm ưu tiên trong ~15 ngày mỗi lần
    - cron: '30 1  * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      birth_year:
        description: 'Birth year to warm (1960–2026, leave blank for auto)'
        required: false
        type: string

jobs:
  warm-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pick birth year
        id: pick
        run: |
          # Priority order: 1975-2000 (demographic cao nhất) trước, rồi mở rộng ra
          YEARS=(1985 1990 1980 1995 1975 1988 1992 1987 1983 1978 \
                 1998 2000 1970 1993 1996 1982 1986 1989 1991 1994 \
                 1997 1999 1976 1977 1979 1981 1984 1965 2005 2003)
          if [ -n "${{ github.event.inputs.birth_year }}" ]; then
            YEAR="${{ github.event.inputs.birth_year }}"
          else
            # Buổi sáng (run 1): chẵn theo %j; buổi chiều (run 2): lệch 15
            HOUR=$(date +%H)
            IDX=$(( ($(date +%j) - 1) % 30 ))
            if [ "$HOUR" -ge 12 ]; then
              IDX=$(( (IDX + 15) % 30 ))
            fi
            YEAR="${YEARS[$IDX]}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "Warming birth year: $YEAR"

      - name: Generate and warm ISR URLs for ${{ steps.pick.outputs.year }}
        run: |
          YEAR="${{ steps.pick.outputs.year }}"
          BASE="https://www.tuviminhbao.com"
          NAM_XEM=2027

          CAN=(giap at binh dinh mau ky canh tan nham quy)
          CHI=(ty suu dan mao thin ti ngo mui than dau tuat hoi)

          # Chỉ warm 4 giờ phổ biến nhất (chiếm ~80% traffic thực tế):
          # Tý (00:00), Ngọ (12:00), Mão (06:00), Dậu (18:00)
          # → giảm từ 12 giờ xuống 4: URL count 8,760 → 2,920 mỗi năm
          # → hoàn thành trong ~20 phút thay vì 128 phút
          GIOS=(ty ngo mao dau)

          can_idx=$(( (YEAR - 4) % 10 ))
          chi_idx=$(( (YEAR - 4) % 12 ))
          can_idx=$(( (can_idx + 10) % 10 ))
          chi_idx=$(( (chi_idx + 12) % 12 ))

          CAN_SLUG="${CAN[$can_idx]}"
          CHI_SLUG="${CHI[$chi_idx]}"

          echo "Can-chi slug: ${CAN_SLUG}-${CHI_SLUG}"

          # Build URL list
          TMPFILE=$(mktemp)
          for m in $(seq 1 12); do
            case $m in
              1|3|5|7|8|10|12) max_d=31;;
              4|6|9|11)         max_d=30;;
              2)
                if (( YEAR % 4 == 0 && (YEAR % 100 != 0 || YEAR % 400 == 0) )); then
                  max_d=29
                else
                  max_d=28
                fi;;
            esac
            MM=$(printf "%02d" $m)
            for d in $(seq 1 $max_d); do
              DD=$(printf "%02d" $d)
              for gio in "${GIOS[@]}"; do
                for gioi in nam nu; do
                  echo "${BASE}/la-so/${CAN_SLUG}-${CHI_SLUG}-${DD}-${MM}-${YEAR}-gio-${gio}-${gioi}-${NAM_XEM}" >> "$TMPFILE"
                done
              done
            done
          done

          TOTAL=$(wc -l < "$TMPFILE")
          echo "Total URLs to warm: $TOTAL"

          # Batch 50 (tăng từ 25) + cooldown 1s (giảm từ 2s)
          # → throughput gấp đôi, vẫn an toàn cho Vercel
          BATCH=50
          BATCH_NUM=0
          while IFS= read -r url; do
            curl -sf -o /dev/null --max-time 25 "$url" &
            BATCH_NUM=$(( BATCH_NUM + 1 ))
            if (( BATCH_NUM % BATCH == 0 )); then
              wait
              sleep 1
            fi
          done < "$TMPFILE"
          wait

          echo "Done warming $TOTAL URLs for birth year $YEAR"
          rm -f "$TMPFILE"

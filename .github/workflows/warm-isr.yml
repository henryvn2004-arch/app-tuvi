name: Warm ISR Cache — nightly

on:
  schedule:
    # 1:30am UTC every night — rotate through 51 birth years over 51 nights
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      birth_year:
        description: 'Birth year to warm (1960–2010, leave blank for auto)'
        required: false
        type: string

jobs:
  warm-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Pick birth year
        id: pick
        run: |
          # Priority order: high-traffic years first (1980–2000), then rest
          YEARS=(1985 1990 1980 1995 1975 1988 1992 1987 1983 1978 \
                 1970 1965 1998 2000 2005 1960 1962 1963 1964 1966 \
                 1967 1968 1969 1971 1972 1973 1974 1976 1977 1979 \
                 1981 1982 1984 1986 1989 1991 1993 1994 1996 1997 \
                 1999 2001 2002 2003 2004 2006 2007 2008 2009 2010 2010)
          if [ -n "${{ github.event.inputs.birth_year }}" ]; then
            YEAR="${{ github.event.inputs.birth_year }}"
          else
            IDX=$(( ($(date +%j) - 1) % 51 ))
            YEAR="${YEARS[$IDX]}"
          fi
          echo "year=$YEAR" >> "$GITHUB_OUTPUT"
          echo "Warming birth year: $YEAR"

      - name: Generate and warm ISR URLs for ${{ steps.pick.outputs.year }}
        run: |
          YEAR="${{ steps.pick.outputs.year }}"
          BASE="https://www.tuviminhbao.com"
          NAM_XEM=2027

          CAN=(giap at binh dinh mau ky canh tan nham quy)
          CHI=(ty suu dan mao thin ti ngo mui than dau tuat hoi)
          GIOS=(ty suu dan mao thin ti ngo mui than dau tuat hoi)

          can_idx=$(( (YEAR - 4) % 10 ))
          chi_idx=$(( (YEAR - 4) % 12 ))
          # bash modulo can be negative for years near boundary — clamp
          can_idx=$(( (can_idx + 10) % 10 ))
          chi_idx=$(( (chi_idx + 12) % 12 ))

          CAN_SLUG="${CAN[$can_idx]}"
          CHI_SLUG="${CHI[$chi_idx]}"

          echo "Can-chi slug: ${CAN_SLUG}-${CHI_SLUG}"

          # Build URL list
          TMPFILE=$(mktemp)
          for m in $(seq 1 12); do
            case $m in
              1|3|5|7|8|10|12) max_d=31;;
              4|6|9|11)         max_d=30;;
              2)
                if (( YEAR % 4 == 0 && (YEAR % 100 != 0 || YEAR % 400 == 0) )); then
                  max_d=29
                else
                  max_d=28
                fi;;
            esac
            MM=$(printf "%02d" $m)
            for d in $(seq 1 $max_d); do
              DD=$(printf "%02d" $d)
              for gio in "${GIOS[@]}"; do
                for gioi in nam nu; do
                  echo "${BASE}/la-so/${CAN_SLUG}-${CHI_SLUG}-${DD}-${MM}-${YEAR}-gio-${gio}-${gioi}-${NAM_XEM}" >> "$TMPFILE"
                done
              done
            done
          done

          TOTAL=$(wc -l < "$TMPFILE")
          echo "Total URLs to warm: $TOTAL"

          # Warm in parallel batches of 25, with 2s cooldown between batches
          BATCH=25
          BATCH_NUM=0
          while IFS= read -r url; do
            curl -sf -o /dev/null --max-time 20 "$url" &
            BATCH_NUM=$(( BATCH_NUM + 1 ))
            if (( BATCH_NUM % BATCH == 0 )); then
              wait
              sleep 2
            fi
          done < "$TMPFILE"
          wait

          echo "Done warming $TOTAL URLs for birth year $YEAR"
          rm -f "$TMPFILE"

name: Lighthouse CI

on:
  # Chạy SAU khi Vercel deploy xong, KHÔNG phải lúc mở PR.
  #
  # 🔑 Trigger cũ (`pull_request`) bắn khi bản deploy chưa tồn tại, nên Lighthouse
  # luôn rơi về 4 URL prod cứng trong lighthouserc.json — tức đo BẢN ĐANG CHẠY
  # chứ không đo PR. Cùng lỗi đã vá cho smoke (#463) và E2E (#466).
  deployment_status:
  workflow_dispatch:
    inputs:
      lhci_url_override:
        description: 'Override URLs (comma-sep). Khi mobile_audit=true: dùng làm HOST GỐC để ghép 8 đường dẫn của lighthouserc.mobile-audit.json'
        required: false
      mobile_audit:
        description: 'Chạy lượt CHẨN ĐOÁN mobile (8 trang, đủ 4 category) thay cho 2 lượt thường'
        required: false
        default: 'false'

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    # Skip trên nhánh Dependabot — không relevant cho dep bump, và Dependabot
    # không có quyền dùng secrets. Với deployment_status thì `github.actor` là
    # bên tạo deployment chứ không còn là dependabot, nên nhận diện qua REF.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       !startsWith(github.event.deployment.ref, 'dependabot/'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Production (và cron/dispatch không có payload) → để RỖNG, `lhci` dùng
      # nguyên 4 URL prod khai trong lighthouserc.json. Preview → giữ đúng 4
      # ĐƯỜNG DẪN đó nhưng ghép sang host vừa deploy.
      #
      # 🔑 Danh sách đường dẫn đọc THẲNG từ lighthouserc.json, không chép tay
      # sang đây — chép là hai bản sẽ trôi khỏi nhau.
      # 🔑 Vé qua SSO gắn vào QUERY, KHÔNG dùng `extraHeaders` của Lighthouse:
      # header lạ áp lên cả request khác origin sẽ bị CORS chặn (đã trả giá ở
      # #466 với fonts.gstatic.com) và làm hỏng chính con số đang đo.
      - name: Determine target URLs
        id: targets
        env:
          INPUT_URLS: ${{ github.event.inputs.lhci_url_override }}
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          TARGET_URL: ${{ github.event.deployment_status.target_url }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          if [ -n "$INPUT_URLS" ]; then
            echo "urls=$(echo "$INPUT_URLS" | tr ',' ' ')" >> "$GITHUB_OUTPUT"
            echo "Lighthouse target: override"
          elif [ "$ENVIRONMENT" = "production" ] || [ "$ENVIRONMENT" = "Production" ] || [ -z "$TARGET_URL" ]; then
            echo "urls=" >> "$GITHUB_OUTPUT"
            echo "Lighthouse target: prod (theo lighthouserc.json)"
          else
            echo "urls=$(node scripts/lhci-preview-urls.mjs)" >> "$GITHUB_OUTPUT"
            echo "Lighthouse target: preview"
          fi

      - name: Run Lighthouse CI
        if: github.event.inputs.mobile_audit != 'true'
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        # Mỗi URL một cờ riêng — `--collect.url="a,b"` không tách thành nhiều URL,
        # nó sẽ đo đúng một địa chỉ có dấu phẩy rồi hỏng im lặng.
        run: |
          URLS='${{ steps.targets.outputs.urls }}'
          if [ -n "$URLS" ]; then
            ARGS=""
            for u in $URLS; do ARGS="$ARGS --collect.url=$u"; done
            npx lhci autorun $ARGS
          else
            npx lhci autorun
          fi

      # Lượt MOBILE cho trang đang chạy quảng cáo (lighthouserc.mobile.json).
      # Chỉ chạy ở deployment PRODUCTION (và workflow_dispatch) vì config đó ghim
      # URL prod — bản preview vẫn do lượt desktop phía trên lo.
      #
      # `continue-on-error` CÓ CHỦ ĐÍCH, đi kèm ngưỡng 'warn' trong config: mục
      # tiêu lúc này là LẤY ĐƯỢC SỐ cho một trang chưa từng được đo, không phải
      # dựng thêm một cổng chặn khi chưa biết baseline. Siết lên 'error' + bỏ cờ
      # này sau khi có vài lượt đo thật.
      - name: Run Lighthouse CI (mobile — trang quảng cáo)
        if: >
          github.event.inputs.mobile_audit != 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           github.event.deployment.environment == 'production' ||
           github.event.deployment.environment == 'Production')
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: npx lhci autorun --config=lighthouserc.mobile.json

      # ── Lượt CHẨN ĐOÁN mobile (bấm tay, mobile_audit=true) ─────────────────
      # THAY CHO hai lượt trên chứ không cộng thêm: 8 URL × 2 lượt đã ~11 phút,
      # cộng lượt desktop (12 lượt) là vượt `timeout-minutes: 20` của job.
      #
      # `continue-on-error` + không có khối `assert` trong config: đây là bước
      # ĐO, không phải cổng chặn. Dựng ngưỡng khi chưa có baseline thì chỉ đẻ ra
      # một bộ dò kêu oan rồi bị tắt đi — CLAUDE.md cấm.
      - name: Lighthouse mobile — chẩn đoán 8 trang
        if: github.event.inputs.mobile_audit == 'true'
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          INPUT_URL: ${{ github.event.inputs.lhci_url_override }}
          BYPASS: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          # Config ghim URL PROD. Không có cách ghép sang host khác thì mọi lượt
          # bấm tay đều đo bản đang chạy — tức đo đúng thứ PR chưa hề đụng tới,
          # đúng cái bẫy đã vá cho smoke (#463), E2E (#466) và lượt desktop ở
          # trên. Đưa host vào `lhci_url_override` thì đo bản vừa deploy.
          #
          # `lhci-preview-urls.mjs` nhận `LHCI_RC` nên dùng lại được nguyên xi:
          # nó giữ đúng các ĐƯỜNG DẪN khai trong config và chỉ đổi host, nên
          # không có bản chép tay nào để trôi.
          if [ -n "$INPUT_URL" ]; then
            ARGS=""
            for u in $(TARGET_URL="$INPUT_URL" LHCI_RC=lighthouserc.mobile-audit.json node scripts/lhci-preview-urls.mjs); do
              ARGS="$ARGS --collect.url=$u"
            done
            npx lhci autorun --config=lighthouserc.mobile-audit.json $ARGS
          else
            npx lhci autorun --config=lighthouserc.mobile-audit.json
          fi

      # In thẳng vào log job: artifact `.lighthouseci/` là zip, đọc lại phải tải
      # + giải nén ngoài CI; log thì đọc được ngay.
      - name: In bảng kết quả mobile
        if: ${{ always() && github.event.inputs.mobile_audit == 'true' }}
        run: node scripts/lh-mobile-report.mjs

      # 🔑 `include-hidden-files` BẮT BUỘC ở đây: `.lighthouseci/` bắt đầu bằng
      # dấu chấm, mà upload-artifact loại file ẩn theo mặc định ⇒ từ trước tới
      # nay bước này luôn kết thúc bằng "No files were found" và artifact báo
      # cáo Lighthouse RỖNG, dù lhci vẫn ghi đủ file vào đó. Hai artifact kia
      # (`playwright-report*`) không ẩn nên không dính.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report-${{ github.run_id }}
          path: .lighthouseci/
          retention-days: 14
          include-hidden-files: true

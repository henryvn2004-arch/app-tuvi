name: Lint & Format

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      # Chặn tái phát giá chép cứng: giá chỉ sửa trong trang Admin, client đọc
      # qua ToolPrices. Đồng bộ bằng tay đã sai bốn lần trong một ngày.
      - name: Không có giá chép cứng
        run: npm run check:prices

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # lib/agent/tools.ts import từ tuvi-engine/dist → cần build engine trước
      - name: Build engine (dist cho @/lib/agent imports)
        run: cd tuvi-engine && npm ci && npm run build

      - name: Typecheck (tsc --noEmit toàn app)
        run: npm run typecheck

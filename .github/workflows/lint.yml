name: Lint & Format

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      # Chặn tái phát giá chép cứng: giá chỉ sửa trong trang Admin, client đọc
      # qua ToolPrices. Đồng bộ bằng tay đã sai bốn lần trong một ngày.
      - name: Không có giá chép cứng
        run: npm run check:prices

      # Chặn tái phát bảng 64 quẻ sai mã hào: đã có lúc 49/64 quẻ mang mã của
      # quẻ khác (77% lượt gieo ra sai lời đoán) mà không gì báo, vì nhánh "tìm
      # quẻ gần nhất" nuốt hết. 64 chuỗi nhị phân thì mắt không soi được.
      - name: Bảng 64 quẻ Kinh Dịch đúng mã hào
        run: npm run check:hexagrams

      # check:terms gọi ENGINE THẬT nên cần `tuvi-engine/dist` (gitignore, không
      # có sẵn sau checkout). Job `typecheck` có bước này rồi, job `lint` thì
      # chưa — đó chính là lý do lượt chạy đầu đỏ.
      - name: Build engine (check:terms nạp tuvi-engine/dist)
        run: cd tuvi-engine && npm ci && npm run build

      # Bảng dịch phải phủ đủ nguồn — bộ dò này đã bắt được 4 lỗi thật
      # (2 chữ Hán lọt giao diện Kỳ Môn/Lục Nhâm, 1 ở Bát Tự, 1 chữ Anh ở Bản Đồ Sao).
      - name: Check bảng dịch thuật ngữ cổ pháp
        run: npm run check:terms

      # Bảng 384 hào từ dài 64 mục × 14 chuỗi. Thiếu một hào là người gieo trúng
      # quẻ đó nhận một ô TRỐNG — mắt không soi hết 64 quẻ được.
      - name: Bảng 384 hào từ đầy đủ
        run: npm run check:hao

      # Bộ 64 bức tranh vẽ MỘT LẦN, mỗi bức ~4.000đ. Quẻ thiếu mô-típ vẫn vẽ ra
      # một bức đẹp — chỉ là không khớp hào nào. Phải chặn TRƯỚC khi đốt tiền.
      - name: Bảng mô-típ tranh 64 quẻ đầy đủ
        run: npm run check:motifs

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # lib/agent/tools.ts import từ tuvi-engine/dist → cần build engine trước
      - name: Build engine (dist cho @/lib/agent imports)
        run: cd tuvi-engine && npm ci && npm run build

      - name: Typecheck (tsc --noEmit toàn app)
        run: npm run typecheck

# Build APK Android cho vỏ Capacitor (mobile/) — KHÔNG cần Android Studio cục bộ.
#
# Chạy: tab Actions → "Build Android APK" → Run workflow (hoặc tự chạy khi đổi mobile/).
# Lấy APK: mở lần chạy → mục Artifacts → tải "app-debug-apk" → cài vào điện thoại
# (bật "Cài từ nguồn không xác định"). APK debug, không cần ký store.
#
# FCM: đặt secret repo GOOGLE_SERVICES_JSON = toàn bộ nội dung google-services.json
# (từ Firebase). Chưa có secret → build bằng file DUMMY (mobile/google-services.template.json)
# chỉ để KIỂM TRA build; APK đó push KHÔNG chạy (config giả). Có secret → APK thật.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor deps
        run: npm ci

      - name: Generate Android project
        run: npx cap add android

      - name: Write google-services.json (secret hoặc dummy)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "→ Dùng secret GOOGLE_SERVICES_JSON (FCM thật)."
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "→ CHƯA có secret → dùng DUMMY (chỉ kiểm tra build; push KHÔNG chạy)."
            cp google-services.template.json android/app/google-services.json
          fi

      - name: Apply google-services Gradle plugin
        run: |
          grep -q "com.google.gms:google-services" android/build.gradle || \
            sed -i "/classpath 'com.android.tools.build:gradle/a\\        classpath 'com.google.gms:google-services:4.4.2'" android/build.gradle
          grep -q "com.google.gms.google-services" android/app/build.gradle || \
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          echo "--- android/build.gradle (buildscript) ---"; sed -n '1,30p' android/build.gradle

      - name: Capacitor sync
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Đăng APK lên Releases → tải trực tiếp file .apk trên điện thoại (không zip,
      # không cần đăng nhập vì repo public). Tag cố định apk-latest → luôn ghi đè bản mới.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: APK mới nhất (debug)
          prerelease: true
          files: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK debug tự build từ CI. Tải **app-debug.apk** bên dưới → mở file trên
            điện thoại → bật "Cài từ nguồn không xác định" → Cài. Build lại sẽ ghi đè.
